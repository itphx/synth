# Конфигурация secret-scan для репозитория synth (ADR-052/ADR-089 и окружение CI).
#
# Потребители конфига:
#   * `scripts/secret-scan.mjs` — обязательный шаг гейта релиза (`scripts/security-gate.mjs`)
#     и локального pre-flight; зависимостей нет (node + git), поэтому работает на раннере
#     GitVerse без внешней сети;
#   * gitleaks (8.19+), если он запускается вручную/локально — набор правил совместим,
#     но семантика allowlist у него УЖЕ: gitleaks пропускает файл целиком, как только
#     условие `paths` глобального allowlist'а совпало, и `regexes` того же блока при этом
#     НЕ проверяются (проверено на gitleaks 8.30.1: `skipping file: global allowlist`).
#     То есть у gitleaks любой блок с `paths` — подавление файла целиком, независимо от
#     маркера. Авторитетный для релиза сканер — `scripts/secret-scan.mjs` (он и в CI, и в
#     гейте): у него условия блока объединяются через И, и маркер действительно сужает
#     подавление до конкретных строк.
#
# Семантика allowlist: условия *внутри* одного блока объединяются через И (AND), между
# блоками — через ИЛИ (OR). Поэтому фикстуры тестов подавляются парой «путь + известный
# dummy-маркер»: реальный секрет, случайно попавший в тот же файл, будет найден (в отличие
# от подавления целого файла по пути).
#
# Исключение из правила — ровно два блока (4 и 6), подавляемые строго по пути
# (path-only BY DESIGN, см. комментарии к ним): это файлы, целиком состоящие из
# ключевого материала фикстур, где маркер не может отличить фикстуру от настоящего ключа
# (у обоих заголовок `-----BEGIN PRIVATE KEY-----`).
#
# `${...}`-строки окружения (`${{ secrets.GV_TOKEN }}` и т.п.) секретами не являются —
# это подстановки CI, а не литеральные креды.
#
# Проверено: gitleaks 8.30.1 + trufflehog 3.99.2 (аудит 0.10.1) и scripts/secret-scan.mjs.

[extend]
useDefault = true

# 1. Примеры curl с плейсхолдерами в API-справочнике (`Bearer admin-key-123`,
#    `synth_svc_<...>`, `whk_<...>`): не креды, а документация. RU уже был в allowlist,
#    EN-версия приведена в соответствие (те же строки, тот же FP).
#    Подавление — парой «путь + dummy-маркер» (AND), а НЕ по одному пути: реальный секрет,
#    случайно попавший в тот же файл, остаётся находкой.
#    Наблюдаемые FP (проверено gitleaks 8.30.1, правило `curl-auth-header`): литерал
#    `admin-key-123` — 4 строки в `docs/API_V2.md` (952, 1004, 1009, 1011) и 4 строки
#    в `docs/en/API_V2.md` (954, 1006, 1011, 1013). `synth_svc_<` / `whk_<` — плейсхолдеры
#    с angle-brackets: настоящий service-key (`synth_svc_`+base64url) и webhook-id
#    (`whk_`+uuid) символа `<` не содержат, поэтому маркер их поймать не может.
#    Собственный сканер (`scripts/secret-scan.mjs`) на этих файлах не срабатывает вовсе:
#    `admin-key-123` короче порога правила `authorization-bearer` (24 символа).
[[allowlists]]
description = "примеры curl с плейсхолдерами в API-справочнике (RU и EN)"
paths = [
  '''docs/API_V2\.md$''',
  '''docs/en/API_V2\.md$''',
]
regexes = [
  '''admin-key-123''',
  '''synth_svc_<''',
  '''whk_<''',
]
regexTarget = "line"

# 2. Workflow релиза: base64-обёртка подстановок CI-секретов (`b64('itphx:' +
#    '${{ secrets.GV_TOKEN }}')`) — секреты приходят из окружения GitVerse, в коде их нет.
#    Подавление — парой «путь + dummy-маркер» (AND): реальный литеральный кред в этом
#    workflow остаётся находкой.
#    Наблюдаемый FP (проверено gitleaks 8.30.1, правило `curl-auth-user`): 1 срабатывание
#    в истории — `curl -fsS --user "itphx:${{ secrets.GV_TOKEN }}" \` (коммит 8efca732,
#    строка 360); в текущем дереве тот же конструктор заменён на
#    `b64('itphx:' + '${{ secrets.GV_TOKEN }}')` и правилом больше не ловится.
#    Маркер — синтаксис CI-подстановки `${{ secrets.NAME }}`: литеральный кред такой формы
#    не имеет, поэтому настоящая утечка маркеру не соответствует и остаётся находкой.
[[allowlists]]
description = "base64-обёртка подстановок CI-секретов в release-workflow"
paths = [
  '''\.gitverse/workflows/release\.yaml$''',
]
regexes = [
  '''\$\{\{\s*secrets\.[A-Za-z_]+\s*\}\}''',
]
regexTarget = "line"

# 3. Тестовые фикстуры ключей/сервис-ключей: подавляются только перечисленные dummy-значения
#    (AND с путём), поэтому реальный ключ в тех же файлах остаётся находкой.
#    `regexTarget = "line"` — проверка по строке (как в scripts/secret-scan.mjs).
#    Маркер `synth_svc_external[-]secret-123` записан с `[-]`, чтобы сам конфиг не выглядел
#    секретом для правил сканера (иначе файл находил бы «секрет» в собственных regexes).
[[allowlists]]
description = "тестовые фикстуры ключей (dummy-маркеры в unit-тестах, не реальные креды)"
paths = [
  '''packages/backend/src/routes/ssh-keys\.test\.ts$''',
  '''packages/backend/src/routes/service-keys\.test\.ts$''',
  '''packages/core/src/server/routes/ssh-keys\.test\.ts$''',
  '''packages/core/src/storage/ssh-key-store\.test\.ts$''',
  '''packages/core/src/storage/service-api-key-store\.test\.ts$''',
  '''packages/core/src/security/rotate\.test\.ts$''',
  '''packages/core/src/engine/tools/git-ssh\.test\.ts$''',
  '''packages/core/src/server/app\.fs-upload-limit\.test\.ts$''',
  '''packages/core/src/server/app\.legacy-local-owner\.test\.ts$''',
  '''packages/core/src/engine/mcp/manager\.executor\.test\.ts$''',
  '''packages/core/src/execution/contract/remote\.test\.ts$''',
  '''packages/core/src/execution/remote-dispatch\.test\.ts$''',
  '''packages/executor/src/client\.test\.ts$''',
  '''packages/executor/src/mcp-routes\.test\.ts$''',
  '''packages/executor/src/server\.test\.ts$''',
  '''packages/core/src/engine/plugins/remote/loader\.test\.ts$''',
  '''packages/core/src/engine/plugins/remote/client\.test\.ts$''',
  '''packages/core/src/engine/plugins/plugin-contract-remote\.test\.ts$''',
]
regexes = [
  '''manager-executor-token''',
  '''plugin-remote-loader-token''',
  '''plugin-client-token-test''',
  '''plugin-contract-remote-token''',
  '''executor-contract-token''',
  '''executor-matrix-token''',
  '''executor-client-token-test''',
  '''executor-token-test''',
  '''backend-secret''',
  '''test-key-material''',
  '''SECRET_MARKER''',
  '''SUPERSECRETPRIVATEKEYMATERIAL''',
  '''NEWSECRETMATERIAL''',
  '''synth_svc_external[-]secret-123''',
  '''fs-upload-limit-test-key''',
  '''legacy-local-owner-key''',
]
regexTarget = "line"

# 3.1. Имена env-переменных как плейсхолдер значения токена (ADR-077, ADR-052):
#      в примерах конфигурации executor'а и в схеме конфигурации ядра значение
#      токена — это ИМЯ переменной (`SYNTH_EXECUTOR_TOKEN`), а не секрет.
#      Подавление строго по двум путям и по имени переменной; реальный секрет
#      в этих файлах остаётся находкой.
[[allowlists]]
description = "имена env-переменных как плейсхолдер значения токена (не секрет)"
paths = [
  '''packages/executor/src/config\.ts$''',
  '''packages/shared/src/config/execution\.ts$''',
]
regexes = [
  '''SYNTH_EXECUTOR_TOKEN''',
  '''SYNTH_EXECUTION_TOKEN''',
]
regexTarget = "line"

# 4. Фикстура самоподписанного TLS-ключа (ADR-099): throwaway-ключ для
#    интеграционного теста единого доверия TLS/CA (`node:https` + `egressFetch`),
#    не реальный кред. Подавляем строго по пути фикстуры — правило не отключается.
#    ⚠️ Этот блок — ОДНО из двух намеренных исключений из правила «путь + dummy-маркер»
#    (path-only BY DESIGN, не по недосмотру): файл целиком состоит из ключевого материала,
#    а настоящий PEM-ключ имеет тот же заголовок `-----BEGIN PRIVATE KEY-----`, поэтому
#    маркер не отличил бы фикстуру от реального ключа. Безопасно именно потому, что
#    каталог `packages/core/src/security/__fixtures__/` содержит ТОЛЬКО материал фикстур
#    (3 файла `.key` + 3 файла `.pem`, production-кода нет — проверено): подавление
#    ограничено конкретным файлом фикстуры, а не каталогом и не деревом исходников.
#    Правило `private-key` не отключается: ключ в любом другом файле (в т.ч. в этом же
#    каталоге под другим именем) остаётся находкой.
[[allowlists]]
description = "тестовый самоподписанный TLS-ключ (фикстура ADR-099, TEST ONLY)"
paths = [
  '''packages/core/src/security/__fixtures__/tls-test-selfsigned\.key$''',
]

# 5. Inline-PEM-фикстуры приватного ключа в unit-тесте TLS-резолверов (ADR-099):
#    строка-литерал с PEM-маркерами приватного ключа (BEGIN и END на одной строке,
#    тело `QUJD` = base64 «ABC») — правило `private-key` считает это ключом; на деле
#    это dummy-фикстура «есть PEM-разметка», не реальный кред. Подавляем парой
#    «путь + dummy-маркер» (AND), поэтому реальный ключ в том же файле останется находкой.
[[allowlists]]
description = "inline-PEM фикстуры приватного ключа в тесте TLS-резолверов (ADR-099, TEST ONLY)"
paths = [
  '''packages/shared/src/config/tls\.test\.ts$''',
]
regexes = [
  '''QUJD''',
]
regexTarget = "line"

# 6. Фикстуры PEM-ключей прокси (ADR-099): `tls-test-proxy.key` — throwaway RSA-2048 для
#    интеграционных тестов TLS-прокси, `tls-test-proxy-client.key` — mTLS-клиент к нему.
#    Каталог `__fixtures__/` содержит ТОЛЬКО материал фикстур (проверено: 28 строк PEM,
#    production-кода нет), поэтому подавление строго по пути — как в блоке 4.
#    Правило `private-key` при этом не отключается: ключ, попавший в любой другой файл
#    (в т.ч. в этот каталог под другим именем), остаётся находкой.
#    ⚠️ Этот блок — ВТОРОЕ из двух намеренных исключений из правила «путь + dummy-маркер»
#    (path-only BY DESIGN, не по недосмотру): оба файла целиком состоят из ключевого
#    материала, а настоящий PEM-ключ имеет тот же заголовок `-----BEGIN PRIVATE KEY-----`,
#    поэтому маркер не отличил бы фикстуру от реального ключа. Безопасно именно потому,
#    что каталог `packages/core/src/security/__fixtures__/` содержит ТОЛЬКО материал фикстур
#    (3 файла `.key` + 3 файла `.pem`, production-кода нет — проверено): подавление
#    ограничено конкретными файлами фикстур, а не каталогом и не деревом исходников.
[[allowlists]]
description = "тестовые PEM-ключи прокси в каталоге фикстур ADR-099 (TEST ONLY)"
paths = [
  '''packages/core/src/security/__fixtures__/tls-test-proxy\.key$''',
  '''packages/core/src/security/__fixtures__/tls-test-proxy-client\.key$''',
]

# 7. Inline-PEM-заглушки приватного ключа в unit-тестах (ADR-099): однострочный литерал
#    вида «PEM-заголовок + \n + короткое dummy-тело + \n + PEM-конец», где тело — короткая
#    заглушка (`MIIE`, `QUJD`, `REVG`, `KEYDATA`, `KEY`). Правило `private-key` считает такой
#    литерал ключом, хотя это заглушка «есть PEM-разметка», а не кред. Маркер привязан И к
#    заголовку, И к телу, поэтому настоящий ключ в том же файле (длинное base64-тело) маркеру
#    не соответствует и остаётся находкой. В `\\n` — экранированный перевод строки исходника
#    теста (TS-литерал), а не настоящий перевод строки: реальный PEM-файл так не совпадёт.
[[allowlists]]
description = "inline-PEM заглушки приватного ключа в unit-тестах (ADR-099, TEST ONLY)"
paths = [
  '''packages/shared/src/config/proxy-profiles\.test\.ts$''',
  '''packages/storage-postgres/src/pool-tls\.test\.ts$''',
  '''packages/ui/src/components/settings/ProxyStatusSection\.test\.tsx$''',
  '''packages/ui/src/components/settings/proxy-draft\.test\.ts$''',
]
regexes = [
  '''BEGIN PRIVATE KEY-----\\nMIIE\\n''',
  '''BEGIN PRIVATE KEY-----\\nQUJD\\n''',
  '''BEGIN PRIVATE KEY-----\\nREVG\\n''',
  '''BEGIN PRIVATE KEY-----\\nKEYDATA\\n''',
  '''BEGIN PRIVATE KEY-----\\nKEY\\n''',
]
regexTarget = "line"

# 8. Ложные срабатывания `url-basic-auth` в тестах прокси (ADR-099): правило ловит URL с
#    userinfo (логин и пароль перед `@`), а в фикстурах это заведомо мёртвые пароли
#    `super-secret` и `urlsecret`. Маркер — тело мёртвых кредов вместе с `@`, поэтому настоящая
#    утечка (реальный пароль в userinfo того же URL) маркеру не соответствует и остаётся
#    находкой. Хосты (`proxy.corp`, `http.corp`, `ui-proxy`, `config-proxy`) маркерами НЕ
#    служат: они не являются причиной срабатывания, а такой маркер поймал бы настоящий пароль
#    на том же хосте.
[[allowlists]]
description = "dummy-креды в URL прокси в тестах (ADR-099, TEST ONLY)"
paths = [
  '''packages/core/src/server/routes/settings-proxy\.test\.ts$''',
  '''packages/shared/src/config/proxy\.test\.ts$''',
  '''packages/shared/src/config/proxy-profiles\.test\.ts$''',
]
regexes = [
  '''super-secret@''',
  '''urlsecret@''',
]
regexTarget = "line"

# 9. Ложное срабатывание `generic-credential-literal` в тесте настроек метрик: константа
#    `TOKEN` со значением вида «test-metrics-token-…» — заведомо тестовый bearer.
#    Маркер — уникальный dummy-префикс `test-metrics-token`, поэтому настоящий токен
#    в том же файле остаётся находкой.
[[allowlists]]
description = "тестовый bearer-токен в тесте настроек метрик (TEST ONLY)"
paths = [
  '''packages/core/src/server/routes/metrics-settings\.test\.ts$''',
]
regexes = [
  '''test-metrics-token''',
]
regexTarget = "line"
