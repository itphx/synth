# Конфигурация авто-генерации release notes GitHub.
# Категории сопоставляются с метками PR; тип определяется по Conventional Commits.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feat
    - title: Bug Fixes
      labels:
        - fix
    - title: Documentation
      labels:
        - docs
    - title: Refactoring
      labels:
        - refactor
    - title: Tests
      labels:
        - test
    - title: CI
      labels:
        - ci
    - title: Chores
      labels:
        - chore
    - title: Other Changes
      labels:
        - "*"
