# Продуктовый tmux.conf образа исполнителя Synth.
#
# Где лежит: `/etc/synth/tmux.conf` — часть образа (`docker/Dockerfile.executor`,
# копируется из `docker/executor/tmux.conf`). В `$HOME` пользователя он
# попадает симлинком (`~/.tmux.conf` → `/etc/synth/tmux.conf`); симлинк
# заводит `docker/executor-init.sh` при старте контейнера (при
# `readOnlyRootFilesystem` `$HOME` — `emptyDir`, и симлинк из сборки том
# скрывает). Если `~/.tmux.conf` уже есть — не трогаем: переопределение
# пользователя важнее.
#
# Назначение — tmux ВНУТРИ веб-терминала, вручную (ADR терминалов): tmux не
# является backend'ом терминала и продуктовой живучести не даёт — сессия
# tmux не переживает перезапуск пода.

# Терминал и цвет: `tmux-256color` (не `screen-256color` — без RGB терминалы
# теряют цвет) и RGB для всех клиентов.
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# Нулевая задержка на escape-последовательности: в веб-терминале каждая
# задержка видна как «залипшая» клавиша.
set -g escape-time 0

# События фокуса окна (клиент терминала умеет).
set -g focus-events on

# История и буферы: 10 000 строк истории, 20 буферов copy-mode.
set -g history-limit 10000
set -g buffer-limit 20

# Нумерация с единицы (привычнее) — и у окон, и у панелей.
set -g base-index 1
setw -g pane-base-index 1

# Vi-раскладка в режиме copy-mode.
setw -g mode-keys vi

# Мышь, перерисовка и размер окна — под интерактивную работу человека.
set -g mouse on
set -g aggressive-resize on
set -g window-size latest

# Копирование в буфер обмена (OSC 52) и passthrough-последовательности:
# клиент терминала (xterm.js) умеет и то, и другое.
set -g set-clipboard on
set -g allow-passthrough on

# Заголовок окна — «индекс:имя», чтобы терминал было видно в UI.
set -g set-titles on
set -g set-titles-string "#I:#W"

# `extended-keys` НЕ включаем: клиент терминала (xterm.js) не понимает
# CSI-u — присылаемые модернизированным профилем xterm последовательности
# клавиш в нём не интерпретируются, и ввод «разъезжается». Оставляем
# классические последовательности.

# Статус-бар: НЕ перерисовывается по таймеру (`status-interval 0`) — в образе
# нет ни `#()`-подпроцессов, ни battery/online-status/sysstat/powerline
# (каждый такой вызов — лишний процесс в контейнере; в статус-баре веб-терминала
# они всё равно не нужны).
set -g status-interval 0
