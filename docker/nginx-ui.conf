# nginx для synth-ui: статика + reverse-proxy на synth-backend.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Backend-прокси для API/WS (паролится на backend-сервис, порт 5000).
  location /api/ {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /auth/ {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /admin/ {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # WebSocket-прокси (EventHub /ws/events).
  location /ws/ {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA-fallback: отдавать index.html на все не-API пути.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
