# nginx для synth-ui: статика + reverse-proxy на synth-backend.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Backend-прокси для API/WS (паролится на backend-сервис, порт 5000).
  location /api/ {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /auth/ {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /admin/ {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # WebSocket-прокси (EventHub /ws/events).
  location /ws/ {
    proxy_pass http://synth-backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # PWA: манифест отдаём с корректным MIME и без кэша.
  # default_type задаёт Content-Type, т.к. расширение .webmanifest
  # отсутствует в стандартном mime.types (не заменяем весь типовой map).
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # PWA: service worker не кэшировать, чтобы обновления сразу прилетали.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Vite-ассеты с хешем в имени неизменны — кэшируем надолго.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA-fallback: отдавать index.html на все не-API пути.
  # HTML-шелл всегда ревалидируется (при внутреннем redirect заголовок сохраняется).
  #
  # Content-Security-Policy — СОГЛАСОВАНА ПОБАЙТОВО с core
  # (`packages/core/src/server/app/static.ts` → `UI_CONTENT_SECURITY_POLICY`,
  # совпадение строк проверяет `static.test.ts`, иначе «две разные политики»).
  # Обоснование директив — там же, в комментарии к константе (в т.ч. почему
  # `style-src 'unsafe-inline'` и хэши инлайн-бутстрапов).
  #
  # Заголовок стоит именно в `location /`, а не на уровне `server`: nginx не
  # наследует `add_header` сервера в location, где есть собственный `add_header`
  # (а у `/` он свой — `Cache-Control`), поэтому объявление на уровне сервера
  # молча терялось бы. CSP нужна документу (SPA-шелл/`diag.html`); на подресурсах
  # (`/assets/`, `/sw.js`, манифест) она не влияет на их загрузку — браузер
  # применяет CSP документа, а не подресурса.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-MMhFazxtuMIPPkuMwnmXCKpXQEcfdAFwPeO4AMhxusM=' 'sha256-bCDmoN59JH37oVd/UoltmCDavDiBTQeK7E+RZBHsLjc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
