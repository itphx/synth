name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        description: 'Тип версии (по SemVer)'
      pre_release:
        type: boolean
        default: false
        description: 'Предварительный релиз (pre-release)'
      dry_run:
        type: boolean
        default: false
        description: 'Проверка без публикации (dry-run)'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # --- Ручной bump версии (только для workflow_dispatch) ---
  version-bump:
    name: Bump версии
    if: ${{ gitverse.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      prev_version: ${{ steps.bump.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GV_TOKEN }}

      - name: Установка pnpm
        run: npm install -g pnpm@12.14.0

      - name: Вычислить новую версию
        id: bump
        run: |
          CURRENT=$(node -e "console.log(require('./packages/synth/package.json').version)")
          BUMP="${{ inputs.bump || 'patch' }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            *)     NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "Текущая: $CURRENT → Новая: $NEW"
          echo "current_version=$CURRENT" >> "$GITVERSE_OUTPUT"
          echo "new_version=$NEW" >> "$GITVERSE_OUTPUT"

      - name: Обновить version.ts
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          sed -i "s/export const SYNTH_VERSION = '[^']*';/export const SYNTH_VERSION = '$NEW';/" packages/shared/src/version.ts

      - name: Обновить package.json
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          for pkg_dir in packages/shared packages/core packages/storage-postgres packages/backend packages/ui packages/sdk packages/synth; do
            node -e "
              const fs = require('fs');
              const p = require('./$pkg_dir/package.json');
              p.version = '$NEW';
              fs.writeFileSync('./$pkg_dir/package.json', JSON.stringify(p, null, 2) + '\n');
            "
          done
          echo "Все package.json обновлены до $NEW"

      - name: Обновить Chart.yaml
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          node -e "
            const fs = require('fs');
            const path = './charts/synth/Chart.yaml';
            let y = fs.readFileSync(path, 'utf8');
            y = y.replace(/^version:.*$/m, 'version: ' + '$NEW');
            y = y.replace(/^appVersion:.*$/m, 'appVersion: \"' + '$NEW' + '\"');
            fs.writeFileSync(path, y);
          "
          echo "charts/synth/Chart.yaml обновлён до $NEW"

      - name: Коммит + тег
        if: ${{ !inputs.dry_run }}
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          git config user.name "synth-bot"
          git config user.email "bot@synth.dev"
          git add packages/shared/src/version.ts packages/*/package.json charts/synth/Chart.yaml
          git commit -m "chore: bump version to v$NEW"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push --follow-tags

  # --- CI проверки ---
  lint-and-test:
    name: CI проверки
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Установка pnpm
        run: npm install -g pnpm@12.14.0

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Драйвер хранилища собирается тем же шагом: рекурсивный `pnpm test` ниже включает
      # тесты core, а тесты деградации (storage-context.degraded.test.ts) не гейтятся
      # SYNTH_TEST_POSTGRES_DSN и динамически импортируют `@itphx/synth-storage-postgres` —
      # без его собранного dist прогон падает (StorageBackendUnavailableError).
      # Тот же шаг есть в ci.yaml (джоба `test-core`); порядок — shared → core → драйвер.
      - name: Сборка @itphx/synth-shared, @itphx/synth-core и @itphx/synth-storage-postgres
        run: |
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-storage-postgres build

      - name: TypeScript (typecheck)
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Тесты
        run: pnpm test

  # --- Обязательный внутренний аудит безопасности (гейт релиза) ---
  #
  # Джоба идёт ДО сборки артефактов: `build.needs` включает её, поэтому changelog,
  # publish-npmjs, publish-gitverse-npm, build-docker, create-release, publish-helm и
  # publish-github без неё не запускаются (GitVerse пропускает зависимые джобы).
  #
  # Проверка — scripts/security-gate.mjs (без внешних зависимостей):
  #   * запись аудита docs/security/releases/<version>.json для РЕЛИЗУЕМОЙ версии —
  #     обязательна и содержательна (статусы проверок с command/result; waiver-статусов нет);
  #   * негативная матрица авторизации сессий присутствует и проходит (vitest);
  #   * secret-scan по рабочему дереву (включая новые файлы) и по всей истории;
  #   * ратчет уязвимостей зависимостей по активному профилю из policy.json.
  #
  # Версия — fail-closed: `--version` из вывода version-bump (workflow_dispatch) либо
  # `--ref` = тег (push тега); если ни то, ни другое не дало SemVer — гейт падает (exit 2),
  # релиз с неопределённой версией не собирается. Эти же два источника используются
  # в build-docker/create-release/publish-helm/publish-github.
  #
  # dry_run -> --soft: замечания печатаются, но не блокируют (прогон пайплайна без публикации).
  security-gate:
    name: Внутренний аудит безопасности
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # История и теги нужны secret-scan (режимы commits/blobs) и проверке,
          # что коммит записи аудита — предок релизуемого.
          fetch-depth: 0

      - name: Установка pnpm
        run: npm install -g pnpm@12.14.0

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка @itphx/synth-shared и @itphx/synth-core
        run: |
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build

      - name: Аудит безопасности (запись релиза + матрица авторизации + secret-scan + зависимости)
        run: |
          SOFT=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then SOFT="--soft"; fi
          node scripts/security-gate.mjs --version "${{ needs.version-bump.outputs.version }}" --ref "${{ gitverse.ref }}" --report tmp/security/evidence.json $SOFT

      # Evidence (отпечатки записи/политики/HEAD и результаты каждой проверки) — доказательство
      # аудита в артефактах рана; отсутствие файла не должно маскировать ошибку гейта.
      - name: Загрузить evidence аудита как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: tmp/security/evidence*.json
          if-no-files-found: warn

  # --- Сборка ---
  build:
    name: Сборка релизных артефактов
    # security-gate обязателен: без успешного внутреннего аудита (запись релизуемой версии
    # + secret-scan + матрица авторизации + ратчет зависимостей) артефакты не собираются.
    needs: [lint-and-test, security-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Установка pnpm
        run: npm install -g pnpm@12.14.0

      - name: Сборка всех пакетов
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-storage-postgres build
          pnpm --filter @itphx/synth-ui build
          pnpm --filter @itphx/synth-backend build
          pnpm --filter @itphx/synth-sdk build
          pnpm --filter @itphx/synth build

      - name: Загрузить бандл как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: synth-bundle
          path: packages/synth/dist/cli.js

  # --- Генерация CHANGELOG ---
  changelog:
    name: Генерация CHANGELOG
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Сгенерировать CHANGELOG
        id: changelog
        run: bash scripts/changelog.sh

      - name: Загрузить CHANGELOG как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog-partial.md

  # --- Публикация npm ---
  # Таймаут 30 мин (было 10): npm отдаёт опубликованную версию с задержкой
  # 4–6 мин (автоматический review/репликация), и 6 пакетов + верификация в
  # scripts/publish-packages.sh не укладываются в 10 мин. На 0.10.1 джоба была
  # срезана таймаутом уже после публикации всех 6 пакетов — при том что публикация
  # прошла успешно, джоба «упала».
  publish-npmjs:
    name: npmjs.org
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Установка + сборка
        run: |
          npm install -g pnpm@12.14.0
          pnpm install --frozen-lockfile
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-storage-postgres build
          pnpm --filter @itphx/synth-ui build
          pnpm --filter @itphx/synth-backend build
          pnpm --filter @itphx/synth-sdk build
          pnpm --filter @itphx/synth build

      - name: Публикация в npmjs.org
        run: |
          npm config set "//registry.npmjs.org/:_authToken" "${{ secrets.NPM_TOKEN }}"
          bash scripts/publish-packages.sh https://registry.npmjs.org

  publish-gitverse-npm:
    name: GitVerse Package Registry
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установка + сборка
        run: |
          npm install -g pnpm@12.14.0
          pnpm install --frozen-lockfile
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-storage-postgres build
          pnpm --filter @itphx/synth-ui build
          pnpm --filter @itphx/synth-backend build
          pnpm --filter @itphx/synth-sdk build
          pnpm --filter @itphx/synth build

      - name: Публикация в GitVerse Package Registry
        run: |
          npm config set "//gitverse.ru/api/packages/itphx/npm/:_authToken" "${{ secrets.GV_TOKEN }}"
          bash scripts/publish-packages.sh https://gitverse.ru/api/packages/itphx/npm/

  # --- Публикация Docker ---
  # Тег latest намеренно НЕ публикуется: квота «Пакеты» в GitVerse считает размер
  # каждой версии без дедупликации, а latest и версия указывают на один digest —
  # публикуются только версионные теги (иначе перелимит 500 МБ на репозиторий;
  # на 0.9.0 вышло 607,4 МБ из 500). Старые теги удаляет шаг «Очистка…».
  # Docker-образ ставит @itphx/synth@<version> из npmjs (npm install -g),
  # поэтому ждём публикации npmjs — иначе гонка: kaniko не находит пакет (ETARGET)
  # Таймаут 75 мин (было 45): к amd64-пути kaniko добавлены arm64-сборки buildx
  # (три образа) и manifest list; на 0.10.1 прежние 20 мин уже не хватало на
  # шесть пушей в два реестра.
  #
  # multi-arch: amd64 собирает kaniko (как раньше, :<version>), arm64 — buildx
  # (:<version>-arm64). Затем best-effort manifest list :<version> из
  # -amd64/-arm64; если реестр не принимает index — остаются per-arch теги.
  # Dockerfile'ы кросс-собираются без QEMU: builder на $BUILDPLATFORM, в target
  # нет RUN (см. docker/Dockerfile*).
  build-docker:
    name: Docker образ
    needs: [build, publish-npmjs]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Определить теги
        id: docker_tags
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.version-bump.outputs.version }}"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
          fi
          echo "version=$VERSION" >> "$GITVERSE_OUTPUT"

      - name: Ожидание доступности версии в npmjs
        run: bash scripts/wait-npm-version.sh "${{ steps.docker_tags.outputs.version }}"

      # Авторизация сразу в двух реестрах: gitverse.ru (как раньше) и ghcr.io
      # (все три базовых образа — synth/synth-backend/synth-ui — зеркалируются
      # в GitHub Container Registry).
      # Пользователь для ghcr.io — владелец токена GH_TOKEN; переопределяется
      # необязательным секретом GHCR_USER (по умолчанию владелец репозитория).
      - name: Авторизация для Docker Registry (gitverse.ru + ghcr.io)
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: |
          mkdir -p "${{ gitverse.workspace }}/.docker"
          node -e "
            const fs = require('fs');
            const b64 = (s) => Buffer.from(s).toString('base64');
            const gv = b64('itphx:' + '${{ secrets.GV_TOKEN }}');
            const ghUser = process.env.GHCR_USER || 'itphx';
            const gh = b64(ghUser + ':' + '${{ secrets.GH_TOKEN }}');
            const config = { auths: {
              'gitverse.ru': { auth: gv },
              'ghcr.io': { auth: gh },
            } };
            fs.writeFileSync('${{ gitverse.workspace }}/.docker/config.json', JSON.stringify(config));
          "
          chmod 600 "${{ gitverse.workspace }}/.docker/config.json"

      - name: Очистка старых Docker-образов (gitverse)
        env:
          GV_TOKEN: ${{ secrets.GV_TOKEN }}
        run: node scripts/docker-cleanup.mjs synth synth-backend synth-ui

      # Политика образов: все три БАЗОВЫХ образа (synth, synth-backend, synth-ui)
      # публикуются в ДВА реестра — gitverse.ru (основной) и ghcr.io (зеркало
      # GitHub-контура). Будущие дополнительные/full-образы (flavor-образы из
      # PROP-082: dev/devops/browser/full и т.п.) пойдут ТОЛЬКО в Docker Hub —
      # лимит размера артефактов GHCR ~500 МБ. Только версионный тег, без `latest`.
      - name: Сборка и публикация Docker образа synth (kaniko → gitverse.ru + ghcr.io)
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ gitverse.workspace }}
            --dockerfile=docker/Dockerfile
            --build-arg=SYNTH_VERSION=${{ steps.docker_tags.outputs.version }}
            --destination=gitverse.ru/itphx/synth:${{ steps.docker_tags.outputs.version }}
            --destination=ghcr.io/itphx/synth:${{ steps.docker_tags.outputs.version }}
            --snapshot-mode=redo
            --push-retry=3
            --verbosity=info

      - name: Сборка и публикация Docker образа synth-backend (kaniko)
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ gitverse.workspace }}
            --dockerfile=docker/Dockerfile.backend
            --build-arg=SYNTH_BACKEND_VERSION=${{ steps.docker_tags.outputs.version }}
            --destination=gitverse.ru/itphx/synth-backend:${{ steps.docker_tags.outputs.version }}
            --destination=ghcr.io/itphx/synth-backend:${{ steps.docker_tags.outputs.version }}
            --snapshot-mode=redo
            --push-retry=3
            --verbosity=info

      - name: Сборка и публикация Docker образа synth-ui (kaniko)
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ gitverse.workspace }}
            --dockerfile=docker/Dockerfile.ui
            --build-arg=SYNTH_UI_VERSION=${{ steps.docker_tags.outputs.version }}
            --destination=gitverse.ru/itphx/synth-ui:${{ steps.docker_tags.outputs.version }}
            --destination=ghcr.io/itphx/synth-ui:${{ steps.docker_tags.outputs.version }}
            --snapshot-mode=redo
            --push-retry=3
            --verbosity=info

      # --- arm64 + multi-arch manifest list ---
      # buildx ставится в DOCKER_CONFIG-каталог (туда же, где config.json с
      # авторизацией двух реестров), чтобы плагин был виден последующим шагам.
      - name: Установка buildx (arm64/multi-arch)
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        run: bash scripts/offline-images.sh --ensure-buildx

      # arm64-образы собираются без QEMU (в целевой стадии Dockerfile нет RUN)
      # и пушатся как :<version>-arm64 в оба реестра. Проверка запуска для чужой
      # архитектуры пропускается, если binfmt не зарегистрирован.
      - name: Сборка и публикация arm64 (buildx → gitverse.ru + ghcr.io)
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        run: |
          # Multi-arch требует Docker-демон: buildx не умеет работать без него
          # (драйверы docker и docker-container оба ходят в /var/run/docker.sock),
          # а раннер GitVerse — контейнер без сокета. amd64-образы к этому моменту
          # уже опубликованы через kaniko (ему демон не нужен), поэтому шаг
          # best-effort: отсутствие arm64 не должно останавливать релиз.
          if ! bash scripts/offline-images.sh \
            --version "${{ steps.docker_tags.outputs.version }}" \
            --platforms arm64 \
            --push \
            --registry-prefix gitverse.ru/itphx,ghcr.io/itphx; then
            echo "ПРЕДУПРЕЖДЕНИЕ: multi-arch (arm64) не собран — на раннере нет Docker-демона; релиз продолжается с amd64-образами."
          fi

      # Manifest list best-effort: amd64-алиас создаётся с уже опубликованного
      # kaniko :<version>, затем :<version> перезаписывается index'ом amd64+arm64.
      # Отказ реестра (нет поддержки index) не валит джобу — per-arch теги остаются.
      - name: Manifest list amd64+arm64 (best-effort)
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        run: |
          bash scripts/offline-images.sh \
            --version "${{ steps.docker_tags.outputs.version }}" \
            --platforms amd64,arm64 \
            --manifests \
            --registry-prefix gitverse.ru/itphx,ghcr.io/itphx || true

  # --- Offline-образы для закрытого контура ---
  #
  # Собирает те же три образа под amd64+arm64 локально (без пушей) и складывает
  # `docker save`-архивы (.tar.gz по умолчанию — совместимо с Docker 20.10),
  # SHA256SUMS и manifest.json. Теги образов — gitverse.ru/itphx/<image>:<ver>-<arch>
  # (те же, что публикует build-docker), чтобы инструкции из документации
  # (`docker load` + `docker run gitverse.ru/itphx/...`) работали без перетегирования.
  # Проверяет запуск контейнеров и health-эндпоинты (arm64 — если есть binfmt).
  # Джоба идёт после build-docker: к этому моменту npm-пакет опубликован
  # (образ synth ставит @itphx/synth из npmjs).
  offline-images:
    name: Offline-образы (amd64+arm64)
    needs: [build-docker]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: offline_version
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.version-bump.outputs.version }}"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
          fi
          echo "version=$VERSION" >> "$GITVERSE_OUTPUT"

      - name: Установка buildx
        run: bash scripts/offline-images.sh --ensure-buildx

      - name: Сборка и архивы (amd64+arm64)
        run: |
          # Offline-архивы образов собираются docker-сборкой (buildx + проверка
          # запуском контейнера) — это требует Docker-демона, которого на раннере
          # GitVerse нет (контейнер без /var/run/docker.sock). Шаг best-effort:
          # образы в реестрах (amd64, kaniko) уже опубликованы, а portable-бандлы
          # собраны отдельной задачей — релиз не должен из-за offline-архивов
          # останавливаться. Факт отсутствия раскрыт в заметках релиза.
          if ! bash scripts/offline-images.sh \
            --version "${{ steps.offline_version.outputs.version }}" \
            --platforms amd64,arm64 \
            --registry-prefix gitverse.ru/itphx \
            --out dist/offline/images \
            --save; then
            echo "ПРЕДУПРЕЖДЕНИЕ: offline-архивы образов не собраны — на раннере нет Docker-демона; релиз продолжается без них."
          fi

      - name: Загрузить offline-образы как артефакт
        uses: actions/upload-artifact@v4
        with:
          # Артефакта может не быть: сборка offline-образов best-effort (нет демона).
          if-no-files-found: ignore
          name: offline-images
          path: |
            dist/offline/images/*.tar
            dist/offline/images/*.tar.gz
            dist/offline/images/*.tar.zst
            dist/offline/images/SHA256SUMS
            dist/offline/images/manifest.json
          if-no-files-found: error
          retention-days: 14

  # --- Portable-бандлы для закрытого контура ---
  #
  # scripts/offline-bundle.mjs собирает portable-архивы приложения (Node 22 +
  # ripgrep + установщики) для linux-x64/darwin-x64/darwin-arm64/win-x64.
  # Документацию в бандл НЕ вкладываем: synth-docs — отдельный Gitea-репозиторий,
  # из GitVerse CI он не клонируется; в share/docs остаётся README со ссылкой
  # на портал docs.synth.itphx.ru.
  # SOURCE_DATE_EPOCH фиксирует mtime файлов — бандлы воспроизводимы.
  offline-bundles:
    name: Portable-бандлы (linux/darwin/win)
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Установка pnpm
        run: npm install -g pnpm@12.14.0

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка пакетов
        run: pnpm build

      - name: Сборка portable-бандлов
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) node scripts/offline-bundle.mjs \
            --platform all \
            --clean \
            --out dist/offline \
            --skip-build

      - name: Загрузить бандлы как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundles
          path: |
            dist/offline/*.tar.gz
            dist/offline/*.zip
            dist/offline/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # --- GitVerse Release ---
  #
  # Почему не actions/create-release@v1: GitVerse САМ создаёт релиз для тега в
  # момент его push (с пустым/чужим телом), а POST /releases для уже
  # существующего git-тега отвечает 409 TAG_EXISTS — из-за чего action падает
  # («Release with tag '...' not found. Creating a new one…» → 404, затем
  # «context canceled ... failed to get release ... 404»). Поэтому тело релиза
  # проставляет собственный scripts/publish-release.mjs: находит релиз по
  # tag_name (с пагинацией) и делает идемпотентный PATCH; при отсутствии —
  # POST /releases, а при 409 повторяет поиск и PATCH. Загрузка ассетов в
  # GitVerse сейчас отдаёт 500 INTERNAL_ERROR — скрипт грузит cli.js best-effort
  # и при неудаче лишь предупреждает, не роняя джобу.
  create-release:
    name: GitVerse Release
    needs: [build, changelog, publish-npmjs, offline-images, offline-bundles]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ needs.version-bump.outputs.version }}" >> "$GITVERSE_OUTPUT"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
            echo "version=$VERSION" >> "$GITVERSE_OUTPUT"
          fi

      - name: Скачать CHANGELOG
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Скачать CLI-бандл
        uses: actions/download-artifact@v4
        with:
          name: synth-bundle
          path: packages/synth/dist

      # Offline-артефакты — ассеты релиза: архивы образов (amd64/arm64, docker save)
      # и portable-бандлы (linux/darwin/win). Загрузка в GitVerse сейчас может
      # отвечать 500: publish-release.mjs обрабатывает ассеты best-effort и не
      # роняет джобу.
      - name: Скачать offline-образы
        uses: actions/download-artifact@v4
        # Артефакта может не быть (offline-сборка best-effort) — релизу не нужны
        # образы в ассетах, чтобы создать страницу релиза и зеркало.
        continue-on-error: true
        with:
          name: offline-images
          path: tmp/offline-images

      - name: Скачать portable-бандлы
        uses: actions/download-artifact@v4
        with:
          name: offline-bundles
          path: tmp/offline-bundles

      - name: Собрать тело релиза
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p tmp
          cp changelog-partial.md tmp/release-body.md
          printf '\n## Установка\n\n' >> tmp/release-body.md
          printf '\`\`\`bash\n' >> tmp/release-body.md
          printf 'npm install -g @itphx/synth@%s\n' "$VERSION" >> tmp/release-body.md
          printf 'docker run -p 4300:4300 gitverse.ru/itphx/synth:%s\n' "$VERSION" >> tmp/release-body.md
          printf '\`\`\`\n' >> tmp/release-body.md
          printf '\n## Offline / закрытый контур\n\n' >> tmp/release-body.md
          printf 'Portable: `synth-%s-linux-x64.tar.gz`, `synth-%s-darwin-x64.tar.gz`, `synth-%s-darwin-arm64.tar.gz`, `synth-%s-win-x64.zip`.\n\n' "$VERSION" "$VERSION" "$VERSION" "$VERSION" >> tmp/release-body.md
          printf 'Образы: `synth`, `synth-backend`, `synth-ui` (amd64/arm64, `docker save`, `.tar.gz`).\n\n' >> tmp/release-body.md
          printf 'Контрольные суммы — `SHA256SUMS` в ассетах релиза; документация — https://docs.synth.itphx.ru/deploy/offline/\n' >> tmp/release-body.md

      - name: Опубликовать релиз (тело + ассет)
        env:
          GV_TOKEN: ${{ secrets.GV_TOKEN }}
          GV_REPO: itphx/synth
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          RELEASE_BODY_FILE: tmp/release-body.md
          RELEASE_ASSET: packages/synth/dist/cli.js
          RELEASE_PRERELEASE: ${{ inputs.pre_release || false }}
        run: |
          set -euo pipefail
          ASSETS="$(ls tmp/offline-images/*.tar* tmp/offline-bundles/*.tar.gz tmp/offline-bundles/*.zip 2>/dev/null | tr '\n' ' ' || true)"
          echo "Offline-ассеты: $ASSETS"
          RELEASE_ASSETS="$ASSETS" node scripts/publish-release.mjs

  # --- Публикация Helm-чарта ---
  # Чарт лежит в charts/synth, версия чарта = версии релиза.
  # Публикуется в нативный Helm-реестр GitVerse (не OCI).
  #
  # Джоба намеренно идёт ПОСЛЕ create-release и с CI_HELM_SOFT=1: публикация
  # чарта — не блокер релиза. GitVerse при падении джобы пропускает следующие
  # (на v0.8.8 падение helm ⇒ skipped у GitVerse Release), поэтому все шаги
  # идут через scripts/ci-helm.sh: если helm недоступен (get.helm.sh с раннера
  # не открывается) или публикация не удалась, печатается предупреждение,
  # джоба завершается успешно и релиз не страдает.
  publish-helm:
    name: Helm-чарт (публикация)
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: helm_version
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.version-bump.outputs.version }}"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
          fi
          echo "version=$VERSION" >> "$GITVERSE_OUTPUT"

      - name: Диагностика источников Helm
        run: bash scripts/ci-helm.sh sources

      - name: Установка Helm
        env:
          CI_HELM_SOFT: '1'
        run: bash scripts/ci-helm.sh install

      - name: Публикация чарта в Helm-реестр GitVerse
        env:
          CI_HELM_SOFT: '1'
          GV_TOKEN: ${{ secrets.GV_TOKEN }}
        run: bash scripts/ci-helm.sh publish charts/synth "${{ steps.helm_version.outputs.version }}"

  # --- GitHub-зеркало: push refs + GitHub Release (без сборки образов) ---
  #
  # GitHub — только ЗЕРКАЛО и релизы. Контейнеры здесь НЕ собираются: единственный
  # билд-контур — этот CI (kaniko), а базовые образы (synth/synth-backend/synth-ui) уже
  # зеркалируются в GHCR шагом выше. GitHub Actions в репозитории не используются вовсе.
  #
  # Джоба идёт ПОСЛЕ build-docker (образы в GHCR) и changelog (GitVerse-релиз), без
  # continue-on-error: npm и Docker к этому моменту уже опубликованы, поэтому
  # падение здесь — сигнал чинить, а не глушить. Она делает три вещи:
  #   1. push зеркала: master→main и все теги (никаких других ветвей);
  #   2. GitHub Release с АНГЛИЙСКИМ телом — scripts/changelog.sh --lang en берёт
  #      docs/releases/<version>.en.md (фоллбек — русское описание, затем
  #      авто-генерация из коммитов); создание идемпотентно (есть релиз по тегу —
  #      обновляем тело);
  #   3. ассеты best-effort (cli.js, Helm-чарт, offline-образы amd64/arm64,
  #      portable-бандлы, SHA256SUMS): отсутствующий файл — предупреждение,
  #      ошибка загрузки не валит джобу (видно в логе). Offline-архивы приходят
  #      из джоб offline-images/offline-bundles (needs), поэтому релиз ждёт их.
  #
  # Почему if без always(): у GitVerse выражения GitHub-совместимы, но always()
  # в этом пайплайне не используется нигде — берём проверенный паттерн `!inputs.dry_run`,
  # чтобы не сломать рабочий релизный CI. Порядок гарантирован через needs.
  publish-github:
    name: GitHub-зеркало (refs + Release)
    needs: [build, changelog, build-docker, offline-images, offline-bundles]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужны все теги/история — для push зеркала и работы с тегом релиза.
          fetch-depth: 0

      - name: Определить версию
        id: gh_version
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.version-bump.outputs.version }}"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
          fi
          echo "version=$VERSION" >> "$GITVERSE_OUTPUT"

      - name: Push зеркала (master→main + теги) в GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "ОШИБКА: секрет GH_TOKEN не задан — push зеркала невозможен" >&2
            exit 1
          fi
          # Токен передаём заголовком (а не в URL), чтобы он не попал в вывод git.
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add github https://github.com/itphx/synth.git 2>/dev/null || true
          git push github HEAD:refs/heads/main
          git push github --tags

      - name: Скачать CLI-бандл
        uses: actions/download-artifact@v4
        with:
          name: synth-bundle
          path: packages/synth/dist

      # Offline-артефакты скачиваем в отдельные каталоги (у образов и бандлов
      # свои SHA256SUMS — их нельзя смешивать). В tmp/assets копируются только
      # сами архивы, SHA256SUMS ниже пересчитывается по всему каталогу.
      - name: Скачать offline-образы
        uses: actions/download-artifact@v4
        # Артефакта может не быть (offline-сборка best-effort) — релизу не нужны
        # образы в ассетах, чтобы создать страницу релиза и зеркало.
        continue-on-error: true
        with:
          name: offline-images
          path: tmp/offline-images

      - name: Скачать portable-бандлы
        uses: actions/download-artifact@v4
        with:
          name: offline-bundles
          path: tmp/offline-bundles

      - name: Собрать тело релиза и базовые ассеты
        run: |
          set -euo pipefail
          mkdir -p tmp/assets

          # Offline-архивы: образы (amd64/arm64) и portable-бандлы — плоским
          # списком в tmp/assets; отсутствие каталога/файлов не блокирует релиз.
          for f in tmp/offline-images/*.tar* tmp/offline-bundles/*.tar.gz tmp/offline-bundles/*.zip; do
            if [ -f "$f" ]; then cp "$f" tmp/assets/; fi
          done

          # Тело релиза — английское описание docs/releases/<version>.en.md
          # (фоллбек на русское описание, затем авто-генерация из коммитов).
          bash scripts/changelog.sh --lang en --out tmp/changelog-en.md
          cp tmp/changelog-en.md tmp/release-body.md
          VERSION="${{ steps.gh_version.outputs.version }}"
          {
            printf '\n## Installation\n\n'
            printf 'CLI (npm — from npmjs.org or the GitVerse Package Registry):\n\n'
            printf '```bash\n'
            printf 'npm install -g @itphx/synth@%s\n' "$VERSION"
            printf '```\n\n'
            printf 'Base Docker image from the GitHub Container Registry:\n\n'
            printf '```bash\n'
            printf 'docker pull ghcr.io/itphx/synth:%s\n' "$VERSION"
            printf 'docker run -p 4300:4300 ghcr.io/itphx/synth:%s\n' "$VERSION"
            printf '```\n\n'
            printf 'The primary image registry is `gitverse.ru/itphx/synth:%s`;\n' "$VERSION"
            printf 'all three base images (`synth`, `synth-backend`, `synth-ui`) are published to\n'
            printf 'both gitverse.ru and ghcr.io (version tag only).\n'
            printf '\n## Offline / air-gapped\n\n'
            printf 'Portable: `synth-%s-linux-x64.tar.gz`, `synth-%s-darwin-x64.tar.gz`, `synth-%s-darwin-arm64.tar.gz`, `synth-%s-win-x64.zip`.\n\n' "$VERSION" "$VERSION" "$VERSION" "$VERSION"
            printf 'Images: `synth`, `synth-backend`, `synth-ui` (amd64/arm64, `docker save`, `.tar.gz`).\n\n'
            printf 'Checksums: `SHA256SUMS` in the release assets. Documentation: https://docs.synth.itphx.ru/deploy/offline/\n'
          } >> tmp/release-body.md

          if [ -f packages/synth/dist/cli.js ]; then
            cp packages/synth/dist/cli.js tmp/assets/cli.js
          else
            echo "ПРЕДУПРЕЖДЕНИЕ: packages/synth/dist/cli.js не найден — ассет cli.js пропущен"
          fi

      - name: Упаковать Helm-чарт (версия из Chart.yaml, best-effort)
        env:
          CI_HELM_SOFT: '1'
        run: |
          set -euo pipefail
          bash scripts/ci-helm.sh install
          bash scripts/ci-helm.sh package charts/synth "${{ steps.gh_version.outputs.version }}" || true
          CHART_TGZ="dist/helm/synth-${{ steps.gh_version.outputs.version }}.tgz"
          if [ -f "$CHART_TGZ" ]; then
            mkdir -p tmp/assets
            cp "$CHART_TGZ" tmp/assets/
          else
            echo "ПРЕДУПРЕЖДЕНИЕ: Helm-чарт не упакован — ассет пропущен"
          fi

      - name: Контрольные суммы (SHA256SUMS, best-effort)
        run: |
          set -euo pipefail
          mkdir -p tmp/assets
          if [ -n "$(ls -A tmp/assets 2>/dev/null)" ]; then
            ( cd tmp/assets && sha256sum ./* > SHA256SUMS )
            cat tmp/assets/SHA256SUMS
          else
            echo "ПРЕДУПРЕЖДЕНИЕ: ассетов нет — SHA256SUMS не создаётся"
          fi

      - name: Опубликовать GitHub Release (тело + ассеты, ассеты best-effort)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: itphx/synth
          RELEASE_TAG: v${{ steps.gh_version.outputs.version }}
          RELEASE_BODY_FILE: tmp/release-body.md
          RELEASE_PRERELEASE: ${{ inputs.pre_release || false }}
        run: |
          set -euo pipefail
          ASSETS="$(ls tmp/assets 2>/dev/null | sed 's|^|tmp/assets/|' | tr '\n' ' ')"
          RELEASE_ASSETS="$ASSETS" node scripts/publish-release.mjs --platform github
