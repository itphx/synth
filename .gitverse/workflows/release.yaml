name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        description: 'Тип версии (по SemVer)'
      pre_release:
        type: boolean
        default: false
        description: 'Предварительный релиз (pre-release)'
      dry_run:
        type: boolean
        default: false
        description: 'Проверка без публикации (dry-run)'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # --- Ручной bump версии (только для workflow_dispatch) ---
  version-bump:
    name: Bump версии
    if: ${{ gitverse.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      prev_version: ${{ steps.bump.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GV_TOKEN }}

      - name: Установка pnpm
        run: npm install -g pnpm@latest

      - name: Вычислить новую версию
        id: bump
        run: |
          CURRENT=$(node -e "console.log(require('./packages/synth/package.json').version)")
          BUMP="${{ inputs.bump || 'patch' }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            *)     NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "Текущая: $CURRENT → Новая: $NEW"
          echo "current_version=$CURRENT" >> "$GITVERSE_OUTPUT"
          echo "new_version=$NEW" >> "$GITVERSE_OUTPUT"

      - name: Обновить version.ts
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          sed -i "s/export const SYNTH_VERSION = '[^']*';/export const SYNTH_VERSION = '$NEW';/" packages/shared/src/version.ts

      - name: Обновить package.json
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          for pkg_dir in packages/shared packages/core packages/backend packages/ui packages/runner packages/sdk packages/synth; do
            node -e "
              const fs = require('fs');
              const p = require('./$pkg_dir/package.json');
              p.version = '$NEW';
              fs.writeFileSync('./$pkg_dir/package.json', JSON.stringify(p, null, 2) + '\n');
            "
          done
          echo "Все package.json обновлены до $NEW"

      - name: Обновить Chart.yaml
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          node -e "
            const fs = require('fs');
            const path = './charts/synth/Chart.yaml';
            let y = fs.readFileSync(path, 'utf8');
            y = y.replace(/^version:.*$/m, 'version: ' + '$NEW');
            y = y.replace(/^appVersion:.*$/m, 'appVersion: \"' + '$NEW' + '\"');
            fs.writeFileSync(path, y);
          "
          echo "charts/synth/Chart.yaml обновлён до $NEW"

      - name: Коммит + тег
        if: ${{ !inputs.dry_run }}
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          git config user.name "synth-bot"
          git config user.email "bot@synth.dev"
          git add packages/shared/src/version.ts packages/*/package.json charts/synth/Chart.yaml
          git commit -m "chore: bump version to v$NEW"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push --follow-tags

  # --- CI проверки ---
  lint-and-test:
    name: CI проверки
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Установка pnpm
        run: npm install -g pnpm@latest

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка @itphx/synth-shared и @itphx/synth-core
        run: |
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build

      - name: TypeScript (typecheck)
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Тесты
        run: pnpm test

  # --- Сборка ---
  build:
    name: Сборка релизных артефактов
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Установка pnpm
        run: npm install -g pnpm@latest

      - name: Сборка всех пакетов
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-ui build
          pnpm --filter @itphx/synth-backend build
          pnpm --filter @itphx/synth-runner build
          pnpm --filter @itphx/synth-sdk build
          pnpm --filter @itphx/synth build

      - name: Загрузить бандл как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: synth-bundle
          path: packages/synth/dist/cli.js

  # --- Генерация CHANGELOG ---
  changelog:
    name: Генерация CHANGELOG
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Сгенерировать CHANGELOG
        id: changelog
        run: bash scripts/changelog.sh

      - name: Загрузить CHANGELOG как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog-partial.md

  # --- Публикация npm ---
  publish-npmjs:
    name: npmjs.org
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установка + сборка
        run: |
          npm install -g pnpm@latest
          pnpm install --frozen-lockfile
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-ui build
          pnpm --filter @itphx/synth-backend build
          pnpm --filter @itphx/synth-runner build
          pnpm --filter @itphx/synth-sdk build
          pnpm --filter @itphx/synth build

      - name: Публикация в npmjs.org
        run: |
          npm config set "//registry.npmjs.org/:_authToken" "${{ secrets.NPM_TOKEN }}"
          bash scripts/publish-packages.sh https://registry.npmjs.org

  publish-gitverse-npm:
    name: GitVerse Package Registry
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установка + сборка
        run: |
          npm install -g pnpm@latest
          pnpm install --frozen-lockfile
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-ui build
          pnpm --filter @itphx/synth-backend build
          pnpm --filter @itphx/synth-runner build
          pnpm --filter @itphx/synth-sdk build
          pnpm --filter @itphx/synth build

      - name: Публикация в GitVerse Package Registry
        run: |
          npm config set "//gitverse.ru/api/packages/itphx/npm/:_authToken" "${{ secrets.GV_TOKEN }}"
          bash scripts/publish-packages.sh https://gitverse.ru/api/packages/itphx/npm/

  # --- Публикация Docker ---
  # Тег latest намеренно НЕ публикуется: квота «Пакеты» в GitVerse считает размер
  # каждой версии без дедупликации, а latest и версия указывают на один digest —
  # публикуются только версионные теги (иначе перелимит 500 МБ на репозиторий;
  # на 0.9.0 вышло 607,4 МБ из 500). Старые теги удаляет шаг «Очистка…».
  # Docker-образ ставит @itphx/synth@<version> из npmjs (npm install -g),
  # поэтому ждём публикации npmjs — иначе гонка: kaniko не находит пакет (ETARGET)
  build-docker:
    name: Docker образ
    needs: [build, publish-npmjs]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Определить теги
        id: docker_tags
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.version-bump.outputs.version }}"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
          fi
          echo "version=$VERSION" >> "$GITVERSE_OUTPUT"

      - name: Ожидание доступности версии в npmjs
        run: bash scripts/wait-npm-version.sh "${{ steps.docker_tags.outputs.version }}"

      - name: Авторизация для Docker Registry
        run: |
          mkdir -p "${{ gitverse.workspace }}/.docker"
          node -e "
            const fs = require('fs');
            const cred = 'itphx:' + '${{ secrets.GV_TOKEN }}';
            const auth = Buffer.from(cred).toString('base64');
            const config = { auths: { 'gitverse.ru': { auth } } };
            fs.writeFileSync('${{ gitverse.workspace }}/.docker/config.json', JSON.stringify(config));
          "
          chmod 600 "${{ gitverse.workspace }}/.docker/config.json"

      - name: Очистка старых Docker-образов (gitverse)
        env:
          GV_TOKEN: ${{ secrets.GV_TOKEN }}
        run: node scripts/docker-cleanup.mjs synth synth-backend synth-ui

      - name: Сборка и публикация Docker образа synth (kaniko)
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ gitverse.workspace }}
            --dockerfile=docker/Dockerfile
            --build-arg=SYNTH_VERSION=${{ steps.docker_tags.outputs.version }}
            --destination=gitverse.ru/itphx/synth:${{ steps.docker_tags.outputs.version }}
            --snapshot-mode=redo
            --push-retry=3
            --verbosity=info

      - name: Сборка и публикация Docker образа synth-backend (kaniko)
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ gitverse.workspace }}
            --dockerfile=docker/Dockerfile.backend
            --build-arg=SYNTH_BACKEND_VERSION=${{ steps.docker_tags.outputs.version }}
            --destination=gitverse.ru/itphx/synth-backend:${{ steps.docker_tags.outputs.version }}
            --snapshot-mode=redo
            --push-retry=3
            --verbosity=info

      - name: Сборка и публикация Docker образа synth-ui (kaniko)
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ gitverse.workspace }}
            --dockerfile=docker/Dockerfile.ui
            --build-arg=SYNTH_UI_VERSION=${{ steps.docker_tags.outputs.version }}
            --destination=gitverse.ru/itphx/synth-ui:${{ steps.docker_tags.outputs.version }}
            --snapshot-mode=redo
            --push-retry=3
            --verbosity=info

  # --- GitVerse Release ---
  #
  # Почему не actions/create-release@v1: GitVerse САМ создаёт релиз для тега в
  # момент его push (с пустым/чужим телом), а POST /releases для уже
  # существующего git-тега отвечает 409 TAG_EXISTS — из-за чего action падает
  # («Release with tag '...' not found. Creating a new one…» → 404, затем
  # «context canceled ... failed to get release ... 404»). Поэтому тело релиза
  # проставляет собственный scripts/publish-release.mjs: находит релиз по
  # tag_name (с пагинацией) и делает идемпотентный PATCH; при отсутствии —
  # POST /releases, а при 409 повторяет поиск и PATCH. Загрузка ассетов в
  # GitVerse сейчас отдаёт 500 INTERNAL_ERROR — скрипт грузит cli.js best-effort
  # и при неудаче лишь предупреждает, не роняя джобу.
  create-release:
    name: GitVerse Release
    needs: [build, changelog, publish-npmjs]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ needs.version-bump.outputs.version }}" >> "$GITVERSE_OUTPUT"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
            echo "version=$VERSION" >> "$GITVERSE_OUTPUT"
          fi

      - name: Скачать CHANGELOG
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Скачать CLI-бандл
        uses: actions/download-artifact@v4
        with:
          name: synth-bundle
          path: packages/synth/dist

      - name: Собрать тело релиза
        run: |
          mkdir -p tmp
          cp changelog-partial.md tmp/release-body.md
          printf '\n## Установка\n\n' >> tmp/release-body.md
          printf '\`\`\`bash\n' >> tmp/release-body.md
          printf 'npm install -g @itphx/synth@%s\n' "${{ steps.version.outputs.version }}" >> tmp/release-body.md
          printf 'docker run -p 4300:4300 gitverse.ru/itphx/synth:%s\n' "${{ steps.version.outputs.version }}" >> tmp/release-body.md
          printf '\`\`\`\n' >> tmp/release-body.md

      - name: Опубликовать релиз (тело + ассет)
        env:
          GV_TOKEN: ${{ secrets.GV_TOKEN }}
          GV_REPO: itphx/synth
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          RELEASE_BODY_FILE: tmp/release-body.md
          RELEASE_ASSET: packages/synth/dist/cli.js
          RELEASE_PRERELEASE: ${{ inputs.pre_release || false }}
        run: node scripts/publish-release.mjs

  # --- Публикация Helm-чарта ---
  # Чарт лежит в charts/synth, версия чарта = версии релиза.
  # Публикуется в нативный Helm-реестр GitVerse (не OCI).
  #
  # Джоба намеренно идёт ПОСЛЕ create-release и с CI_HELM_SOFT=1: публикация
  # чарта — не блокер релиза. GitVerse при падении джобы пропускает следующие
  # (на v0.8.8 падение helm ⇒ skipped у GitVerse Release), поэтому все шаги
  # идут через scripts/ci-helm.sh: если helm недоступен (get.helm.sh с раннера
  # не открывается) или публикация не удалась, печатается предупреждение,
  # джоба завершается успешно и релиз не страдает.
  publish-helm:
    name: Helm-чарт (публикация)
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: helm_version
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.version-bump.outputs.version }}"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
          fi
          echo "version=$VERSION" >> "$GITVERSE_OUTPUT"

      - name: Диагностика источников Helm
        run: bash scripts/ci-helm.sh sources

      - name: Установка Helm
        env:
          CI_HELM_SOFT: '1'
        run: bash scripts/ci-helm.sh install

      - name: Публикация чарта в Helm-реестр GitVerse
        env:
          CI_HELM_SOFT: '1'
          GV_TOKEN: ${{ secrets.GV_TOKEN }}
        run: bash scripts/ci-helm.sh publish charts/synth "${{ steps.helm_version.outputs.version }}"
