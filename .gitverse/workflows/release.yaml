name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        description: 'Тип версии (по SemVer)'
      pre_release:
        type: boolean
        default: false
        description: 'Предварительный релиз (pre-release)'
      dry_run:
        type: boolean
        default: false
        description: 'Проверка без публикации (dry-run)'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # --- Ручной bump версии (только для workflow_dispatch) ---
  version-bump:
    name: Bump версии
    if: ${{ gitverse.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      prev_version: ${{ steps.bump.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GV_TOKEN }}

      - name: Установка pnpm
        run: npm install -g pnpm@latest

      - name: Вычислить новую версию
        id: bump
        run: |
          CURRENT=$(node -e "console.log(require('./packages/synth/package.json').version)")
          BUMP="${{ inputs.bump || 'patch' }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            *)     NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "Текущая: $CURRENT → Новая: $NEW"
          echo "current_version=$CURRENT" >> "$GITVERSE_OUTPUT"
          echo "new_version=$NEW" >> "$GITVERSE_OUTPUT"

      - name: Обновить version.ts
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          sed -i "s/export const SYNTH_VERSION = '[^']*';/export const SYNTH_VERSION = '$NEW';/" packages/shared/src/version.ts

      - name: Обновить package.json
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          for pkg_dir in packages/shared packages/core packages/backend packages/ui packages/runner packages/synth; do
            node -e "
              const fs = require('fs');
              const p = require('./$pkg_dir/package.json');
              p.version = '$NEW';
              fs.writeFileSync('./$pkg_dir/package.json', JSON.stringify(p, null, 2) + '\n');
            "
          done
          echo "Все package.json обновлены до $NEW"

      - name: Коммит + тег
        if: ${{ !inputs.dry_run }}
        run: |
          NEW="${{ steps.bump.outputs.new_version }}"
          git config user.name "synth-bot"
          git config user.email "bot@synth.dev"
          git add packages/shared/src/version.ts packages/*/package.json
          git commit -m "chore: bump version to v$NEW"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push --follow-tags

  # --- CI проверки ---
  lint-and-test:
    name: CI проверки
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Установка pnpm
        run: npm install -g pnpm@latest

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка @itphx/synth-shared и @itphx/synth-core
        run: |
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build

      - name: TypeScript (typecheck)
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Тесты
        run: pnpm test

  # --- Сборка ---
  build:
    name: Сборка релизных артефактов
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Установка pnpm
        run: npm install -g pnpm@latest

      - name: Сборка всех пакетов
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-ui build
          pnpm --filter @itphx/synth-backend build
          pnpm --filter @itphx/synth-runner build
          pnpm --filter @itphx/synth build

      - name: Загрузить бандл как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: synth-bundle
          path: packages/synth/dist/cli.js

  # --- Генерация CHANGELOG ---
  changelog:
    name: Генерация CHANGELOG
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Сгенерировать CHANGELOG
        id: changelog
        run: bash scripts/changelog.sh

      - name: Загрузить CHANGELOG как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog-partial.md

  # --- Публикация npm ---
  publish-npmjs:
    name: npmjs.org
    needs: [build, changelog]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установка + сборка
        run: |
          npm install -g pnpm@latest
          pnpm install --frozen-lockfile
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-ui build
          pnpm --filter @itphx/synth-backend build
          pnpm --filter @itphx/synth-runner build
          pnpm --filter @itphx/synth build

      - name: Публикация в npmjs.org
        run: |
          npm config set "//registry.npmjs.org/:_authToken" "${{ secrets.NPM_TOKEN }}"
          for pkg in shared core ui backend runner synth; do
            (cd "packages/$pkg" && pnpm publish --access public --registry https://registry.npmjs.org --no-git-checks)
          done

  publish-gitverse-npm:
    name: GitVerse Package Registry
    needs: [build, changelog]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установка + сборка
        run: |
          npm install -g pnpm@latest
          pnpm install --frozen-lockfile
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build
          pnpm --filter @itphx/synth-ui build
          pnpm --filter @itphx/synth-backend build
          pnpm --filter @itphx/synth-runner build
          pnpm --filter @itphx/synth build

      - name: Публикация в GitVerse Package Registry
        run: |
          npm config set "//gitverse.ru/api/packages/itphx/npm/:_authToken" "${{ secrets.GV_TOKEN }}"
          for pkg in shared core ui backend runner synth; do
            (cd "packages/$pkg" && pnpm publish --access public --registry https://gitverse.ru/api/packages/itphx/npm/ --no-git-checks)
          done

  # --- Публикация Docker ---
  # Docker-образ ставит @itphx/synth@<version> из npmjs (npm install -g),
  # поэтому ждём публикации npmjs — иначе гонка: kaniko не находит пакет (ETARGET)
  build-docker:
    name: Docker образ
    needs: [build, changelog, publish-npmjs]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Определить теги
        id: docker_tags
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.version-bump.outputs.version }}"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
          fi
          echo "version=$VERSION" >> "$GITVERSE_OUTPUT"

      - name: Авторизация для Docker Registry
        run: |
          mkdir -p "${{ gitverse.workspace }}/.docker"
          node -e "
            const fs = require('fs');
            const cred = 'itphx:' + '${{ secrets.GV_TOKEN }}';
            const auth = Buffer.from(cred).toString('base64');
            const config = { auths: { 'gitverse.ru': { auth } } };
            fs.writeFileSync('${{ gitverse.workspace }}/.docker/config.json', JSON.stringify(config));
          "
          chmod 600 "${{ gitverse.workspace }}/.docker/config.json"

      - name: Сборка и публикация Docker образа (kaniko)
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ gitverse.workspace }}
            --dockerfile=docker/Dockerfile
            --build-arg=SYNTH_VERSION=${{ steps.docker_tags.outputs.version }}
            --destination=gitverse.ru/itphx/synth:${{ steps.docker_tags.outputs.version }}
            --destination=gitverse.ru/itphx/synth:latest
            --snapshot-mode=redo
            --push-retry=3
            --verbosity=info

  # --- GitVerse Release ---
  create-release:
    name: GitVerse Release
    needs: [build, changelog, publish-npmjs]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: |
          if [ "${{ gitverse.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ needs.version-bump.outputs.version }}" >> "$GITVERSE_OUTPUT"
          else
            VERSION=$(echo "${{ gitverse.ref }}" | sed 's|refs/tags/v||')
            echo "version=$VERSION" >> "$GITVERSE_OUTPUT"
          fi

      - name: Скачать CHANGELOG
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Собрать тело релиза
        id: release_body
        run: |
          printf 'body<<GVEOF\n' >> "$GITVERSE_OUTPUT"
          cat changelog-partial.md >> "$GITVERSE_OUTPUT"
          printf '\n## Установка\n\n' >> "$GITVERSE_OUTPUT"
          printf '\`\`\`bash\n' >> "$GITVERSE_OUTPUT"
          printf 'npm install -g @itphx/synth@%s\n' "${{ steps.version.outputs.version }}" >> "$GITVERSE_OUTPUT"
          printf 'docker run -p 4300:4300 gitverse.ru/itphx/synth:%s\n' "${{ steps.version.outputs.version }}" >> "$GITVERSE_OUTPUT"
          printf '\`\`\`\n' >> "$GITVERSE_OUTPUT"
          printf 'GVEOF\n' >> "$GITVERSE_OUTPUT"

      - name: Создать релиз
        uses: actions/create-release@v1
        with:
          api_key: ${{ secrets.GV_TOKEN }}
          title: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.release_body.outputs.body }}
          files: |
            packages/synth/dist/cli.js
          pre_release: ${{ inputs.pre_release || false }}
