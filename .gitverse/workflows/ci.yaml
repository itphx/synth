name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitverse/**'
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - master

jobs:
  lint-and-typecheck:
    name: Линтинг + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установка pnpm
        run: npm install -g pnpm@latest

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка @itphx/synth-shared и @itphx/synth-core
        run: |
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build

      - name: TypeScript (typecheck)
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

  test-shared:
    name: Тесты @itphx/synth-shared
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Тесты
        run: pnpm --filter @itphx/synth-shared test

  test-core:
    name: Тесты @itphx/synth-core
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Сборка @itphx/synth-core
        run: pnpm --filter @itphx/synth-core build
      - name: Тесты
        run: pnpm --filter @itphx/synth-core test

  test-backend:
    name: Тесты @itphx/synth-backend
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Сборка @itphx/synth-core
        run: pnpm --filter @itphx/synth-core build
      - name: Тесты
        run: pnpm --filter @itphx/synth-backend test

  test-runner:
    name: Тесты @itphx/synth-runner
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Тесты
        run: pnpm --filter @itphx/synth-runner test

  test-sdk:
    name: Тесты @itphx/synth-sdk
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Тесты
        run: pnpm --filter @itphx/synth-sdk test

  # Helm-чарт не зависит от сборки npm-пакетов: только lint и рендер шаблонов.
  helm-lint:
    name: Helm-чарт (lint + template)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Установка Helm
        run: |
          curl -fsSL -o helm.tgz https://get.helm.sh/helm-v3.20.1-linux-amd64.tar.gz
          tar -xzf helm.tgz

      - name: Lint чарта
        run: ./linux-amd64/helm lint charts/synth

      - name: Рендер шаблонов
        run: ./linux-amd64/helm template synth charts/synth
