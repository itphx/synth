name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitverse/**'
      - '.github/**'
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - master

# Триггеры: обычный push в master/feature-ветки и PR — код.
# Доковые изменения (docs/**, *.md) исключены через paths-ignore — их проверяет
# лёгкий workflow `ci-docs.yaml`; релизы (сборка и публикация) — `release.yaml` по тегам.
# Поэтому тяжёлые джобы здесь не дублируют проверку доков.

jobs:
  lint-and-typecheck:
    name: Линтинг + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установка pnpm
        run: npm install -g pnpm@latest

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка @itphx/synth-shared и @itphx/synth-core
        run: |
          pnpm --filter @itphx/synth-shared build
          pnpm --filter @itphx/synth-core build

      - name: TypeScript (typecheck)
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

  test-shared:
    name: Тесты @itphx/synth-shared
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Тесты
        run: pnpm --filter @itphx/synth-shared test

  test-core:
    name: Тесты @itphx/synth-core
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Сборка @itphx/synth-core
        run: pnpm --filter @itphx/synth-core build
      - name: Тесты
        run: pnpm --filter @itphx/synth-core test

  test-storage-postgres:
    name: Тесты @itphx/synth-storage-postgres
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Сборка @itphx/synth-core
        run: pnpm --filter @itphx/synth-core build
      - name: Тесты
        run: pnpm --filter @itphx/synth-storage-postgres test

  # Гейт «контрактный suite на живой PostgreSQL» (PROP-032, волна 4).
  # Контрактный suite портов (packages/core/src/storage/contract/postgres.test.ts) и
  # smoke-тест драйвера включаются только при SYNTH_TEST_POSTGRES_DSN — здесь его
  # резолвит scripts/ci-postgres.sh по цепочке: секрет GV_TEST_POSTGRES_DSN →
  # локальный initdb → apt/apk → docker-образ postgres:17-alpine. Логика подъёма БД
  # живёт в скрипте, а не в inline bash: `${...}` в inline-скрипте GitVerse парсит как
  # Go-шаблон и роняет шаг (см. §«GitVerse CI — особенности» в AGENTS.md).
  # Поведение без БД: если внешний DSN задан — тесты просто падают (молчаливого
  # «зелёного» прохода нет); если внешнего DSN нет и поднять БД не удалось — шаг
  # печатает крупный ПРОПУСК-предупреждение и не валит джобу. Жёсткий режим —
  # SYNTH_PG_REQUIRE: '1' (после подтверждения, что БД поднимается на раннере).
  test-postgres:
    name: Контрактный suite на живой PostgreSQL (PROP-032)
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Сборка @itphx/synth-core
        run: pnpm --filter @itphx/synth-core build
      - name: Сборка @itphx/synth-storage-postgres
        run: pnpm --filter @itphx/synth-storage-postgres build
      - name: Диагностика источников PostgreSQL
        env:
          GV_TEST_POSTGRES_DSN: ${{ secrets.GV_TEST_POSTGRES_DSN }}
        run: bash scripts/ci-postgres.sh diagnose
      - name: Поднять PostgreSQL и прогнать контрактный suite
        env:
          # Необязательный секрет: пусто → поднимается локальная БД (см. scripts/ci-postgres.sh).
          GV_TEST_POSTGRES_DSN: ${{ secrets.GV_TEST_POSTGRES_DSN }}
          # '1' — недоступная БД валит джобу (жёсткий гейт). Пока подъём БД на раннере
          # не подтверждён эмпирически — мягкий пропуск с предупреждением.
          SYNTH_PG_REQUIRE: '0'
        run: bash scripts/ci-postgres.sh run

  test-backend:
    name: Тесты @itphx/synth-backend
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Сборка @itphx/synth-core
        run: pnpm --filter @itphx/synth-core build
      - name: Тесты
        run: pnpm --filter @itphx/synth-backend test

  test-sdk:
    name: Тесты @itphx/synth-sdk
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Тесты
        run: pnpm --filter @itphx/synth-sdk test

  test-ui:
    name: Тесты @itphx/synth-ui
    runs-on: ubuntu-latest
    needs: test-shared
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: Сборка @itphx/synth-shared
        run: pnpm --filter @itphx/synth-shared build
      - name: Сборка @itphx/synth-core
        run: pnpm --filter @itphx/synth-core build
      - name: Тесты
        run: pnpm --filter @itphx/synth-ui test

  # Secret-scan — блокирующая проверка без внешних зависимостей (только node + git),
  # поэтому pnpm здесь не ставится: рабочее дерево + вся история (режимы commits/blobs).
  # Это и есть обещанный в SECURITY.md/CONTRIBUTING.md скан секретов в CI
  # (правила и allowlist — scripts/secret-scan.mjs + .gitleaks.toml).
  secret-scan:
    name: Secret-scan (дерево + история)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Вся история: проверяются и удалённые из дерева строки, и старые блобы.
          fetch-depth: 0

      - name: Secret-scan
        run: node scripts/secret-scan.mjs --mode worktree,commits,blobs

  # Аудит зависимостей — этапы ужесточения (см. docs/security/README.md):
  #   этап 0 (сейчас): отчёт без блокировки — база уязвимостей ломала бы сборку
  #     на транзитивных зависимостях; результат виден в логе;
  #   этап 1: блокирующее — только «нет уязвимостей в ПРЯМЫХ зависимостях» и ратчет
  #     (их считает релизный гейт scripts/security-gate.mjs, джоба `security-gate`);
  #   этап 2: ратчет здесь становится блокирующим (снять continue-on-error у шага);
  #   этап 3: `pnpm audit --audit-level=high` блокирующий, baseline → 0/0;
  #   этап 4: `--audit-level=moderate`.
  audit:
    name: Аудит зависимостей (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Установка
        run: npm install -g pnpm@latest && pnpm install --frozen-lockfile
      - name: pnpm audit (high+) — отчёт
        run: pnpm audit --audit-level=high

      # Ратчет против пола из docs/security/policy.json: шаг виден в логе (дельта к
      # baseline, прямые уязвимые зависимости). До этапа 2 — report-only; перевод в
      # блокирующий = убрать continue-on-error (и, при необходимости, поправить baseline).
      - name: Ратчет уязвимостей (дельта к baseline)
        continue-on-error: true
        run: node scripts/security-gate.mjs --only dependencies --skip-tests

  # Helm-чарт не зависит от сборки npm-пакетов: только lint и рендер шаблонов.
  # Helm ставит scripts/ci-helm.sh: на раннерах GitVerse get.helm.sh недоступен
  # (curl (28) connect timeout), поэтому используется цепочка источников
  # (get.helm.sh → зеркала → docker-образ) с проверкой sha256; в лог всегда
  # пишется, какой источник сработал, а при полном отказе печатается диагностика.
  helm-lint:
    name: Helm-чарт (lint + template)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Диагностика источников Helm
        run: bash scripts/ci-helm.sh sources

      - name: Установка Helm
        run: bash scripts/ci-helm.sh install

      - name: Lint чарта
        run: bash scripts/ci-helm.sh lint charts/synth

      - name: Рендер шаблонов
        run: bash scripts/ci-helm.sh template synth charts/synth
