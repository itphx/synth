  - hello
  - hi
  - hey
  - good morning
  - good afternoon
  - good evening
  - greetings
  - howdy
  - sup
  - yo
  # Farewells
  - bye
  - goodbye
  - see you
  - later
  - farewell
  - cya
  # Thanks
  - thanks
  - thank you
  - thx
  - ty
  - cheers
  - much obliged

categories:
