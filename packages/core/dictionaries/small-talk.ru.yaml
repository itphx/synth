# Ключевые слова для категории small_talk (русский) — AD-035
keywords:
  # Приветствия
  - привет
  - здравствуй
  - здравствуйте
  - добрый день
  - доброе утро
  - добрый вечер
  - приветствую
  - здорово
  - салют
  - хай
  - hello
  - hi
  - hey
  # Прощания
  - пока
  - до свидания
  - прощай
  - до встречи
  - увидимся
  - bye
  - good bye
  - goodbye
  # Благодарности
  - спасибо
  - благодарю
  - спасиб
  - пасиба
  - thanks
  - thank you
  - thx
  - спс

categories:
  greeting:
    keywords:
      - привет
      - здравствуй
      - здравствуйте
      - добрый день
      - доброе утро
      - добрый вечер
      - приветствую
      - здорово
      - салют
      - хай
      - hello
      - hi
      - hey
    answers:
      - "Привет! Чем могу помочь?"
      - "Здравствуйте! Рад вас видеть. Что будем делать?"
      - "Привет! Я Synth, ваш AI-ассистент. Что нужно сделать?"
  farewell:
    keywords:
      - пока
      - до свидания
      - прощай
      - до встречи
      - увидимся
      - bye
      - good bye
      - goodbye
    answers:
      - "До свидания! Обращайтесь, если понадоблюсь."
      - "Пока! Хорошего дня!"
  thanks:
    keywords:
      - спасибо
      - благодарю
      - спасиб
      - пасиба
      - thanks
      - thank you
      - thx
      - спс
    answers:
      - "Пожалуйста! Рад помочь."
      - "Всегда пожалуйста! Что-то ещё?"
