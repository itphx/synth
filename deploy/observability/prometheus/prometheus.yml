# Шаблон конфигурации Prometheus для dev-стенда наблюдаемости (ADR-094).
#
# Prometheus НЕ подставляет env-переменные в конфиг, поэтому файл монтируется в
# контейнер как `prometheus.yml.tmpl`, а entrypoint в docker-compose.observability.yml
# заменяет плейсхолдеры:
#   __SYNTH_CORE_TARGET__     → SYNTH_METRICS_CORE_TARGET     (дефолт synth:4300)
#   __SYNTH_BACKEND_TARGET__  → SYNTH_METRICS_BACKEND_TARGET  (дефолт host.docker.internal:5000)
#
# /metrics выключен по умолчанию (ADR-094 п. 4): перед запуском включите
# SYNTH_METRICS_ENABLED=true (см. deploy/observability/README.md).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: synth-dev

# Правила алертов — тот же файл, что уходит в чарт (plain Prometheus, не PrometheusRule).
rule_files:
  - /etc/prometheus/rules/synth-rules.yaml

scrape_configs:
  # Standalone-core (`synth serve` / контейнер `synth`): порт 4300.
  - job_name: synth
    metrics_path: /metrics
    static_configs:
      - targets:
          - __SYNTH_CORE_TARGET__
        labels:
          component: core

  # Backend API Hub (`./scripts/dev.sh backend` / неймспейс k3s): порт 5000.
  - job_name: synth-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - __SYNTH_BACKEND_TARGET__
        labels:
          component: backend
