# OIDC-режим (Keycloak или иной IdP). Client secret в values НЕ хранится —
# он читается из Secret по ключу SYNTH_OIDC_CLIENT_SECRET.
#
# 1) Создайте Secret (имя по умолчанию — secrets.existingSecret: synth-secrets):
#      kubectl create secret generic synth-secrets \
#        --namespace synth \
#        --from-literal=SYNTH_OIDC_CLIENT_SECRET='<client-secret>'
# 2) Установите чарт:
#      helm install synth ./charts/synth -f charts/synth/examples/values-keycloak.yaml \
#        --namespace synth --create-namespace
#
# Замените плейсхолдеры <...>. Несовместимо с backend.auth.apiKey.enabled: true.

backend:
  oidc:
    enabled: true
    issuer: "https://keycloak.example.com/realms/<realm>"
    clientId: "synth"
    redirectUri: "https://synth.example.com/auth/callback"
  auth:
    apiKey:
      enabled: false

ingress:
  enabled: true
  controller: nginx
  className: ""
  hosts:
    - host: synth.example.com
      paths:
        - { path: /, pathType: Prefix }
  tls:
    - secretName: synth-tls
      hosts: [synth.example.com]
