# ─────────────────────────────────────────────────────────────────────────────
# Пример конфигурации чарта synth для self-host / preprod.
#
# Использование:
#   helm install synth ./charts/synth -f my-values.yaml
#
# ВАЖНО: это пример — замените все плейсхолдеры (<...>) на свои значения.
# Реальных секретов здесь нет и быть не должно: секреты живут в Kubernetes Secret
# (см. secrets.existingSecret ниже), а не в values-файле.
# ─────────────────────────────────────────────────────────────────────────────

# ── Образы ───────────────────────────────────────────────────────────────────
backend:
  image:
    # Реестр и репозиторий образа backend.
    repository: gitverse.ru/itphx/synth-backend
    # Тег образа. Пусто → подставляется .Chart.AppVersion.
    tag: ""                     # например, "0.6.1"
    pullPolicy: IfNotPresent

  # Если образы в приватном реестре — раскомментируйте и укажите Secret
  # типа kubernetes.io/dockerconfigjson.
  # imagePullSecrets:
  #   - name: my-registry

  # ── Постоянное хранилище JSON-данных ───────────────────────────────────────
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""            # "" = storageClass по умолчанию кластера
    accessMode: ReadWriteOnce
    existingClaim: ""

  # ── OIDC-провайдер (Keycloak, Authentik, Okta и т.п.) ──────────────────────
  oidc:
    enabled: true
    issuer: "https://keycloak.example.com/realms/<realm>"
    clientId: "synth"
    redirectUri: "https://synth.example.com/auth/callback"

  # ── Провайдеры LLM ─────────────────────────────────────────────────────────
  # Каждый провайдер рендерит env SYNTH_PROVIDER_<NAME>_URL/TYPE/MODEL.
  # API-ключ (если apiKey не false) берётся из Secret по ключу
  # SYNTH_PROVIDER_<NAME>_API_KEY.
  providers:
    - name: openai
      type: openai
      url: "https://api.openai.com/v1/"
      model: "gpt-4o-mini"
      apiKey: true              # ключ SYNTH_PROVIDER_OPENAI_API_KEY — в Secret
    - name: local
      type: ollama
      url: "http://ollama.internal:11434"
      model: "qwen2.5:14b"
      apiKey: false             # без ключа

  # ── Доп. env (опционально) ─────────────────────────────────────────────────
  # NODE_EXTRA_CA_CERTS добавляется автоматически при непустом caCert.
  # extraEnv:
  #   SYNTH_LOG_LEVEL: debug

  # ── Декларативный config.yaml (опционально) ────────────────────────────────
  # Непустой объект → ConfigMap <release>-config, монтируется в backend как
  # /etc/synth/config.yaml. Это низкоприоритетный источник: его перекрывают
  # CLI-флаги и SYNTH_* env, а runtime-настройки из UI/API применяются поверх.
  # Пример — авто-привязка внешних событий и включённый шедулер:
  # config:
  #   events:
  #     autoBind: true
  #   scheduler:
  #     enabled: true

# ── UI ───────────────────────────────────────────────────────────────────────
ui:
  image:
    repository: gitverse.ru/itphx/synth-ui
    tag: ""                     # пусто → .Chart.AppVersion
    pullPolicy: IfNotPresent
  # imagePullSecrets:
  #   - name: my-registry

# ── Secret с секретами (создаётся вне чарта) ─────────────────────────────────
# Ожидаемые ключи:
#   SYNTH_OIDC_CLIENT_SECRET            — client secret OIDC (при oidc.enabled)
#   SYNTH_PROVIDER_<NAME>_API_KEY       — ключ каждого провайдера с apiKey: true
#
# Пример создания:
#   kubectl create secret generic synth-secrets \
#     --from-literal=SYNTH_OIDC_CLIENT_SECRET='<secret>' \
#     --from-literal=SYNTH_PROVIDER_OPENAI_API_KEY='<key>'
secrets:
  existingSecret: synth-secrets

# ── Ingress, TLS и HTTP→HTTPS ────────────────────────────────────────────────
# По умолчанию — nginx: HTTP→HTTPS через аннотацию ssl-redirect, TLS терминирует
# nginx-контроллер. Входные аннотации контроллера:
#   controller: nginx   — nginx.ingress.kubernetes.io/ssl-redirect при redirectHttpToHttps
#   controller: traefik — traefik.ingress.kubernetes.io/router.entrypoints + CRD
#                         Middleware/IngressRoute при redirectHttpToHttps
#   controller: none    — без аннотаций контроллера и без CRD
ingress:
  enabled: true
  controller: nginx
  className: ""                 # "" = класс по умолчанию; для nginx обычно "nginx"
  redirectHttpToHttps: true     # нужен настроенный TLS (см. tls ниже)
  # Произвольные аннотации Ingress — мержатся с авто-аннотациями контроллера.
  # Раскомментируйте нужные, например для cert-manager:
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: synth.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: synth-tls     # <placeholder> — существующий TLS-secret
      hosts:
        - synth.example.com

# ── Вариант для Traefik (закомментировано) ───────────────────────────────────
# ingress:
#   enabled: true
#   controller: traefik
#   className: traefik
#   entrypoints: websecure      # Traefik: вход только по HTTPS
#   redirectHttpToHttps: true   # Middleware + IngressRoute: web → 301 https
#   hosts:
#     - host: synth.example.com
#       paths:
#         - path: /
#           pathType: Prefix
#   tls:
#     - secretName: synth-tls
#       hosts:
#         - synth.example.com

# ── CA внутренней инфраструктуры (опционально) ───────────────────────────────
# Заполните, если backend обращается к ресурсам (IdP, LLM-провайдеры) с
# сертификатами, подписанными собственным CA. При непустом значении чарт создаёт
# ConfigMap и монтирует сертификат в backend, автоматически добавляя
# NODE_EXTRA_CA_CERTS=/etc/ssl/certs/itphx-ca.crt.
#
# Удобно передавать через файл, не встраивая PEM в values:
#   helm install synth ./charts/synth \
#     --set-file caCert=./my-ca.crt -f my-values.yaml
#
# caCert: |
#   -----BEGIN CERTIFICATE-----
#   <PEM вашего CA>
#   -----END CERTIFICATE-----
caCert: ""

# ── Произвольные дополнительные манифесты (опционально) ──────────────────────
# Список Kubernetes-манифестов: рендерятся как есть (любой kind). Namespace
# указывать не обязательно — подставится namespace релиза.
# Пример:
# extraObjects:
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata:
#       name: synth-extra
#     data:
#       key: value
