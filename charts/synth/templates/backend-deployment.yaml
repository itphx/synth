{{- /* Провайдеры, для которых нужен API-ключ из Secret (apiKey не равен false). */ -}}
{{- $providerKeys := list -}}
{{- range .Values.backend.providers -}}
{{- if ne .apiKey false -}}
{{- $providerKeys = append $providerKeys .name -}}
{{- end -}}
{{- end -}}
{{- /* API-key режим (без OIDC): ключ только из Secret → env SYNTH_API_KEY.
       Режимы взаимоисключающие — одновременное включение apiKey и OIDC
       роняет рендер с понятной ошибкой (а не молчаливым приоритетом). */ -}}
{{- $authApiKey := (.Values.backend.auth | default dict).apiKey | default dict -}}
{{- if and $authApiKey.enabled .Values.backend.oidc.enabled -}}
{{- fail "backend.auth.apiKey.enabled и backend.oidc.enabled взаимоисключающие: включите либо API-key (SYNTH_API_KEY), либо OIDC, но не оба" -}}
{{- end -}}
{{- /* PROP-077: split-режим — control plane получает адрес пула исполнителей
       и ПУТЬ к файлу с токеном (значение токена в env/ConfigMap не попадает,
       инвариант 13). */ -}}
{{- $executionRemote := include "synth.execution.isRemote" . -}}
{{- /* Общий том workspace смонтирован в control plane (тот же, что у пула). */ -}}
{{- $sharedWorkspace := and ((.Values.executor | default dict).enabled) (include "synth.executor.workspaceEnabled" .) -}}
{{- $needEnv := or .Values.backend.oidc.enabled $authApiKey.enabled $providerKeys .Values.caCert .Values.installerKey.enabled (include "synth.storage.isPostgres" .) .Values.backend.restartMode .Values.metrics.enabled (include "synth.execution.isRemote" .) $sharedWorkspace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synth.backend.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "synth.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synth.backend.selectorLabels" . | nindent 8 }}
      {{- /* Метка сборки в pod-шаблоне — триггер раскатки. App-версия образа
             не меняется между сборками (меняется только номер сборки), поэтому
             без этой аннотации пересборка образа с тем же тегом НЕ приводила бы
             к пересозданию пода — Helm не видит изменения в pod-шаблоне. Версия
             чарта меняется при каждой публикации → rollout происходит. */}}
      annotations:
        synth.io/build: {{ .Chart.Version | quote }}
      {{- /* ADR-094: vanilla Prometheus без CRD — скрейп по аннотациям.
             Включать вместе с metrics.enabled (иначе 404 → up==0). */}}
      {{- if .Values.metrics.prometheus.annotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.backend.service.targetPort | quote }}
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "synth.backend.fullname" . }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "synth.name" . }}-env
          {{- if $needEnv }}
          env:
            {{- /* Restart из UI: exit 75 → Deployment (restartPolicy: Always) поднимает pod. */}}
            {{- if .Values.backend.restartMode }}
            - name: SYNTH_RESTART_MODE
              value: {{ .Values.backend.restartMode | quote }}
            {{- end }}
            {{- if .Values.backend.oidc.enabled }}
            - name: SYNTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SYNTH_OIDC_CLIENT_SECRET
            {{- end }}
            {{- /* API-key режим: только secretKeyRef, optional=false — pod ждёт
                   появления Secret/ключа (без ключа backend не аутентифицирует). */}}
            {{- if $authApiKey.enabled }}
            - name: SYNTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $authApiKey.existingSecret | default .Values.secrets.existingSecret }}
                  key: {{ $authApiKey.secretKey | default "SYNTH_API_KEY" }}
                  optional: false
            {{- end }}
            {{- range .Values.backend.providers }}
            {{- if ne .apiKey false }}
            - name: SYNTH_PROVIDER_{{ include "synth.envName" . }}_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: SYNTH_PROVIDER_{{ include "synth.envName" . }}_API_KEY
            {{- end }}
            {{- end }}
            {{- if .Values.caCert }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/itphx-ca.crt
            {{- end }}
            {{- if .Values.installerKey.enabled }}
            - name: SYNTH_BOOTSTRAP_SERVICE_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.installerKey.existingSecret | default .Values.installerKey.secretName }}
                  key: {{ .Values.installerKey.bootstrapKey }}
            {{- end }}
            {{- /* ADR-094: /metrics включается явно; токен — опционально из
                   Secret (optional задаётся metrics.tokenOptional: true —
                   отсутствие ключа не мешает старту). */}}
            {{- if .Values.metrics.enabled }}
            - name: SYNTH_METRICS_ENABLED
              value: "true"
            {{- if .Values.metrics.existingSecret }}
            - name: SYNTH_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrics.existingSecret }}
                  key: {{ .Values.metrics.tokenKey | default "SYNTH_METRICS_TOKEN" }}
                  optional: {{ .Values.metrics.tokenOptional }}
            {{- end }}
            {{- end }}
            {{- /* PROP-032: пароль БД — только env из Secret (в config.yaml не
                   попадает, инвариант 13). Пустой/отсутствующий ключ → core
                   попробует файл {dataDir}/secrets/postgres-password. */}}
            {{- if include "synth.storage.isPostgres" . }}
            - name: SYNTH_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.postgres.existingSecret | default .Values.secrets.existingSecret }}
                  key: {{ .Values.storage.postgres.secretPasswordKey }}
                  optional: true
            {{- end }}
            {{- /* PROP-077: split-режим (execution.mode=remote). Адреса
                   исполнителей — список через запятую; пусто + executor.enabled
                   → адрес Service пула. Токен — путь к файлу (Secret смонтирован
                   ниже), не значение. */}}
            {{- if $executionRemote }}
            - name: SYNTH_EXECUTION_MODE
              value: "remote"
            - name: SYNTH_EXECUTION_REMOTE_URL
              value: {{ include "synth.execution.remoteUrls" . | quote }}
            - name: SYNTH_EXECUTION_TOKEN
              value: {{ include "synth.execution.tokenFilePath" . | quote }}
            - name: SYNTH_EXECUTION_TIMEOUT_MS
              value: {{ ((.Values.execution | default dict).remote | default dict).timeoutMs | default 30000 | int64 | quote }}
            {{- with ((.Values.execution | default dict).remote | default dict).concurrency }}
            - name: SYNTH_EXECUTION_CONCURRENCY
              value: {{ . | int64 | quote }}
            {{- end }}
            - name: SYNTH_EXECUTION_FAIL_MODE
              value: {{ include "synth.execution.failMode" . | quote }}
            {{- end }}
            {{- /* PROP-077: каталог workspace на стороне backend'а. Задаётся,
                   только если отличается от дефолта {dataDir}/workspaces —
                   иначе backend создал бы каталоги проектов вне общего тома,
                   и исполнитель их не увидит. */}}
            {{- if $sharedWorkspace }}
            {{- with .Values.executor.workspace.backendWorkspacesRoot }}
            - name: SYNTH_WORKSPACES_ROOT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/synth/data
            {{- if include "synth.backend.hasConfigMap" . }}
            - name: config
              mountPath: /etc/synth
              readOnly: true
            {{- end }}
            {{- if .Values.caCert }}
            - name: itphx-ca
              mountPath: /etc/ssl/certs/itphx-ca.crt
              subPath: itphx-ca.crt
            {{- end }}
            {{- /* ADR-099: Secret с CA/клиентскими сертификатами (только чтение,
                   0400). В config.yaml уходят ТОЛЬКО пути внутри контейнера. */}}
            {{- if include "synth.tls.mounted" . }}
            - name: tls
              mountPath: {{ include "synth.backend.tlsMountDir" . }}
              readOnly: true
            {{- end }}
            {{- /* PROP-077: общий том workspace — те же файлы, что у пула
                   исполнителей (иначе исполнитель их не увидит). */}}
            {{- if $sharedWorkspace }}
            - name: executor-workspace
              mountPath: {{ .Values.executor.workspace.mountPath }}
            {{- end }}
            {{- /* PROP-077: токен исполнителя — файлом (0400); в env backend'а
                   идёт путь, а не значение (инвариант 13). */}}
            {{- if $executionRemote }}
            - name: executor-token
              mountPath: {{ include "synth.execution.tokenMountDir" . }}
              readOnly: true
            {{- end }}
          {{- with .Values.backend.probes.liveness }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.backend.service.targetPort }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.backend.probes.readiness }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.backend.service.targetPort }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.backend.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.backend.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "synth.backend.fullname" . }}-data
          {{- end }}
        {{- if include "synth.backend.hasConfigMap" . }}
        - name: config
          configMap:
            name: {{ include "synth.name" . }}-config
        {{- end }}
        {{- if .Values.caCert }}
        - name: itphx-ca
          configMap:
            name: {{ include "synth.name" . }}-itphx-ca
        {{- end }}
        {{- /* ADR-099: CA/клиентские сертификаты — из Secret, права 0400. */}}
        {{- if include "synth.tls.mounted" . }}
        - name: tls
          secret:
            secretName: {{ .Values.security.tls.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- /* PROP-077: общий том workspace (control plane ↔ исполнители). */}}
        {{- if $sharedWorkspace }}
        - name: executor-workspace
          persistentVolumeClaim:
            claimName: {{ include "synth.executor.workspaceClaim" . }}
        {{- end }}
        {{- /* PROP-077: Secret с токеном исполнителя — ключ спроецирован в файл
               `token` (0400); backend читает токен по этому пути. */}}
        {{- if $executionRemote }}
        - name: executor-token
          secret:
            secretName: {{ include "synth.execution.tokenSecretName" . }}
            defaultMode: 0400
            items:
              - key: {{ include "synth.execution.tokenKey" . }}
                path: token
        {{- end }}
