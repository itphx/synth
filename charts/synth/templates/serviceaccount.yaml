apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synth.backend.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synth.ui.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- /* ADR-077: пул исполнителей — свой ServiceAccount без доступа к API
       Kubernetes (токен не монтируется: automountServiceAccountToken=false
       в Deployment исполнителя). */}}
{{- if .Values.executor.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synth.executor.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
{{- end }}
{{- /* PROP-135 Ф4b-2b: ServiceAccount provisioner'а. В отличие от исполнителя,
       ему НУЖЕН доступ к API Kubernetes (поды и секреты пулов) — токен
       монтируется, права — Role в namespace релиза (provisioner-rbac.yaml). */}}
{{- if and .Values.provisioner.enabled (.Values.provisioner.serviceAccount | default dict).create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synth.provisioner.serviceAccountName" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
{{- end }}
