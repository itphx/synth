apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synth.backend.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synth.ui.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- /* ADR-077: пул исполнителей — свой ServiceAccount без доступа к API
       Kubernetes (токен не монтируется: automountServiceAccountToken=false
       в Deployment исполнителя). */}}
{{- if .Values.executor.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synth.executor.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
{{- end }}
