{{- /* ADR-077, шаг 7c: пул исполнителей (executor/worker) — отдельные
       контейнеры с toolchain'ом. Backend в split-режиме — тонкий control
       plane: команды агентских тулов уходят сюда по HTTP (exec-API). */ -}}
{{- if .Values.executor.enabled }}
{{- /* Fail-closed: исполнителю обязателен корень workspace
       (SYNTH_EXECUTOR_WORKSPACE — без него процесс не стартует). */ -}}
{{- if not (include "synth.executor.workspaceEnabled" .) }}
{{- fail "executor.enabled: true требует executor.workspace.enabled: true — исполнитель работает в общем томе workspace (ADR-077)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synth.executor.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
spec:
  replicas: {{ .Values.executor.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "synth.executor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synth.executor.selectorLabels" . | nindent 8 }}
      annotations:
        synth.io/build: {{ .Chart.Version | quote }}
    spec:
      {{- with .Values.executor.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "synth.executor.fullname" . }}
      {{- /* Исполнитель не ходит в API Kubernetes — токен не монтируем. */}}
      automountServiceAccountToken: false
      {{- with .Values.executor.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: executor
          image: "{{ .Values.executor.image.repository }}:{{ .Values.executor.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.executor.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.executor.service.targetPort }}
              protocol: TCP
          {{- /* Конфигурация исполнителя — только env (нет config.yaml:
                 у воркера нет доступа к каталогу данных инстанса). */}}
          env:
            - name: SYNTH_EXECUTOR_HOST
              value: "0.0.0.0"
            - name: SYNTH_EXECUTOR_PORT
              value: {{ .Values.executor.service.targetPort | int64 | quote }}
            {{- /* Токен доверия — значение из Secret (инвариант 13). Процесс
                   исполнителя вычитывает его при старте и вычищает из
                   process.env — в окружение дочерних процессов он не утечёт. */}}
            - name: SYNTH_EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "synth.execution.tokenSecretName" . }}
                  key: {{ include "synth.execution.tokenKey" . }}
                  optional: false
            {{- /* Корень workspace — граница containment'а для `cwd`. */}}
            - name: SYNTH_EXECUTOR_WORKSPACE
              value: {{ .Values.executor.workspace.mountPath | quote }}
            - name: SYNTH_EXECUTOR_MAX_CONCURRENCY
              value: {{ .Values.executor.limits.maxConcurrency | int64 | quote }}
            - name: SYNTH_EXECUTOR_MAX_TIMEOUT_MS
              value: {{ .Values.executor.limits.maxTimeoutMs | int64 | quote }}
            - name: SYNTH_EXECUTOR_MAX_OUTPUT_BYTES
              value: {{ .Values.executor.limits.maxOutputBytes | int64 | quote }}
            {{- /* MCP-серверы, которые исполнитель хостит у себя (ADR-077, шаг
                   B1). Пустой список → env не выставляется: действует дефолт
                   образа (у flavor'ов с браузером — Playwright MCP).
                   enabled: false → пустое значение = «серверов нет». */}}
            {{- with .Values.executor.mcp }}
            {{- if not .enabled }}
            - name: SYNTH_EXECUTOR_MCP_SERVERS
              value: ""
            {{- else if .servers }}
            - name: SYNTH_EXECUTOR_MCP_SERVERS
              value: {{ .servers | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- /* Доверие git у исполнителя: CA — конфигурация исполнителя
                   (ADR-077 «Обновлено 2026-10-26», (в); ADR-099). Путь
                   передаётся значением (файл смонтирован в /etc/synth/tls);
                   задан, но файл не читается — исполнитель не стартует
                   (fail-closed). */}}
            {{- with .Values.executor.tls }}
            {{- if .caSecret }}
            - name: SYNTH_EXECUTOR_TLS_CA_FILE
              value: "/etc/synth/tls/{{ .caKey }}"
            {{- end }}
            {{- end }}
          volumeMounts:
            {{- /* Общий том workspace: те же файлы, что у control plane. */}}
            - name: workspace
              mountPath: {{ .Values.executor.workspace.mountPath }}
            {{- /* CA доверия git — только на чтение. */}}
            {{- with .Values.executor.tls }}
            {{- if .caSecret }}
            - name: executor-tls
              mountPath: /etc/synth/tls
              readOnly: true
            {{- end }}
            {{- end }}
          {{- with .Values.executor.probes.liveness }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.executor.service.targetPort }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.executor.probes.readiness }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.executor.service.targetPort }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.executor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.executor.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "synth.executor.workspaceClaim" . }}
        {{- /* CA доверия git — Secret (readonly). Значений в values нет
               (инвариант 13): только ссылка на Secret. */}}
        {{- with .Values.executor.tls }}
        {{- if .caSecret }}
        - name: executor-tls
          secret:
            secretName: {{ .caSecret }}
            defaultMode: 0444
        {{- end }}
        {{- end }}
{{- end }}
