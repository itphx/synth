{{- /* ADR-077, шаг 7c: пул исполнителей (executor/worker) — отдельные
       контейнеры с toolchain'ом. Backend в split-режиме — тонкий control
       plane: команды агентских тулов уходят сюда по HTTP (exec-API). */ -}}
{{- if .Values.executor.enabled }}
{{- /* Fail-closed: исполнителю обязателен корень workspace
       (SYNTH_EXECUTOR_WORKSPACE — без него процесс не стартует). */ -}}
{{- if not (include "synth.executor.workspaceEnabled" .) }}
{{- fail "executor.enabled: true требует executor.workspace.enabled: true — исполнитель работает в общем томе workspace (ADR-077)" }}
{{- end }}
{{- /* Внешний чекер команд (PROP-136b): провайдер — только http|opa. */ -}}
{{- with .Values.executor.commandPolicy }}
{{- if .enabled }}
{{- if not (has (.provider | default "http") (list "http" "opa")) }}
{{- fail "executor.commandPolicy.provider: ожидается http или opa" }}
{{- end }}
{{- end }}
{{- end }}
{{- /* PROP-137 Ф2: read-only корневая ФС исполнителя. Итог = флаг
       `executor.readOnlyRootFilesystem` И `containerSecurityContext.readOnlyRootFilesystem`
       (по умолчанию оба true). При read-only корневой ФС контейнеру нужны
       writable-каталоги `/tmp` (SSH-материал, логи фоновых процессов) и
       `/home/synth` (кэши pnpm/pip/corepack, `PYTHONUSERBASE`) — `emptyDir`. */ -}}
{{- $roRootFs := eq (include "synth.readOnlyRootFilesystem" (dict "flag" (.Values.executor.readOnlyRootFilesystem | default false) "ctx" (.Values.executor.containerSecurityContext | default dict))) "true" -}}
{{- $ownership := .Values.executor.ownershipInitContainer | default dict -}}
{{- /* Пользовательские метки/аннотации пода. Служебные ключи исключаются:
       иначе в YAML были бы дубли ключей (Kubernetes такое не принимает), а
       служебные всё равно приоритетнее. */ -}}
{{- $podLabels := omit (.Values.executor.podLabels | default dict) "app.kubernetes.io/name" "app.kubernetes.io/component" "app.kubernetes.io/instance" "synth.io/network" -}}
{{- $podAnnotations := omit (.Values.executor.podAnnotations | default dict) "synth.io/build" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synth.executor.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
spec:
  replicas: {{ .Values.executor.replicaCount }}
  revisionHistoryLimit: 2
  {{- /* Медленный первый старт (chown корня NFS-тома workspace после смены
         fsGroupChangePolicy, pull образа) не должен ронять релиз. */}}
  progressDeadlineSeconds: {{ .Values.executor.progressDeadlineSeconds | default 1200 }}
  selector:
    matchLabels:
      {{- include "synth.executor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- /* Пользовательские метки пода (служебные — приоритетнее, дубли
               ключей исключены выше). */}}
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "synth.executor.selectorLabels" . | nindent 8 }}
        {{- /* PROP-137b-2: сетевой класс пула — подпись `synth.io/network`.
               По ней политику класса выбирают поды (в том числе динамические
               пулы provisioner'а — у них та же подпись). Значение
               валидируется (fail-closed): неизвестный класс → ошибка
               рендера. Подпись НЕ входит в `spec.selector` Deployment'а
               (селектор неизменяем) — она только расширяет набор подов
               шаблона. */}}
        synth.io/network: {{ include "synth.executor.networkClass" . }}
      annotations:
        {{- /* Пользовательские аннотации пода (служебные — приоритетнее). */}}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        synth.io/build: {{ .Chart.Version | quote }}
    spec:
      {{- with .Values.executor.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "synth.executor.fullname" . }}
      {{- /* Исполнитель не ходит в API Kubernetes — токен не монтируем. */}}
      automountServiceAccountToken: false
      {{- with .Values.executor.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* PROP-137 Ф2: init-контейнер смены владельца тома workspace (по
             умолчанию выключен). Нужен там, где `fsGroup` kubelet'а не
             действует (hostPath/NFS). Работает от root — несовместимо с PSS
             `restricted`, поэтому включается осознанно. */}}
      {{- if $ownership.enabled }}
      initContainers:
        - name: ownership
          image: "{{ $ownership.image | default (printf "%s:%s" .Values.executor.image.repository (.Values.executor.image.tag | default .Chart.AppVersion)) }}"
          imagePullPolicy: {{ $ownership.imagePullPolicy | default .Values.executor.image.pullPolicy }}
          command:
            - sh
            - -c
            - chown -R 1000:1000 "{{ .Values.executor.workspace.mountPath }}"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          {{- with $ownership.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.executor.workspace.mountPath }}
      {{- end }}
      containers:
        - name: executor
          image: "{{ .Values.executor.image.repository }}:{{ .Values.executor.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.executor.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.executor.service.targetPort }}
              protocol: TCP
          {{- /* Конфигурация исполнителя — только env (нет config.yaml:
                 у воркера нет доступа к каталогу данных инстанса). */}}
          env:
            - name: SYNTH_EXECUTOR_HOST
              value: "0.0.0.0"
            - name: SYNTH_EXECUTOR_PORT
              value: {{ .Values.executor.service.targetPort | int64 | quote }}
            {{- /* Токен доверия — значение из Secret (инвариант 13). Процесс
                   исполнителя вычитывает его при старте и вычищает из
                   process.env — в окружение дочерних процессов он не утечёт. */}}
            - name: SYNTH_EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "synth.execution.tokenSecretName" . }}
                  key: {{ include "synth.execution.tokenKey" . }}
                  optional: false
            {{- /* Корень workspace — граница containment'а для `cwd`. */}}
            - name: SYNTH_EXECUTOR_WORKSPACE
              value: {{ .Values.executor.workspace.mountPath | quote }}
            - name: SYNTH_EXECUTOR_MAX_CONCURRENCY
              value: {{ .Values.executor.limits.maxConcurrency | int64 | quote }}
            - name: SYNTH_EXECUTOR_MAX_TIMEOUT_MS
              value: {{ .Values.executor.limits.maxTimeoutMs | int64 | quote }}
            - name: SYNTH_EXECUTOR_MAX_OUTPUT_BYTES
              value: {{ .Values.executor.limits.maxOutputBytes | int64 | quote }}
            {{- /* ADR-077 шаг 7d: метрики исполнителя выключены по умолчанию
                   (`GET /metrics` → 404). env выставляется только при явном
                   включении — дефолт образа остаётся в силе. */}}
            {{- if .Values.executor.metrics.enabled }}
            - name: SYNTH_EXECUTOR_METRICS_ENABLED
              value: "true"
            {{- end }}
            {{- /* MCP-серверы, которые исполнитель хостит у себя (ADR-077, шаг
                   B1). Пустой список → env не выставляется: действует дефолт
                   образа (у flavor'ов с браузером — Playwright MCP).
                   enabled: false → пустое значение = «серверов нет». */}}
            {{- with .Values.executor.mcp }}
            {{- if not .enabled }}
            - name: SYNTH_EXECUTOR_MCP_SERVERS
              value: ""
            {{- else if .servers }}
            - name: SYNTH_EXECUTOR_MCP_SERVERS
              value: {{ .servers | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- /* Доверие git у исполнителя: CA — конфигурация исполнителя
                   (ADR-077 «Обновлено 2026-10-26», (в); ADR-099). Путь
                   передаётся значением (файл смонтирован в /etc/synth/tls);
                   задан, но файл не читается — исполнитель не стартует
                   (fail-closed). */}}
            {{- with .Values.executor.tls }}
            {{- if .caSecret }}
            - name: SYNTH_EXECUTOR_TLS_CA_FILE
              value: "/etc/synth/tls/{{ .caKey }}"
            {{- end }}
            {{- end }}
            {{- /* Внешний чекер команд (PROP-136b): env рендерится только при
                   `enabled`: выключенный чекер не меняет поведение исполнителя.
                   Токен — файлом из Secret (readOnly); значение в values не
                   хранится (инвариант 13). Без `url` рендер падает: исполнитель
                   без адреса не стартует (fail-closed). */}}
            {{- with .Values.executor.commandPolicy }}
            {{- if .enabled }}
            - name: SYNTH_EXECUTOR_COMMAND_POLICY_PROVIDER
              value: {{ .provider | default "http" | quote }}
            - name: SYNTH_EXECUTOR_COMMAND_POLICY_URL
              value: {{ required "executor.commandPolicy.url обязателен при executor.commandPolicy.enabled: true — без адреса чекера исполнитель не стартует (fail-closed)" .url | quote }}
            - name: SYNTH_EXECUTOR_COMMAND_POLICY_FAIL_MODE
              value: {{ .failMode | default "closed" | quote }}
            - name: SYNTH_EXECUTOR_COMMAND_POLICY_TIMEOUT_MS
              value: {{ .timeoutMs | default 2000 | int64 | quote }}
            - name: SYNTH_EXECUTOR_COMMAND_POLICY_CACHE_TTL_MS
              value: {{ .cacheTtlMs | default 60000 | int64 | quote }}
            - name: SYNTH_EXECUTOR_COMMAND_POLICY_OPA_PATH
              value: {{ .opaPath | default "/v1/data/synth/exec/decision" | quote }}
            {{- with .token }}
            {{- if .existingSecret }}
            - name: SYNTH_EXECUTOR_COMMAND_POLICY_TOKEN_FILE
              value: {{ .mountPath | default "/etc/synth/command-policy/token" | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
          volumeMounts:
            {{- /* Общий том workspace: те же файлы, что у control plane. */}}
            - name: workspace
              mountPath: {{ .Values.executor.workspace.mountPath }}
            {{- /* PROP-137 Ф2: read-only корневая ФС → writable-каталоги
                   `/tmp` (SSH-материал, логи фоновых процессов) и `/home/synth`
                   (кэши pnpm/pip/corepack, `PYTHONUSERBASE`). Без них процесс
                   падает с EACCES. */}}
            {{- if $roRootFs }}
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/synth
            {{- end }}
            {{- /* CA доверия git — только на чтение. */}}
            {{- with .Values.executor.tls }}
            {{- if .caSecret }}
            - name: executor-tls
              mountPath: /etc/synth/tls
              readOnly: true
            {{- end }}
            {{- end }}
            {{- /* Токен чекера команд: один файл из Secret по `subPath` — в под
                   не попадают прочие ключи Secret. */}}
            {{- with .Values.executor.commandPolicy }}
            {{- if and .enabled .token.existingSecret }}
            - name: executor-command-policy
              mountPath: {{ .token.mountPath | default "/etc/synth/command-policy/token" }}
              subPath: token
              readOnly: true
            {{- end }}
            {{- end }}
          {{- with .Values.executor.probes.liveness }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.executor.service.targetPort }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.executor.probes.readiness }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.executor.service.targetPort }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.executor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* PROP-137 Ф2: итоговое `readOnlyRootFilesystem` = флаг
                 `executor.readOnlyRootFilesystem` И значение из
                 `containerSecurityContext` (по умолчанию оба true). */}}
          {{- with .Values.executor.containerSecurityContext }}
          securityContext:
            {{- $sc := deepCopy . }}
            {{- $_ := set $sc "readOnlyRootFilesystem" $roRootFs }}
            {{- toYaml $sc | nindent 12 }}
          {{- end }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "synth.executor.workspaceClaim" . }}
        {{- /* PROP-137 Ф2: writable-каталоги для контейнера с read-only
               корневой ФС (`/tmp` и `/home/synth`). */}}
        {{- if $roRootFs }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- end }}
        {{- /* CA доверия git — Secret (readonly). Значений в values нет
               (инвариант 13): только ссылка на Secret. Режим считает
               `synth.secretVolumeMode` от executor.podSecurityContext: 0440
               при заданном fsGroup (владелец root, группа = fsGroup — процесс
               читает по группе), иначе 0444 — группового чтения нет, поэтому
               файлы (root:root) остаются читаемыми только «остальным»
               (world-readable; совместимость при `fsGroup: null`). */}}
        {{- with .Values.executor.tls }}
        {{- if .caSecret }}
        - name: executor-tls
          secret:
            secretName: {{ .caSecret }}
            defaultMode: {{ include "synth.secretVolumeMode" $.Values.executor.podSecurityContext }}
        {{- end }}
        {{- end }}
        {{- /* Токен чекера команд — Secret (readonly, инвариант 13). Режим —
               как у прочих Secret-томов исполнителя (0440 при fsGroup, иначе 0444). */}}
        {{- with .Values.executor.commandPolicy }}
        {{- if and .enabled .token.existingSecret }}
        - name: executor-command-policy
          secret:
            secretName: {{ .token.existingSecret }}
            defaultMode: {{ include "synth.secretVolumeMode" $.Values.executor.podSecurityContext }}
            items:
              - key: {{ .token.key | default "token" }}
                path: token
        {{- end }}
        {{- end }}
{{- end }}
