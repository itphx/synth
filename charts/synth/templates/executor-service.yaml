{{- /* ADR-077, шаг 7c: Service пула исполнителей. Control plane ходит по
       этому адресу (SYNTH_EXECUTION_REMOTE_URL); балансировку по репликам
       делает Kubernetes. */ -}}
{{- if .Values.executor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synth.executor.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
spec:
  type: {{ .Values.executor.service.type }}
  {{- /* Привязка клиента к поду пула: браузерные MCP-сессии живут внутри пода
         исполнителя, а control plane ходит в пул по одному адресу (ClusterIP) —
         балансировка per TCP-соединение, поэтому без привязки последовательные
         вызовы одной сессии попадали бы на разные поды. "None" — дефолт
         Kubernetes, поле не рендерим: дефолтный манифест Service не меняется
         побайтово. */ -}}
  {{- with .Values.executor.service.sessionAffinity }}
  {{- if ne . "None" }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- end }}
  ports:
    - port: {{ .Values.executor.service.port }}
      targetPort: {{ .Values.executor.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "synth.executor.selectorLabels" . | nindent 4 }}
{{- end }}
