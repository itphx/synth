{{- if and .Values.backend.persistence.enabled (not .Values.backend.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "synth.backend.fullname" . }}-data
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- if .Values.backend.persistence.keepOnUninstall }}
  # Аннотация обязана быть в манифесте релиза: Helm при uninstall фильтрует
  # ресурсы по манифесту и не видит аннотацию, проставленную вручную на живом PVC.
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ .Values.backend.persistence.accessMode }}
  {{- with .Values.backend.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size }}
{{- end }}
