{{- /* ADR-094: дашборды Grafana из charts/synth/files/dashboards/*.json.
       Один ConfigMap; label grafana_dashboard=<label> подхватывает sidecar
       Grafana (kube-prometheus-stack / grafana с sidecar.dashboards.enabled). */ -}}
{{- if .Values.grafana.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synth.name" . }}-grafana-dashboards
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    grafana_dashboard: {{ .Values.grafana.dashboards.label | default "1" | quote }}
    {{- with .Values.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafana.dashboards.folder }}
  annotations:
    # Папка, в которую sidecar положит дашборды (пусто → General).
    grafana_folder: {{ . | quote }}
  {{- end }}
data:
  {{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
