{{- /* Декларативный config.yaml backend (ADR-023). Рендерится, если задан
       backend.config ИЛИ домерживаются chart-значения storage.* (PROP-032). */ -}}
{{- if include "synth.backend.hasConfigMap" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synth.name" . }}-config
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  config.yaml: |
    {{- include "synth.backend.configYaml" . | nindent 4 }}
{{- end }}
