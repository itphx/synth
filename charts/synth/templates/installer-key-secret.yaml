{{- /*
Installer service-key Secret (AD-052/O1).

Создаётся только при `installerKey.enabled: true` и пустом `installerKey.existingSecret`.
По ключу `installerKey.bootstrapKey` лежит JSON-массив для env
`SYNTH_BOOTSTRAP_SERVICE_KEYS` (backend Deployment ссылается на него через secretKeyRef);
токен формата `synth_svc_<base64url>` нигде не логируется и в ConfigMap не попадает.

Стабильность токена между `helm upgrade`: если Secret уже есть в кластере, его текущее
значение переиспользуется (`lookup`). Вне кластера (`helm template`, `--dry-run`) `lookup`
пуст, поэтому при каждом рендере генерируется новый токен — это ожидаемо и безопасно:
реальный токен фиксируется при `helm install`/`upgrade` в кластере.
*/ -}}
{{- if and .Values.installerKey.enabled (not .Values.installerKey.existingSecret) }}
{{- $name := .Values.installerKey.secretName }}
{{- $bootstrapKey := .Values.installerKey.bootstrapKey }}
{{- /* Переиспользуем существующий токен, чтобы `helm upgrade` не менял Secret. */ -}}
{{- $secret := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $raw := index ($existing.data | default (dict)) $bootstrapKey }}
{{- if $raw }}
{{- $parsed := $raw | b64dec | fromJsonArray }}
{{- if and (kindIs "slice" $parsed) (gt (len $parsed) 0) }}
{{- $first := index $parsed 0 }}
{{- if kindIs "map" $first }}
{{- $secret = get $first "secret" | default "" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $secret }}
{{- $secret = printf "synth_svc_%s" (randAlphaNum 43) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  {{ $bootstrapKey }}: |
    {{ list (dict "label" .Values.installerKey.label "secret" $secret "scopes" .Values.installerKey.scopes "roles" .Values.installerKey.roles) | toJson }}
{{- end }}
