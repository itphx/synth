apiVersion: v1
kind: Service
metadata:
  name: {{ include "synth.backend.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  {{- /* Sticky-сессии: шина событий in-process, поэтому при нескольких репликах
         control plane клиент и его WS-соединение должны попадать на один под.
         "None" — дефолт Kubernetes, поле не рендерим: дефолтный манифест
         Service не меняется побайтово. */ -}}
  {{- with .Values.backend.service.sessionAffinity }}
  {{- if ne . "None" }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- end }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "synth.backend.selectorLabels" . | nindent 4 }}
