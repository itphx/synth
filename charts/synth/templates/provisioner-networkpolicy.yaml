{{- /* PROP-135 Ф4b-2b: NetworkPolicy provisioner'а пулов (по флагу
       `provisioner.networkPolicy.enabled`).

       ingress — только от pod'ов control plane (backend) на порт provisioner'а.
       egress — DNS (kube-system) и, для kubernetes-провайдера, API кластера.
       Политика не умеет выбирать по DNS-имени: `https://kubernetes.default.svc`
       ей не выразить, поэтому адрес API задаётся CIDR'ами
       (`provisioner.networkPolicy.apiServerCidrs` — Service CIDR кластера или
       IP/host-CIDR API-сервера). Без CIDR'ов при `provider: kubernetes` рендер
       падает: иначе provisioner молча не смог бы создавать поды.

       Egress к самим пулам не нужен: адрес пода provisioner только возвращает,
       с исполнителем общается control plane. Ограничения на трафик пулов —
       `executor.networkPolicy` (политика выбирает поды по label
       `app.kubernetes.io/name=synth-executor`). */ -}}
{{- if and .Values.provisioner.enabled .Values.provisioner.networkPolicy.enabled }}
{{- $provider := include "synth.provisioner.provider" . }}
{{- $np := .Values.provisioner.networkPolicy }}
{{- if and (eq $provider "kubernetes") (not $np.apiServerCidrs) }}
{{- fail "provisioner.networkPolicy.enabled: true при provider: kubernetes требует provisioner.networkPolicy.apiServerCidrs (Service CIDR кластера или CIDR API-сервера) — иначе egress к API Kubernetes заблокирован и пулы не поднимутся. Задайте CIDR'ы, отключите networkPolicy либо вернитесь к provider: static" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "synth.provisioner.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
spec:
  podSelector:
    matchLabels:
      {{- include "synth.provisioner.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "synth.backend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.provisioner.service.targetPort }}
  egress:
    {{- /* DNS — без него не разрешается ни имя API-сервера, ни адреса пулов. */}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if eq $provider "kubernetes" }}
    {{- /* API Kubernetes (443): поды и секреты пулов. */}}
    - to:
        {{- range $np.apiServerCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
