apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synth.ui.fullname" . }}
  labels:
    {{- include "synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "synth.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synth.ui.selectorLabels" . | nindent 8 }}
      {{- /* Триггер раскатки: app-версия образа не меняется между сборками,
             меняется только номер сборки — без этой аннотации пересборка с тем
             же тегом не пересоздавала бы под. */}}
      annotations:
        synth.io/build: {{ .Chart.Version | quote }}
    spec:
      {{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "synth.ui.fullname" . }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.targetPort }}
              protocol: TCP
          {{- /* ADR-077: адрес backend'а для nginx — по умолчанию Service
                 backend'а этого же релиза, переопределяется через
                 `ui.extraEnv.SYNTH_BACKEND_URL`. */}}
          env:
            {{- include "synth.ui.env" . | trim | nindent 12 }}
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
