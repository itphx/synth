apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synth.name" . }}-env
  labels:
    {{- include "synth.labels" . | nindent 4 }}
data:
  # --- OIDC (Keycloak/иной IdP) — только при oidc.enabled ---
  {{- if .Values.backend.oidc.enabled }}
  SYNTH_OIDC_ENABLED: "true"
  SYNTH_OIDC_ISSUER: {{ .Values.backend.oidc.issuer | quote }}
  SYNTH_OIDC_CLIENT_ID: {{ .Values.backend.oidc.clientId | quote }}
  SYNTH_OIDC_REDIRECT_URI: {{ .Values.backend.oidc.redirectUri | quote }}
  {{- end }}
  # --- Провайдеры LLM: env SYNTH_PROVIDER_<NAME>_URL/TYPE/MODEL ---
  # Подхватываются syncProvidersFromEnv при старте и записываются в storage.
  {{- range .Values.backend.providers }}
  SYNTH_PROVIDER_{{ include "synth.envName" . }}_URL: {{ .url | quote }}
  SYNTH_PROVIDER_{{ include "synth.envName" . }}_TYPE: {{ .type | quote }}
  {{- if .model }}
  SYNTH_PROVIDER_{{ include "synth.envName" . }}_MODEL: {{ .model | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := .Values.backend.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- /* ADR-115: единый параметр деплоя — предел размера одного вложения.
         Задан в values → фиксируется env (runtime-настройка из UI его не
         переопределит). Ключ, заданный пользователем в backend.extraEnv,
         не дублируем. */}}
  {{- $extraEnv := .Values.backend.extraEnv | default dict }}
  {{- $attMax := (.Values.attachments | default dict).maxBytesPerFile }}
  {{- if and $attMax (not (hasKey $extraEnv "SYNTH_ATTACHMENTS_MAX_BYTES_PER_FILE")) }}
  SYNTH_ATTACHMENTS_MAX_BYTES_PER_FILE: {{ int64 $attMax | quote }}
  {{- end }}
  {{- /* Лимит `POST /api/v2/fs/upload` (storage.maxUploadBytes) — он же вход
         в вычисление транспортного лимита nginx/ingress. */}}
  {{- $fsMax := (.Values.storage | default dict).maxUploadBytes }}
  {{- if and $fsMax (not (hasKey $extraEnv "SYNTH_MAX_UPLOAD_BYTES")) }}
  SYNTH_MAX_UPLOAD_BYTES: {{ int64 $fsMax | quote }}
  {{- end }}
{{- if .Values.caCert }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synth.name" . }}-itphx-ca
  labels:
    {{- include "synth.labels" . | nindent 4 }}
data:
  itphx-ca.crt: |
    {{- .Values.caCert | nindent 4 }}
{{- end }}
