# --- Канонические значения чарта synth (backend + ui) ---
# Универсальные дефолты без привязки к конкретному окружению (self-host у заказчиков).
# Переопределяются при установке своим values-файлом или --set/--set-file.
# Инструкция, примеры окружения и плейсхолдеры (<...>) — в README.md чарта.

nameOverride: ""
fullnameOverride: ""

# ─────────────────────────────────────────────────────────────────────────────
# Backend — @itphx/synth-backend (API Hub: OIDC/RBAC, встроенный движок).
# Хранилище JSON-файлы → НЕ масштабируется, всегда 1 реплика.
# ─────────────────────────────────────────────────────────────────────────────
backend:
  nameOverride: ""
  fullnameOverride: ""
  replicaCount: 1

  # Restart из UI (обслуживание → «Перезапуск»): процесс завершается с кодом 75,
  # Deployment (restartPolicy: Always — дефолт K8s) поднимает pod заново.
  # `disabled` — кнопка в UI недоступна; `supervisor` — для внешнего супервизора.
  restartMode: process

  image:
    repository: gitverse.ru/itphx/synth-backend
    # Пустой tag → подставляется .Chart.AppVersion (см. templates/backend-deployment.yaml).
    tag: ""
    pullPolicy: IfNotPresent

  # Секреты для приватного реестра (kubernetes.io/dockerconfigjson).
  # По умолчанию пусто — публичные образы не требуют авторизации.
  imagePullSecrets: []

  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

    # Sticky-сессии: при backend.replicaCount > 1 клиент (браузер) и его
    # WS-соединение должны попадать на один под — шина событий in-process,
    # иначе события теряются между репликами. None (по умолчанию) — обычная
    # балансировка; ClientIP — привязка по IP клиента.
    sessionAffinity: None

  # Хранилище JSON-данных Synth (сессии, проекты, провайдеры, настройки).
  persistence:
    enabled: true
    size: 10Gi
    # "" = storageClass по умолчанию кластера; иначе имя класса,
    # например "local-path", "longhorn", "gp3".
    storageClass: ""
    accessMode: ReadWriteOnce
    existingClaim: ""
    # true → PVC не удаляется при `helm uninstall`: чарт добавляет в манифест
    # аннотацию helm.sh/resource-policy: keep. Удобно, когда данные нельзя терять.
    # (Ручной kubectl annotate живого PVC не работает — Helm смотрит манифест релиза.)
    keepOnUninstall: false

  # Блобы (ADR-116): вложения сообщений, артефакты, логи фоновых процессов и
  # содержимое instance-скиллов. По умолчанию лежат внутри тома данных
  # (`{dataDir}/blobs` на PVC backend.persistence) — один том на инстанс.
  # Блобами пользуются ВСЕ реплики backend'а, поэтому при replicaCount > 1 том с
  # ними обязан быть ReadWriteMany (рендер чарта падает с понятной ошибкой,
  # если это не так). Подробности — README чарта, «Блобы и несколько реплик».
  blobs:
    # false — блобы лежат внутри data (по умолчанию один том);
    # true — отдельный PVC, монтируется в <dataDir>/blobs.
    enabled: false
    size: 20Gi
    # "" = storageClass по умолчанию кластера; для нескольких реплик нужен
    # класс, поддерживающий ReadWriteMany (NFS/CephFS/…).
    storageClass: ""
    accessMode: ReadWriteMany
    # Существующий claim (тогда чарт PVC не создаёт и accessMode не проверяет).
    existingClaim: ""
    # true → PVC блобов не удаляется при `helm uninstall` (аннотация
    # helm.sh/resource-policy: keep в манифесте релиза) — как у persistence.
    keepOnUninstall: false

  # OIDC (Keycloak/иной IdP). issuer/client_id/redirect_uri → ConfigMap.
  # client_secret берётся из Secret secrets.existingSecret по ключу SYNTH_OIDC_CLIENT_SECRET.
  # Пример включения (плейсхолдеры <...> заменить):
  #   oidc:
  #     enabled: true
  #     issuer: "https://keycloak.example.com/realms/<realm>"
  #     clientId: "synth"
  #     redirectUri: "https://synth.example.com/auth/callback"
  oidc:
    enabled: false
    issuer: ""
    clientId: ""
    redirectUri: ""

  # API-key режим (без Keycloak/OIDC): ключ → env SYNTH_API_KEY (роль ADMIN).
  # Взаимоисключает с backend.oidc.enabled — при одновременном включении
  # рендер чарта падает с понятной ошибкой (режимы не смешиваются).
  # Ключ берётся ТОЛЬКО из Secret (secretKeyRef), в ConfigMap/values не попадает.
  # existingSecret пуст → secrets.existingSecret (по умолчанию `synth-secrets`).
  # Пример:
  #   kubectl create secret generic synth-secrets \
  #     --from-literal=SYNTH_API_KEY='<api-key>'
  #   helm install synth ./charts/synth -f charts/synth/examples/values-apikey.yaml
  auth:
    apiKey:
      enabled: false
      existingSecret: ""
      secretKey: "SYNTH_API_KEY"

  # Провайдеры LLM → env SYNTH_PROVIDER_<NAME>_URL/TYPE/MODEL (ConfigMap).
  # API-ключи — по имени SYNTH_PROVIDER_<NAME>_API_KEY из secrets.existingSecret.
  # apiKey: false — без ключа (env API_KEY не создаётся).
  # Формат (пример): [{name, type, url, model, apiKey}]
  providers: []

  # Ресурсы backend: значения ниже — рабочий дефолт; подберите под нагрузку окружения.
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

  probes:
    # ВНИМАНИЕ: probes проверяют только живость процесса backend (`/health`).
    # Доступность БД при `storage.backend: postgres` здесь НЕ проверяется:
    # readiness=false на недоступной БД выключал бы из балансировки и UI
    # (nginx проксирует /api на backend), а при `storage.degradedMode:
    # fallback-file` деградация — штатный сценарий, а не отказ.
    # DB-aware готовность подключайте внешним мониторингом (см. README чарта).
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10

  # Дедлайн прогресса rollout (Deployment.spec.progressDeadlineSeconds; дефолт
  # K8s — 600 с). Поднят: первый старт после смены `fsGroupChangePolicy`
  # (разовый chown корня тома) и медленный pull образа не должны ронять релиз —
  # иначе Deployment уходит в Failed, Helm-релиз — в `failed`, и Fleet ретраит
  # по кругу.
  progressDeadlineSeconds: 1200

  podSecurityContext:
    fsGroup: 1000
    # Менять владельца тома только если корень уже не той группы: NFS-том
    # workspace содержит десятки тысяч файлов (node_modules, рабочие каталоги),
    # рекурсивный chown на каждом старте держал под в ContainerCreating
    # 10–20 минут и ронял rollout по progressDeadlineSeconds.
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  # Read-only корневая ФС контейнера backend'а (PROP-137 Ф2).
  #
  # Верхний переключатель: `false` — корневая ФС доступна на запись (как в
  # 137a), `true` (по умолчанию) — только на чтение. При `true` чарт добавляет
  # writable-тома `emptyDir` на `/tmp` и `/home/synth` (кэши pnpm/pip/corepack,
  # `PYTHONUSERBASE`, временные каталоги) — без них старт падает (EACCES на
  # `HOME`/`/tmp`).
  #
  # Итоговое значение = ЭТОТ флаг И `containerSecurityContext.readOnlyRootFilesystem`
  # (по умолчанию тоже `true`): выключить read-only rootfs можно любым из них.
  readOnlyRootFilesystem: true

  # ───────────────────────────────────────────────────────────────────────────
  # Init-контейнер смены владельца томов (PROP-137 Ф2) — по умолчанию ВЫКЛЮЧЕН.
  #
  # Нужен там, где `podSecurityContext.fsGroup` не действует: hostPath/NFS
  # (владельца задаёт хост, kubelet его не меняет). Обычным PVC он не нужен
  # (`fsGroup: 1000` + `fsGroupChangePolicy: OnRootMismatch` — достаточно).
  #
  # ⚠️ Работает от root (`runAsUser: 0`) — это несовместимо с Pod Security
  # Standards `restricted` (там root-контейнер запрещён). Включайте осознанно.
  #
  # Контейнер монтирует те же тома, что и основной, и выполняет
  # `chown -R 1000:1000 <точка монтирования>`. На NFS-томе workspace это
  # долго (десятки тысяч файлов), поэтому процесс пода может стартовать
  # минутами.
  # ───────────────────────────────────────────────────────────────────────────
  ownershipInitContainer:
    enabled: false
    # Образ init-контейнера. Пусто → образ самого backend'а (в нём есть
    # `sh` и `chown` busybox). Свой образ нужен, если в вашем образе нет
    # этих утилит.
    image: ""
    imagePullPolicy: ""
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

  # Доп. env для backend (попадают в ConfigMap → env pod).
  # Если задан caCert, чарт сам добавляет NODE_EXTRA_CA_CERTS — вручную дублировать не нужно.
  extraEnv: {}

  # ───────────────────────────────────────────────────────────────────────────
  # Плагины (PROP-090). Управление — API /api/v2/plugins* и `synth plugin *`.
  #
  # deployDir — каталог с бандлами, поставленными образом/PVC: каждый
  # подкаталог = бандл (`synth.pack` + `dist/`). Backend ставит их при старте
  # (манифест → скан → trust-floor → install-policy), затем активирует из lock.
  # В образе `synth-backend` каталог `/opt/synth/plugins` уже есть и
  # `SYNTH_PLUGINS_DEPLOY_DIR` выставлен Dockerfile'ом; при сборке образа
  # бандлы кладут в `docker/plugins/` (см. docs/MAINTENANCE.md).
  #
  # deployVolume — монтирование каталога плагинов из PVC: плагины обновляются
  # без пересборки образа (нужен существующий claim — содержимое PVC Helm не
  # создаёт). readOnly по умолчанию true: backend читает бандлы, но не меняет.
  #
  # managedReadonly: management-плагин нельзя снять/переустановить через
  # API/CLI (403 plugin.managed_readonly) — он меняется только развёртыванием.
  #
  # deployTrust: уровень доверия deploy-бандлов (builtin|verified|trusted|
  # community). Ниже plugins.trustFloor инстанса — бандл не ставится
  # (plugin.trust_below_floor); сканирование содержимого выполняется всегда.
  # ───────────────────────────────────────────────────────────────────────────
  plugins:
    # Путь внутри контейнера. Пусто → deploy-плагинов нет (у образа дефолт
    # /opt/synth/plugins задан env, сюда его дублировать не нужно).
    deployDir: ""
    # Пусто → дефолт backend (`verified`).
    deployTrust: ""
    # true (дефолт backend) → management-плагины «неприкосновенны».
    managedReadonly: true
    deployVolume:
      enabled: false
      # Обязателен при enabled: true (PVC создаётся вне чарта).
      existingClaim: ""
      mountPath: /opt/synth/plugins
      readOnly: true

  # Декларативный config.yaml backend (ADR-023). Непустой объект →
  # ConfigMap <release>-config, монтируется в backend как /etc/synth/config.yaml
  # (штатный путь поиска config backend, SYSTEM_CONFIG_PATH).
  # Приоритет: CLI-флаги > SYNTH_* env > config.yaml > defaults; runtime-настройки
  # из UI/API (settings.json) применяются поверх файла.
  # Пример: { events: { autoBind: true } }.
  # Секция `storage` ниже домержится в этот же config.yaml (ADR-096).
  config: {}

# ─────────────────────────────────────────────────────────────────────────────
# Слой хранения (ADR-096/ADR-097) — instance-wide для backend.
# ─────────────────────────────────────────────────────────────────────────────
# Всё, кроме пароля, рендерится в config.yaml (ConfigMap <release>-config) и
# монтируется в backend как /etc/synth/config.yaml. Пароль БД в values НЕ
# хранится (инвариант 13): он читается в env SYNTH_POSTGRES_PASSWORD из Secret
# (postgres.existingSecret | secrets.existingSecret, ключ secretPasswordKey).
# Исключение — `maxUploadBytes`: он уходит в env (ConfigMap <release>-env), чтобы
# тем же значением управлялся транспортный лимит nginx UI-пода и ingress.
storage:
  # file (дефолт) | memory (данные НЕ сохраняются — тесты/эмуляция) | postgres.
  # Драйвер `@itphx/synth-storage-postgres` + `pg` входят в образ (optional
  # dependencies ядра) — при backend=postgres ничего доустанавливать не нужно.
  backend: file

  postgres:
    # Параметры подключения (не секреты). Полная строка подключения (`dsn`)
    # намеренно не поддержана: значение ушло бы в ConfigMap, а DSN обычно
    # содержит пароль. Нужен DSN — задайте его сами в backend.config (без
    # пароля) или отдельным env из вашего Secret.
    host: ""
    port: 5432
    database: ""
    user: ""
    # Схема БД (namespace таблиц); пусто → схема драйвера по умолчанию.
    schema: ""
    # Требовать TLS-соединение (sslmode=require).
    ssl: false
    # Максимальный размер пула соединений.
    poolMax: 10
    # Secret с паролем БД. Пусто → secrets.existingSecret (по умолчанию
    # `synth-secrets`). Ключ внутри Secret — secretPasswordKey.
    existingSecret: ""
    secretPasswordKey: SYNTH_POSTGRES_PASSWORD

  # Задел деградированного режима (реализация — параллельная волна): "" (не
  # задано) | fallback-file (перейти на файловое хранилище) | halt (не стартовать).
  degradedMode: ""
  # Каталог файлового фоллбека; пусто → {dataDir}/fallback (внутри PVC backend).
  fallbackDir: ""

  # Максимальный размер файла для POST /api/v2/fs/upload (байт).
  # Не задан (null) — дефолт приложения 100 МиБ. Учитывается в транспортном
  # лимите nginx/ingress вместе с attachments.maxBytesPerFile (см. ниже) —
  # понижение лимита вложений не должно ломать загрузку файлов в дереве.
  maxUploadBytes: null

# ─────────────────────────────────────────────────────────────────────────────
# Вложения (ADR-115) — единый параметр деплоя.
# ─────────────────────────────────────────────────────────────────────────────
attachments:
  # ADR-115: предел размера одного вложения (байт) — единый параметр деплоя.
  # Применяется к backend (`attachments.maxBytesPerFile`), nginx UI-пода и
  # ingress (с запасом на multipart). Не задан (null) — дефолт приложения
  # (100 МиБ) и runtime-настройка из админки; задан — фиксируется env и в UI
  # не переопределяется.
  maxBytesPerFile: null

# ─────────────────────────────────────────────────────────────────────────────
# Топология исполнения (ADR-077, шаг 7c) — split-режим «control plane +
# отдельные исполнители (executor/worker)».
#
# По умолчанию всё выключено: `execution.mode: inline` — команды агентских
# тулов исполняются в процессе backend'а (прежнее поведение). Включение
# split-режима:
#
#   execution:
#     mode: remote
#   executor:
#     enabled: true
#
# Переключатель — параметр запуска (инвариант 24): смена режима требует
# рестарта процесса (graceful shutdown, exit code 75), а не runtime-настройки.
#
# Секция `execution` попадает в backend ТОЛЬКО через env `SYNTH_EXECUTION_*`
# (config.yaml не трогается): токен остаётся путём к файлу, а не значением
# (инвариант 13).
# ─────────────────────────────────────────────────────────────────────────────
execution:
  # inline (дефолт) | remote. Неизвестное значение → понятная ошибка рендера.
  mode: inline
  remote:
    # Адреса исполнителей (список). Пусто + `executor.enabled: true` → чарт
    # подставит адрес Service пула (http://synth-executor:<port>): балансировку
    # по репликам делает Kubernetes. Пусто + `executor.enabled: false` → ошибка
    # рендера (fail-closed: без адреса удалённый режим не поднимется).
    url: []
    # Таймаут exec-вызова, мс (env backend'а SYNTH_EXECUTION_TIMEOUT_MS).
    timeoutMs: 30000
    # Лимит одновременных exec-вызовов на backend (env SYNTH_EXECUTION_CONCURRENCY).
    # 0 → env не выставляется: дефолт приложения — число CPU control plane.
    concurrency: 0
    # fail (дефолт, fail-closed) | inline-fallback (явная настройка: backend
    # исполняет команду сам — обход изоляции, в managed-контуре включать осознанно).
    failMode: fail
    # Каталог профилей инстанса (backend-каталог; `provisioner.profiles` —
    # фолбэк provisioner'а). Профиль: {image, url, network, resources,
    # runtimeClass, readOnlyRootFilesystem, env, annotations, labels,
    # nodeSelector, tolerations, affinity, mcpServers}.
    #
    # Рендерится в `config.yaml` backend'а (не в env) — отсюда работают
    # scheduling-поля (аннотации/метки/отбор нод/tolerations/affinity) и
    # произвольные ресурсы (`nvidia.com/gpu`). Пример (профиль на GPU-нодах):
    #   profiles:
    #     gpu:
    #       image: git.itphx.ru/itphx/synth-executor:0.13.8-full
    #       nodeSelector:
    #         nvidia.com/gpu.present: "true"
    #       tolerations:
    #         - key: nvidia.com/gpu
    #           operator: Exists
    #           effect: NoSchedule
    #       resources:
    #         requests: {cpu: "1", nvidia.com/gpu: "1"}
    #         limits: {nvidia.com/gpu: "1"}
    profiles: {}

# ─────────────────────────────────────────────────────────────────────────────
# Исполнитель (executor/worker) — пул контейнеров с toolchain'ом (ADR-077).
#
# Включается `executor.enabled: true` (вместе с `execution.mode: remote`).
# Требования к окружению:
#   - образ `synth-executor` (публикация образов — шаг 6 плана ADR-077);
#     для приватного реестра — `executor.imagePullSecrets`;
#   - RWX-том (NFS/CephFS/…) под общий workspace: том должен быть виден и
#     control plane, и всем репликам исполнителя. Если в кластере нет RWX-класса
#     — задайте свой claim (`executor.workspace.existingClaim`);
#   - Secret с токеном доверия `synth_exec_…` (см. `executor.token`).
# ─────────────────────────────────────────────────────────────────────────────
executor:
  enabled: false
  nameOverride: ""
  fullnameOverride: ""
  # Размер пула: столько реплик исполнителя (балансировка — через Service).
  replicaCount: 1

  image:
    repository: git.itphx.ru/itphx/synth-executor
    # Пустой tag → .Chart.AppVersion (как у backend'а/UI).
    tag: ""
    pullPolicy: IfNotPresent

  # Секреты для приватного реестра (kubernetes.io/dockerconfigjson).
  imagePullSecrets: []

  service:
    type: ClusterIP
    port: 5100
    targetPort: 5100

    # Привязка клиента к поду: None (по умолчанию) — обычная балансировка;
    # ClientIP — трафик control plane закрепляется за одним подом пула
    # (браузерные MCP-сессии живут внутри пода: без привязки последовательные
    # вызовы одной сессии попадают на разные поды).
    sessionAffinity: None

  # Ресурсы исполнителя: **рабочее место агента**. Значения по умолчанию
  # рассчитаны на сборку монорепо (`pnpm install`/`build`/`typecheck`) — она
  # идёт минутами и требует CPU и памяти; прежние дефолты (200m/256Mi) для
  # неё малы. Переопределяются своими значениями (`executor.resources.*`) —
  # например, для лёгких сценариев (только чтение/поиск по файлам).
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 1
      memory: 2Gi

  # Лимиты исполнителя (env SYNTH_EXECUTOR_MAX_*).
  limits:
    # Лимит одновременных команд в одном исполнителе.
    maxConcurrency: 4
    # Потолок таймаута команды, мс. Полная сборка Synth (pnpm build/typecheck)
    # идёт минутами — прежнего 120000 мс ей не хватало.
    maxTimeoutMs: 1800000
    # Потолок буфера вывода, байт. Лог vite/tsc большой — 32 МиБ вместо 10.
    maxOutputBytes: 33554432

  # Метрики исполнителя (ADR-077 шаг 7d; ADR-094) — **выключены по умолчанию**,
  # как `metrics.enabled` у control plane (ADR-094 п. 4).
  # true → env `SYNTH_EXECUTOR_METRICS_ENABLED=true`: у исполнителя появляется
  # собственный `GET /metrics` (вне префиксов, как у backend'а) — 404 при
  # выключенном, 401 без bearer-токена исполнителя, 200 с токеном
  # (exposition 0.0.4, `no-store`).
  # Скрейп пула — **отдельный job** Prometheus (не смешивать с job'ом
  # backend'а: `synth_executor_commands_total` есть на обеих сторонах и
  # считает разное). Примеры — README чарта, §«Метрики исполнителя».
  metrics:
    enabled: false

  # MCP-серверы, которые исполнитель хостит у себя (stdio, ADR-077 шаг B1).
  #
  # Элемент списка: { name, command, args, env }. Рендерится в env
  # `SYNTH_EXECUTOR_MCP_SERVERS` (JSON) — конфигурация исполнителя только через
  # env (config.yaml у воркера нет). `env` — секреты MCP-сервера: передавайте
  # их через `extraEnv`/Secret, а не в values (инвариант 13).
  #
  # По умолчанию — пусто: чарт ничего не навязывает и не зависит от flavor'а
  # образа. Образы flavor'ов `browser`/`full` уже несут дефолт с Playwright MCP
  # (см. `docker/Dockerfile.executor`); этот список **заменяет** его целиком.
  #
  # Рецепт Playwright (образ `full`; в контейнере нет дисплея и Google Chrome):
  #
  #   mcp:
  #     servers:
  #       - name: playwright-mcp
  #         command: playwright-mcp
  #         args:
  #           - --headless
  #           - --no-sandbox          # образ по умолчанию root; под uid 1000 безвреден
  #           - --executable-path
  #           - /opt/synth/browser/chrome   # стабильный симлинк tier 3
  #         env: {}
  mcp:
    # false → env SYNTH_EXECUTOR_MCP_SERVERS="" (MCP-серверов нет; отключает и
    # дефолт образа). true + пустой servers → env не выставляется (дефолт образа).
    enabled: true
    servers: []

  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10

  # Дедлайн прогресса rollout (Deployment.spec.progressDeadlineSeconds; дефолт
  # K8s — 600 с). Поднят: первый старт после смены `fsGroupChangePolicy`
  # (разовый chown корня NFS-тома workspace — десятки тысяч файлов) и медленный
  # pull образа не должны ронять релиз — иначе Deployment уходит в Failed,
  # Helm-релиз — в `failed`, и Fleet ретраит по кругу.
  progressDeadlineSeconds: 1200

  podSecurityContext:
    fsGroup: 1000
    # Менять владельца тома только если корень уже не той группы: NFS-том
    # workspace содержит десятки тысяч файлов (node_modules, рабочие каталоги),
    # рекурсивный chown на каждом старте держал под в ContainerCreating
    # 10–20 минут и ронял rollout по progressDeadlineSeconds.
    fsGroupChangePolicy: OnRootMismatch

  # Аннотации и метки пода исполнителя (`metadata.annotations`/`metadata.labels`
  # шаблона Deployment'а).
  #
  # Служебные значения **приоритетнее**: `synth.io/build` (версия чарта) и
  # `synth.io/network` (сетевой класс пула, ADR-137b-2) перетираются, если
  # совпадёт ключ. Остальные ключи уходят в под как есть — например, чтобы
  # внешний агрегатор (Prometheus/VictoriaMetrics/Admission webhook) отбирал
  # поды по своей метке.
  #
  # Пример (подписи для внешнего агрегатора):
  #   podAnnotations:
  #     prometheus.io/scrape: "false"
  #   podLabels:
  #     team: platform
  podAnnotations: {}
  podLabels: {}

  containerSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # Read-only корневая ФС контейнера исполнителя (PROP-137 Ф2).
  #
  # Верхний переключатель: `false` — корневая ФС доступна на запись (как в
  # 137a), `true` (по умолчанию) — только на чтение. При `true` чарт добавляет
  # writable-тома `emptyDir` на `/tmp` и `/home/synth` (кэши pnpm/pip/corepack,
  # `PYTHONUSERBASE`, временные каталоги SSH-материала и логи фоновых
  # процессов) — без них старт падает (EACCES на `HOME`/`/tmp`).
  #
  # Итоговое значение = ЭТОТ флаг И `containerSecurityContext.readOnlyRootFilesystem`
  # (по умолчанию тоже `true`): выключить read-only rootfs можно любым из них.
  readOnlyRootFilesystem: true

  # ───────────────────────────────────────────────────────────────────────────
  # Init-контейнер смены владельца томов (PROP-137 Ф2) — по умолчанию ВЫКЛЮЧЕН.
  #
  # Нужен там, где `podSecurityContext.fsGroup` не действует: hostPath/NFS
  # (владельца задаёт хост, kubelet его не меняет). Обычным PVC он не нужен
  # (`fsGroup: 1000` + `fsGroupChangePolicy: OnRootMismatch` — достаточно).
  #
  # ⚠️ Работает от root (`runAsUser: 0`) — это несовместимо с Pod Security
  # Standards `restricted` (там root-контейнер запрещён). Включайте осознанно.
  #
  # Контейнер монтирует общий том workspace и выполняет
  # `chown -R 1000:1000 <точка монтирования>`. На NFS это долго (десятки
  # тысяч файлов), поэтому процесс пода может стартовать минутами.
  # ───────────────────────────────────────────────────────────────────────────
  ownershipInitContainer:
    enabled: false
    # Образ init-контейнера. Пусто → образ самого исполнителя (в нём есть
    # `sh` и `chown` busybox). Свой образ нужен, если в вашем образе нет
    # этих утилит.
    image: ""
    imagePullPolicy: ""
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

  workspace:
    # Общий том workspace: control plane и все реплики исполнителя должны
    # видеть одни и те же файлы. true → чарт создаёт PVC (RWX) и монтирует его
    # в backend и в исполнитель по пути `mountPath`. Действует только при
    # `executor.enabled: true` (иначе чарт ничего не создаёт и не монтирует).
    enabled: true
    # Существующий claim (например, если в кластере нет RWX-класса). Пусто →
    # `claimName`, пусто → claim создаёт чарт.
    existingClaim: ""
    claimName: ""
    # Размер общего тома. Для тестовых стендов достаточно 5–10 ГБ: workspace —
    # это рабочие каталоги проектов, большие объёмы не нужны.
    size: 10Gi
    # Класс хранилища. Пусто → класс по умолчанию кластера.
    # ВАЖНО: класс должен поддерживать ReadWriteMany (RWX) — том общий для
    # backend'а и всех реплик исполнителя (NFS/CephFS-подобные классы;
    # `local-path`/ReadWriteOnce не подойдут). Пример из тестового окружения
    # (K3s): `nfs-rwx` (provisioner `nfs.csi.k8s.io`).
    # Дефолт намеренно пустой: чарт публикуемый — подставлять класс
    # конкретного окружения нельзя, у клиента без такого класса установка
    # сломается. Если в кластере нет RWX-класса — задайте свой существующий
    # claim (`existingClaim`) с accessMode: ReadWriteMany.
    storageClass: ""
    # RWX обязателен: том общий для backend и всех реплик исполнителя.
    # Если класс тома не поддерживает ReadWriteMany — задайте свой claim
    # (`existingClaim`) с нужным accessMode.
    accessMode: ReadWriteMany
    # true → PVC не удаляется при `helm uninstall`: чарт добавляет в манифест
    # аннотацию helm.sh/resource-policy: keep. Включайте, когда общий том
    # workspace нельзя терять: у класса с reclaimPolicy: Retain PV иначе
    # остаётся осиротевшим (вне релизов, без управления).
    # (Ручной kubectl annotate живого PVC не работает — Helm смотрит манифест релиза.)
    keepOnUninstall: false
    # Точка монтирования в обоих контейнерах (одинаковый путь внутри контейнера).
    mountPath: /var/synth/data/workspaces
    # Каталог workspace на стороне backend'а (storage.workspacesRoot → env
    # SYNTH_WORKSPACES_ROOT). Пусто → дефолт приложения ({dataDir}/workspaces) —
    # он совпадает с mountPath по умолчанию. Задайте, если mountPath отличается
    # от {dataDir}/workspaces: иначе backend создаст каталоги проектов вне общего
    # тома, и исполнитель их не увидит (containment → отказ EWORKSPACE).
    backendWorkspacesRoot: ""

  # Сетевой класс пула (PROP-137b-2) — подпись `synth.io/network` пода и
  # селектор NetworkPolicy класса.
  #
  # Для **статического** пула (Deployment исполнителя в чарте) класс задаётся
  # здесь. Для **динамических** пулов (provisioner, `provider: kubernetes`)
  # класс берётся из профиля provisioner'а (`provisioner.profiles[].network`;
  # если профиль класс не задал — `full`).
  #
  # none       — deny all egress (даже DNS), ingress только от control plane
  #              и provisioner'а;
  # restricted — egress: DNS (kube-system, 53/udp+tcp) + allowlist
  #              `networkClasses.restrictedEgress` (пусто → только DNS);
  # full       — egress не ограничивается.
  #
  # Неизвестное значение — **ошибка рендера** (fail-closed): под с «чужой»
  # подписью не попал бы ни в одну политику класса (то есть остался бы без
  # ограничений).
  networkClass: restricted

  # Сетевые классы пулов (PROP-137b-2) — NetworkPolicy на каждый класс.
  #
  # enabled: true → чарт рендерит три политики (`none`/`restricted`/`full`),
  # выбирающие поды по подписи `synth.io/network`. Старая
  # `executor.networkPolicy` при этом **не рендерится** (union правил ослабил
  # бы `none`/`restricted`).
  #
  # Ограничения: политики живут в namespace чарта (поды динамических пулов
  # provisioner'а создаются в том же namespace), CNI кластера должен
  # поддерживать NetworkPolicy.
  networkClasses:
    enabled: false
    # Allowlist egress для класса `restricted` — список правил
    # networking.k8s.io/v1 (как `networkPolicy.allowedEgress`). Пусто → у
    # `restricted` разрешён только DNS.
    # Пример (доступ к внешнему git-репозиторию):
    #   restrictedEgress:
    #     - to: [{ipBlock: {cidr: 203.0.113.0/24}}]
    #       ports: [{protocol: TCP, port: 443}]
    restrictedEgress: []

  networkPolicy:
    # NetworkPolicy для пула (ADR-077 «Изоляция, лимиты и квоты»).
    # false → объект не рендерится (сеть кластера как есть).
    #
    # ⚠️ Несовместимо с `networkClasses.enabled: true`: при включённых классах
    # эта политика НЕ рендерится (правила нескольких политик складываются
    # union'ом — её egress-правила ослабили бы `none`/`restricted`).
    enabled: false
    # Дополнительные egress-правила (формат networking.k8s.io/v1). По умолчанию
    # разрешён только DNS (namespace kube-system) — открытого egress в интернет
    # нет. Пример (доступ к внешнему git-репозиторию):
    #   allowedEgress:
    #     - to: [{ipBlock: {cidr: 203.0.113.0/24}}]
    #       ports: [{protocol: TCP, port: 443}]
    allowedEgress: []
    # Дополнительные ingress-правила (формат networking.k8s.io/v1) — например,
    # чтобы Prometheus из другого namespace скрейпил `/metrics` исполнителя.
    # По умолчанию пусто → поведение не меняется: ingress остаётся только от
    # pod'ов control plane. Правила добавляются **в дополнение** к штатному
    # правилу, а не заменяют его.
    # Пример:
    #   metricsIngress:
    #     - from:
    #         - namespaceSelector:
    #             matchLabels:
    #               kubernetes.io/metadata.name: monitoring
    #       ports:
    #         - protocol: TCP
    #           port: 5100
    metricsIngress: []

  token:
    # Secret с токеном доверия `synth_exec_…`. Пусто → secrets.existingSecret.
    # Значение токена в values НЕ хранится (инвариант 13) — только ссылка.
    existingSecret: ""
    # Ключ внутри Secret. Backend получает токен ФАЙЛОМ
    # (/etc/synth/executor/token → env SYNTH_EXECUTION_TOKEN=путь), исполнитель —
    # значением в env SYNTH_EXECUTOR_TOKEN (secretKeyRef). Один Secret на обе
    # стороны — токен совпадает.
    secretKey: SYNTH_EXECUTION_TOKEN

  tls:
    # Доверие git у исполнителя (ADR-077 «Обновлено 2026-10-26», (в); ADR-099):
    # CA — **конфигурация** исполнителя, а не пользовательский секрет.
    # Пусто (дефолт) → CA не задан: git доверяет системному корню, том
    # не монтируется, env SYNTH_EXECUTOR_TLS_CA_FILE не выставляется.
    #
    # Задан caSecret → Secret монтируется в /etc/synth/tls (readOnly), а
    # исполнитель получает путь к файлу CA через env
    # SYNTH_EXECUTOR_TLS_CA_FILE и добавляет его в окружение вызова
    # (GIT_CONFIG_COUNT/GIT_CONFIG_KEY_0/GIT_CONFIG_VALUE_0 → http.sslCAInfo).
    # Задан, но файл не читается — исполнитель НЕ СТАРТУЕТ (fail-closed).
    caSecret: ""
    # Ключ внутри caSecret (имя файла CA в Secret).
    caKey: ca.pem

  # Внешний чекер команд (PROP-136b): проверка `allow`/`deny` на исполнителе
  # **до** `spawn` (docs/EXECUTION.md §9.2). Выключено по умолчанию — env
  # `SYNTH_EXECUTOR_COMMAND_POLICY_*` не рендерится, поведение прежнее.
  #
  # ⚠️ Включённый чекер без `url` — ошибка рендера: исполнитель без адреса
  # чекера не стартует (fail-closed). `failMode: closed` (managed) — при
  # недоступности чекера команды запрещаются; `open` — разрешаются с warning.
  # Токен — только Secret (`token.existingSecret`, инвариант 13), монтируется
  # файлом readOnly в `token.mountPath`; значение в values не хранится.
  commandPolicy:
    enabled: false
    # http (POST {url}/v1/check) | opa (POST {url}{opaPath}).
    provider: http
    # Адрес чекера (обязателен при enabled: true).
    url: ""
    # closed | open — поведение при недоступном чекере.
    failMode: closed
    # Таймаут запроса к чекеру, мс.
    timeoutMs: 2000
    # TTL кэша вердиктов, мс (0 — без кэша).
    cacheTtlMs: 60000
    # Путь OPA-решения (provider: opa).
    opaPath: /v1/data/synth/exec/decision
    token:
      # Secret с bearer-токеном чекера. Пусто → авторизация не нужна.
      existingSecret: ""
      # Ключ внутри Secret.
      key: token
      # Путь файла токена внутри контейнера (env
      # SYNTH_EXECUTOR_COMMAND_POLICY_TOKEN_FILE).
      mountPath: /etc/synth/command-policy/token

# ─────────────────────────────────────────────────────────────────────────────
# Provisioner пулов исполнения (PROP-135 Ф4b-2b).
#
# Отдельный процесс `@itphx/synth-provisioner`: по запросу control plane
# (`POST /v1/pools`) выдаёт адрес и токен пула. Провайдеры:
#   * `static`     — адреса из конфигурации (`profiles[].url`/`staticPools`),
#                    изоляции пулов нет (поведение static-пулов core);
#   * `kubernetes` — под с образом профиля + Secret с токеном пула в namespace
#                    релиза (нужны RBAC и PVC workspace — см. ниже).
#
# Включается `provisioner.enabled: true` ВМЕСТЕ с `execution.mode: remote`
# (иначе backend продолжит работать по `execution.*`, а provisioner останется
# неиспользованным). Backend получает env `SYNTH_EXECUTION_PROVIDER=http`,
# адрес Service provisioner'а и ПУТЬ к файлу токена (значение — только в Secret,
# инвариант 13).
#
# ⚠️ `storage.workspaceOutsideRoot` в managed-контуре — `deny`: поды пулов
# монтируют PVC workspace с `subPath` = каталог проекта; каталог обязан лежать
# внутри `workspacesRoot` (`executor.workspace.mountPath`), иначе проектные
# workspace'ы не создадутся (см. README чарта, §«Provisioner пулов»).
# ─────────────────────────────────────────────────────────────────────────────
provisioner:
  enabled: false
  nameOverride: ""
  fullnameOverride: ""
  # Реплик — 1: состояние пулов выводится из labels подов/секретов (adopt после
  # рестарта), но одновременная выдача одним ключом из двух реплик не
  # сериализуется. Масштабирование — после появления общей блокировки.
  replicaCount: 1

  image:
    repository: git.itphx.ru/itphx/synth-provisioner
    # Пустой tag → .Chart.AppVersion (как у backend'а/UI/executor).
    tag: ""
    pullPolicy: IfNotPresent

  # Секреты для приватного реестра (kubernetes.io/dockerconfigjson).
  imagePullSecrets: []

  # ServiceAccount provisioner'а. Отличается от `kubernetes.serviceAccount`
  # (это ServiceAccount ПОДОВ пулов, без прав на API): provisioner'у нужен
  # доступ к API — Role в namespace релиза выдаёт `provisioner-rbac.yaml`.
  serviceAccount:
    # false — использовать существующий ServiceAccount (`name`).
    create: true
    # Пусто → `<fullname>` (по умолчанию `synth-provisioner`).
    name: ""

  service:
    type: ClusterIP
    port: 5200
    targetPort: 5200

  token:
    # Secret с токеном control plane. Пусто → secrets.existingSecret.
    # Значение токена в values НЕ хранится (инвариант 13) — только ссылка.
    # Backend получает токен ФАЙЛОМ (/etc/synth/provisioner-token/token →
    # env SYNTH_EXECUTION_PROVISIONER_TOKEN=путь), provisioner — значением в env
    # SYNTH_PROVISIONER_TOKEN (secretKeyRef). Один Secret на обе стороны.
    existingSecret: ""
    secretKey: SYNTH_PROVISIONER_TOKEN

  # static | kubernetes (неизвестное значение → ошибка рендера, fail-closed).
  # ⚠️ static без `profiles`/`staticPools` и kubernetes без `profiles` — процесс
  # не стартует (fail-closed): чарт дефолтных профилей не подставляет.
  provider: static

  # Каталог профилей исполнения: имя → {image, url, network, resources,
  # runtimeClass, readOnlyRootFilesystem, env, annotations, labels,
  # nodeSelector, tolerations, affinity, mcpServers}. JSON уходит в env
  # SYNTH_PROVISIONER_PROFILES.
  #   static:     профилю обязателен url (адрес исполнителя);
  #   kubernetes: профилю обязателен image (образ пода пула).
  # Scheduling-поля профиля (аннотации/метки/отбор нод/tolerations/affinity)
  # уходят в pod spec пула; служебные метки/аннотации provisioner'а
  # (`synth.io/*`) приоритетнее. `resources` — произвольный список ключей
  # (например, `nvidia.com/gpu: "1"`).
  # Пример (профиль на GPU-нодах):
  #   profiles:
  #     default:
  #       image: git.itphx.ru/itphx/synth-executor:0.13.8-core
  #       resources:
  #         requests: {cpu: 500m, memory: 1Gi}
  #         limits: {cpu: 2, memory: 4Gi}
  #     gpu:
  #       image: git.itphx.ru/itphx/synth-executor:0.13.8-full
  #       nodeSelector:
  #         nvidia.com/gpu.present: "true"
  #       tolerations:
  #         - key: nvidia.com/gpu
  #           operator: Exists
  #           effect: NoSchedule
  #       resources:
  #         requests: {cpu: "1", nvidia.com/gpu: "1"}
  #         limits: {nvidia.com/gpu: "1"}
  profiles: {}

  # Точные пулы (static): канонический ключ пула → адрес исполнителя.
  # Ключ должен совпадать с тем, что строит control plane
  # (`instance:exec:default`, `project:<id>:exec:default`, …).
  staticPools: {}

  # Kubernetes-провайдер (действует при provider: kubernetes).
  kubernetes:
    # PVC с рабочими каталогами проектов — **обязателен**. Под пула монтирует
    # его с `subPath` = каталог проекта (PROP-135, `workspaceSubPath`).
    # Должен совпадать с общим томом control plane (`executor.workspace.*`).
    workspacePvc: ""
    # Точка монтирования PVC внутри пода пула.
    workspaceMount: /var/synth/data/workspaces
    # ServiceAccount подов пулов (без прав на API; пусто — дефолтный SA).
    serviceAccount: ""
    # imagePullSecret'и подов пулов (имена в namespace релиза).
    imagePullSecrets: []
    # Адрес API Kubernetes (для in-cluster — дефолт).
    apiServer: https://kubernetes.default.svc
    # Ожидание Running/Ready пода пула и период опроса.
    startTimeoutMs: 120000
    pollIntervalMs: 1000
    # Порт исполнителя в поде пула.
    executorPort: 5100
    # Grace-период удаления пода пула, с.
    terminationGraceSeconds: 30
    # fsGroup подов пулов (дополнительная группа; kubelet приводит владельца
    # смонтированного тома). `null` — **не** выставлять в pod spec: на NFS
    # (например, общий `nfs-rwx` workspace) kubelet иначе рекурсивно меняет
    # владельца всех файлов тома при старте пода
    # (`VolumePermissionChangeInProgress`, 10–20 мин) — под пула не стартует.
    # `null` безопасен: `runAsUser`/`runAsGroup` 1000 и readOnlyRootFilesystem
    # сохраняются. На test стоит `null` (так же, как `podSecurityContext.fsGroup`
    # у backend/executor). Число — своё значение; `null` (и просто отсутствие
    # ключа — Helm удаляет null-ключи при coalesce) → env
    # SYNTH_PROVISIONER_KUBERNETES_FS_GROUP="none".
    fsGroup: 1000

  # Внешний чекер команд в подах динамических пулов (PROP-136b-2b): env
  # `SYNTH_EXECUTOR_COMMAND_POLICY_*` добавляется в pod spec, политика
  # применяется исполнителем до `spawn` (docs/EXECUTION.md §9.2).
  # Действует только при `provider: kubernetes` (static-пул provisioner не
  # создаёт: внешний исполнитель настраивается сам).
  #
  # Токен — из Secret: значение попадает в env provisioner'а
  # (`SYNTH_PROVISIONER_EXECUTOR_COMMAND_POLICY_TOKEN`) и дальше в Secret пула,
  # из которого монтируется файлом в под; в values значения нет (инвариант 13).
  executorCommandPolicy:
    enabled: false
    # http | opa.
    provider: http
    # Адрес чекера (обязателен при enabled: true — иначе рендер падает).
    url: ""
    # closed | open.
    failMode: closed
    timeoutMs: 2000
    cacheTtlMs: 60000
    opaPath: /v1/data/synth/exec/decision
    token:
      # Secret с bearer-токеном чекера (пусто — без авторизации).
      existingSecret: ""
      key: token

  # Жизненный цикл пулов (env SYNTH_PROVISIONER_*_TIMEOUT_MS/_MAX_POOLS).
  # Idle-таймаут проектного/инстансного пула — 15 мин.
  idleTimeoutMs: 900000
  # Idle-таймаут сессионного пула — 5 мин.
  sessionIdleTimeoutMs: 300000
  # Предельное время жизни пула — 12 ч.
  maxLifetimeMs: 43200000
  # Пауза между drain и release.
  drainGraceMs: 30000
  # Лимит живых пулов (сверх — 429 от provisioner'а).
  maxPools: 50
  # Период уборщика простаивающих пулов.
  reaperIntervalMs: 30000

  # Таймаут обращения backend'а к provisioner'у, мс (env
  # SYNTH_EXECUTION_PROVISIONER_TIMEOUT_MS; отдельно от таймаута exec-вызова).
  timeoutMs: 10000

  # Provisioner — лёгкий процесс: пулы он не исполняет, только создаёт объекты.
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Изоляция процесса (PROP-137): non-root uid 1000, без capabilities,
  # корневая ФС только на чтение (provisioner ничего не пишет на диск).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Read-only корневая ФС контейнера provisioner'а (PROP-137 Ф2).
  #
  # Верхний переключатель: `false` — корневая ФС доступна на запись,
  # `true` (по умолчанию) — только на чтение. При `true` чарт добавляет
  # writable-том `emptyDir` на `/tmp` (provisioner ничего не пишет на диск, но
  # `/tmp` остаётся единственным местом для временных файлов рантайма).
  #
  # Итоговое значение = ЭТОТ флаг И `containerSecurityContext.readOnlyRootFilesystem`
  # (по умолчанию тоже `true`): выключить read-only rootfs можно любым из них.
  readOnlyRootFilesystem: true

  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 30
    readiness:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 10

  nodeSelector: {}
  tolerations: []
  affinity: {}

  networkPolicy:
    # NetworkPolicy provisioner'а: ingress — только от backend-подов, egress —
    # DNS (+ API Kubernetes при provider: kubernetes).
    # ⚠️ Для provider: kubernetes политика требует `apiServerCidrs`: выбрать
    # API по DNS-имени NetworkPolicy не умеет, без CIDR'ов рендер падает.
    enabled: false
    # CIDR'ы API-сервера (Service CIDR кластера или IP/host-CIDR API), порт 443.
    apiServerCidrs: []

# ─────────────────────────────────────────────────────────────────────────────
# Доверие TLS/CA исходящих соединений Synth (ADR-099, конфиг `security.tls`).
# Пусто (дефолт) → системное доверие Node; манифесты не меняются.
#
# Пароли/ключи в ConfigMap НЕ кладутся (инвариант 13) — в config.yaml попадают
# ТОЛЬКО пути внутри контейнера. Сами файлы — в Secret (`existingSecret`),
# который монтируется в backend как /etc/synth/tls (readOnly; режим 0440 при
# заданном backend.podSecurityContext.fsGroup, иначе 0444).
#
# Пример: корпоративный CA и клиентский сертификат (mTLS) в Secret `corp-tls`:
#   security:
#     tls:
#       existingSecret: corp-tls   # ключи внутри Secret
#       caKey: ca.crt
#       certKey: client.crt
#       keyKey: client.key
#       rejectUnauthorized: "true" # "" = дефолт (true)
# → config.yaml: security.tls.{caFile,certFile,keyFile} = /etc/synth/tls/<key>
#
# Файлы уже смонтированы вами (свой Secret/volume)? Задайте пути напрямую
# (caFile/certFile/keyFile) — чарт тогда ничего не монтирует, только рендерит
# секцию в config.yaml. Для git-канала (`-c http.sslCAInfo`) нужен именно
# `caFile` (путь): `caPem` без файла git не поддерживает.
# ─────────────────────────────────────────────────────────────────────────────
security:
  tls:
    # Secret с CA/клиентскими сертификатами → mount в /etc/synth/tls (readOnly;
    # 0440 при заданном backend.podSecurityContext.fsGroup — групповое чтение;
    # иначе 0444: владелец файлов — root, группового доступа нет, поэтому
    # читать может только «остальные» (world-readable; совместимость при
    # `fsGroup: null`, см. README §«Права файлов в Secret-томах»)).
    # Пусто → ничего не монтируется.
    existingSecret: ""
    # Ключи внутри existingSecret; пусто → путь не рендерится.
    caKey: ""
    certKey: ""
    keyKey: ""
    # Явные пути внутри контейнера (когда файлы смонтированы вами).
    caFile: ""
    certFile: ""
    keyFile: ""
    # "" (дефолт true) | "true" | "false" → security.tls.rejectUnauthorized.
    rejectUnauthorized: ""

# ─────────────────────────────────────────────────────────────────────────────
# Наблюдаемость (ADR-094): GET /metrics, ServiceMonitor, дашборды Grafana, алерты.
#
# Метрики по умолчанию ВЫКЛЮЧЕНЫ (ADR-094 п. 4): эндпоинт появляется только при
# `metrics.enabled: true`. Скрейп настраивается одним из способов (можно
# несколько): vanilla Prometheus по аннотациям prometheus.io/*, Prometheus
# Operator через ServiceMonitor (CRD monitoring.coreos.com/v1 — не обязательны)
# или отдельный Ingress для внешнего Prometheus (metrics.ingress).
#
# Порядок включения:
#   1) metrics.enabled: true                        → env SYNTH_METRICS_ENABLED=true;
#   2) metrics.prometheus.annotations: true         → аннотации prometheus.io/* на pod;
#      ИЛИ metrics.serviceMonitor.enabled: true     → объект ServiceMonitor;
#      ИЛИ metrics.ingress.enabled: true            → Ingress на backend (внешний Prometheus);
#   3) grafana.dashboards.enabled: true             → ConfigMap с дашбордами (sidecar);
#   4) alerts.enabled: true                         → PrometheusRule с правилами.
# Подробности и примеры — README.md чарта, раздел «Наблюдаемость».
# ─────────────────────────────────────────────────────────────────────────────
metrics:
  # true → env SYNTH_METRICS_ENABLED=true у backend (GET /metrics на порту
  # backend.service.targetPort). Включение без скрейпа безопасно: эндпоинт
  # просто никто не читает.
  enabled: false

  # Опциональный bearer-токен /metrics (ADR-094 п. 4).
  # Пусто → /metrics отдаётся без авторизации (штатно в кластере: доступ
  # ограничен сетью pod'а/Ingress-политикой). Задан existingSecret →
  # env SYNTH_METRICS_TOKEN из secretKeyRef (optional — см. tokenOptional).
  # ВНИМАНИЕ: при включённом токене ServiceMonitor нужно передать его в
  # metrics.serviceMonitor.bearerTokenSecret, иначе скрейп получит 401.
  existingSecret: ""
  tokenKey: SYNTH_METRICS_TOKEN
  # optional у secretKeyRef токена:
  #   true  — отсутствие ключа в Secret не блокирует старт pod'а;
  #   false — pod ждёт появления Secret/ключа (для внешнего Ingress с
  #           токеном рекомендуется false).
  tokenOptional: true

  # Отдельный Ingress для внешнего Prometheus (templates/metrics-ingress.yaml).
  # Ведёт напрямую на backend Service — UI-nginx /metrics не проксирует.
  # Включать только вместе с metrics.enabled (иначе fail: эндпоинта нет).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # [{host: metrics.example.com, paths: [{path: /metrics, pathType: Prefix}]}]
    hosts: []
    tls: []

  prometheus:
    # Vanilla Prometheus (без CRD): аннотации на pod template:
    #   prometheus.io/scrape: "true"
    #   prometheus.io/port:   "<backend.service.targetPort>"
    #   prometheus.io/path:   "/metrics"
    # Включайте вместе с metrics.enabled: аннотации на выключенном эндпоинте
    # дают ложный up==0 (404) и ложные алерты.
    annotations: false

  serviceMonitor:
    # Prometheus Operator: объект ServiceMonitor (templates/servicemonitor.yaml).
    # Требует установленных CRD — без них рендер/установка упадут.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Доп. labels ServiceMonitor. Обычно нужен label селектора вашего
    # Prometheus, например `release: kube-prometheus-stack`.
    labels: {}
    # namespaceSelector ServiceMonitor. Пусто → namespace релиза (оператор
    # по умолчанию ищет ServiceMonitor в своём namespace).
    # ServiceMonitor рядом с Prometheus в другом namespace:
    #   namespaceSelector:
    #     matchNames: [monitoring]
    namespaceSelector: {}
    # Bearer-токен скрейпа (тот же Secret/ключ, что metrics.existingSecret).
    # Пусто → блок authorization не рендерится.
    bearerTokenSecret:
      name: ""
      key: ""

# Grafana: дашборды из charts/synth/files/dashboards/*.json → ConfigMap с
# label grafana_dashboard=<label>. Подхватывается sidecar'ом Grafana
# (kube-prometheus-stack, grafana chart с sidecar.dashboards.enabled=true).
grafana:
  dashboards:
    enabled: false
    # Значение label grafana_dashboard (sidecar ищет "1" по умолчанию).
    label: "1"
    # Значение аннотации grafana_folder (папка в Grafana); пусто → не рендерится.
    folder: ""
    # Доп. labels ConfigMap (например release: kube-prometheus-stack).
    labels: {}

# Prometheus-правила алертов (PrometheusRule, templates/prometheusrule.yaml).
# Сами правила — files/alerts/synth-rules.yaml в формате plain YAML (groups),
# тот же файл можно подключить к vanilla Prometheus через rule_files.
alerts:
  enabled: false
  # Доп. labels PrometheusRule — нужны, чтобы Prometheus оператора выбрал
  # правила (например release: kube-prometheus-stack).
  labels: {}
  # Доп. аннотации PrometheusRule (например runbook_url кластера).
  annotations: {}

# ─────────────────────────────────────────────────────────────────────────────
# UI — @itphx/synth-ui (React SPA) под nginx, проксирует /api /ws /auth /admin на backend.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  nameOverride: ""
  fullnameOverride: ""
  replicaCount: 1

  image:
    repository: gitverse.ru/itphx/synth-ui
    # Пустой tag → подставляется .Chart.AppVersion (см. templates/ui-deployment.yaml).
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # Доп. env для контейнера UI (словарь имя → значение).
  #
  # ADR-077: адрес backend'а, на который nginx (UI) проксирует /api /ws /auth
  # /admin /health, задаётся переменной `SYNTH_BACKEND_URL`. По умолчанию
  # чарт подставляет Service backend'а ТЕКУЩЕГО релиза
  # (`http://<имя Service>:5000`) — это важно для второго инстанса Synth в одном
  # namespace: с жёстко зашитым адресом UI молча проксировал бы на backend
  # основного инстанса (и OIDC-редирект уходил на чужой хост).
  #
  # Переопределение (значение целиком, с портом):
  #   ui:
  #     extraEnv:
  #       SYNTH_BACKEND_URL: "http://other-backend:5000"
  #
  # Оговорка: имя Service backend'а — `backend.nameOverride` /
  # `backend.fullnameOverride` (по умолчанию `synth-backend`); корневой
  # `nameOverride` на имя Service не влияет (он меняет только labels).
  extraEnv: {}

  # Необязательный override транспортного лимита: `client_max_body_size` nginx
  # UI-пода и аннотация `proxy-body-size` nginx-ingress. По умолчанию пусто —
  # значение вычисляется из `attachments.maxBytesPerFile` и
  # `storage.maxUploadBytes` (max(…, 100 МиБ) + запас 1 МиБ, см.
  # «Лимит загрузки файлов (вложения)»). Задавайте, только если нужен явный
  # потолок (например, свой прокси перед кластером); значение применяется при
  # рестарте/передеплое UI.
  clientMaxBodySize: ""

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

    # Привязка клиента к UI-поду: None (по умолчанию) — обычная балансировка;
    # ClientIP — клиент закрепляется за одним UI-подом, а значит и за одним
    # backend-подом (шина событий in-process: без стабильной цепочки события
    # хода теряются между репликами control plane).
    sessionAffinity: None

  # Ресурсы UI (nginx): дефолт для типовой нагрузки; переопределяется по окружению.
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  podSecurityContext:
    # UI — образ `nginxinc/nginx-unprivileged:alpine` (PROP-137 Ф3): процесс
    # уже работает от uid 101 (nginx), root не нужен.
    fsGroup: 101
  containerSecurityContext:
    # ⚠️ Read-only rootfs у UI НЕ включается: entrypoint официального образа
    # nginx генерирует конфиг из шаблонов (`/etc/nginx/templates/*.template` →
    # `/etc/nginx/conf.d/`) и пишет его в `/etc/nginx/conf.d` при старте — на
    # read-only корневой ФС это невозможно (nginx не поднимется). Поэтому UI
    # остаётся с записываемой корневой ФС, а изоляция обеспечивается
    # non-root (uid 101) и `drop: ALL` для capability.
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false

# ─────────────────────────────────────────────────────────────────────────────
# Ingress — трафик на UI (nginx проксирует /api /ws /auth /admin /health на backend).
# По умолчанию выключен (self-host может использовать свой балансировщик/Ingress).
# ─────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  # Ingress-контроллер: nginx | traefik | none.
  #   nginx   — HTTP→HTTPS через аннотацию nginx.ingress.kubernetes.io/ssl-redirect
  #             (при redirectHttpToHttps); TLS терминируется на nginx-контроллере.
  #   traefik — HTTP→HTTPS через CRD Middleware + IngressRoute (templates/traefik-redirect.yaml)
  #             плюс аннотация entrypoints; TLS терминируется на Traefik.
  #   none    — чарт не добавляет ни аннотаций контроллера, ни CRD
  #             (контроллер и редирект настраиваются вне чарта).
  controller: nginx
  # IngressClass: "" = класс по умолчанию кластера; обычно "nginx" или "traefik".
  className: ""
  # Произвольные аннотации Ingress (мержатся с авто-аннотациями контроллера,
  # заданные здесь значения приоритетнее). Пример для cert-manager:
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
  # Только для controller: traefik. Аннотация
  # traefik.ingress.kubernetes.io/router.entrypoints добавляется, если значение не пустое.
  entrypoints: ""
  # HTTP→HTTPS-редирект:
  #   nginx   — аннотация ssl-redirect (нужен настроенный TLS, см. tls ниже);
  #   traefik — Middleware redirect-to-https + IngressRoute (web) → 301 на https;
  #   none    — игнорируется.
  redirectHttpToHttps: true
  # Формат: [{host, paths: [{path, pathType}]}] — сейчас рендерится только host.
  hosts: []
  tls: []

# Имя существующего Secret с ключами:
#   SYNTH_OIDC_CLIENT_SECRET, SYNTH_PROVIDER_<NAME>_API_KEY (при необходимости).
# Чарт НЕ создаёт Secret — предполагается, что он уже есть в namespace релиза
# (или создаётся отдельно: External Secrets, sealed-secrets, ручной kubectl create).
secrets:
  existingSecret: synth-secrets

# Installer service-key (ADR-052): создаётся при развёртывании Synth и используется
# аддонами для самоустановки своих ресурсов (MCP-серверы, скиллы) по scope addons:install.
# Провижининг идемпотентен при старте backend (security.bootstrapServiceKeys) — ключ
# создаётся/синхронизируется по `label`, повторный `helm upgrade` секрет не меняет.
installerKey:
  enabled: false
  label: addon-installer
  # Установщику нужны оба scope: addons:install — MCP-реестр и скиллы,
  # automation:install — установка пакетов расширений (роли, пайплайны).
  scopes: ["addons:install", "automation:install"]
  roles: []                 # доступ дают scopes; роль повышать не нужно
  # Secret: если existingSecret пуст — чарт создаёт Secret со сгенерированным токеном
  # (стабильным между `helm upgrade`); иначе используется существующий Secret,
  # в котором по ключу `bootstrapKey` лежит готовый JSON для SYNTH_BOOTSTRAP_SERVICE_KEYS,
  # а по ключу `tokenKey` — тот же токен в plaintext (для аддонов).
  secretName: synth-installer-key
  existingSecret: ""
  bootstrapKey: bootstrap.json
  # Ключ с «сырым» plaintext-токеном (`synth_svc_…`) в том же Secret — для аддонов
  # (hook-Job авто-установки): secretKeyRef {name: <secret>, key: token}.
  tokenKey: "token"

# CA внутренней инфраструктуры (PEM, опционально).
# Пусто по умолчанию. Если задан непустым:
#   - создаётся ConfigMap <release>-itphx-ca;
#   - в backend-под монтируется /etc/ssl/certs/itphx-ca.crt;
#   - автоматически добавляется env NODE_EXTRA_CA_CERTS.
# Удобно передавать файлом, не встраивая PEM в values:
#   helm install synth ./charts/synth --set-file caCert=./my-ca.crt -f my-values.yaml
caCert: ""

# ─────────────────────────────────────────────────────────────────────────────
# Произвольные дополнительные манифесты (опционально).
# Список Kubernetes-манифестов, рендерятся как есть (любой kind: ConfigMap,
# Secret, CR кластера). Namespace указывать не обязательно — подставится
# namespace релиза.
# Пример: [{ apiVersion: v1, kind: ConfigMap, metadata: { name: extra }, data: {} }]
extraObjects: []
