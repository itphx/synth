# --- Канонические значения чарта synth (backend + ui) ---
# Универсальные дефолты без привязки к конкретному окружению (self-host у заказчиков).
# Переопределяются при установке своим values-файлом или --set/--set-file.
# Инструкция, примеры окружения и плейсхолдеры (<...>) — в README.md чарта.

nameOverride: ""
fullnameOverride: ""

# ─────────────────────────────────────────────────────────────────────────────
# Backend — @itphx/synth-backend (API Hub: OIDC/RBAC, встроенный движок).
# Хранилище JSON-файлы → НЕ масштабируется, всегда 1 реплика.
# ─────────────────────────────────────────────────────────────────────────────
backend:
  nameOverride: ""
  fullnameOverride: ""
  replicaCount: 1

  # Restart из UI (обслуживание → «Перезапуск»): процесс завершается с кодом 75,
  # Deployment (restartPolicy: Always — дефолт K8s) поднимает pod заново.
  # `disabled` — кнопка в UI недоступна; `supervisor` — для внешнего супервизора.
  restartMode: process

  image:
    repository: gitverse.ru/itphx/synth-backend
    # Пустой tag → подставляется .Chart.AppVersion (см. templates/backend-deployment.yaml).
    tag: ""
    pullPolicy: IfNotPresent

  # Секреты для приватного реестра (kubernetes.io/dockerconfigjson).
  # По умолчанию пусто — публичные образы не требуют авторизации.
  imagePullSecrets: []

  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

    # Sticky-сессии: при backend.replicaCount > 1 клиент (браузер) и его
    # WS-соединение должны попадать на один под — шина событий in-process,
    # иначе события теряются между репликами. None (по умолчанию) — обычная
    # балансировка; ClientIP — привязка по IP клиента.
    sessionAffinity: None

  # Хранилище JSON-данных Synth (сессии, проекты, провайдеры, настройки).
  persistence:
    enabled: true
    size: 10Gi
    # "" = storageClass по умолчанию кластера; иначе имя класса,
    # например "local-path", "longhorn", "gp3".
    storageClass: ""
    accessMode: ReadWriteOnce
    existingClaim: ""
    # true → PVC не удаляется при `helm uninstall`: чарт добавляет в манифест
    # аннотацию helm.sh/resource-policy: keep. Удобно, когда данные нельзя терять.
    # (Ручной kubectl annotate живого PVC не работает — Helm смотрит манифест релиза.)
    keepOnUninstall: false

  # OIDC (Keycloak/иной IdP). issuer/client_id/redirect_uri → ConfigMap.
  # client_secret берётся из Secret secrets.existingSecret по ключу SYNTH_OIDC_CLIENT_SECRET.
  # Пример включения (плейсхолдеры <...> заменить):
  #   oidc:
  #     enabled: true
  #     issuer: "https://keycloak.example.com/realms/<realm>"
  #     clientId: "synth"
  #     redirectUri: "https://synth.example.com/auth/callback"
  oidc:
    enabled: false
    issuer: ""
    clientId: ""
    redirectUri: ""

  # API-key режим (без Keycloak/OIDC): ключ → env SYNTH_API_KEY (роль ADMIN).
  # Взаимоисключает с backend.oidc.enabled — при одновременном включении
  # рендер чарта падает с понятной ошибкой (режимы не смешиваются).
  # Ключ берётся ТОЛЬКО из Secret (secretKeyRef), в ConfigMap/values не попадает.
  # existingSecret пуст → secrets.existingSecret (по умолчанию `synth-secrets`).
  # Пример:
  #   kubectl create secret generic synth-secrets \
  #     --from-literal=SYNTH_API_KEY='<api-key>'
  #   helm install synth ./charts/synth -f charts/synth/examples/values-apikey.yaml
  auth:
    apiKey:
      enabled: false
      existingSecret: ""
      secretKey: "SYNTH_API_KEY"

  # Провайдеры LLM → env SYNTH_PROVIDER_<NAME>_URL/TYPE/MODEL (ConfigMap).
  # API-ключи — по имени SYNTH_PROVIDER_<NAME>_API_KEY из secrets.existingSecret.
  # apiKey: false — без ключа (env API_KEY не создаётся).
  # Формат (пример): [{name, type, url, model, apiKey}]
  providers: []

  # Ресурсы backend: значения ниже — рабочий дефолт; подберите под нагрузку окружения.
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

  probes:
    # ВНИМАНИЕ: probes проверяют только живость процесса backend (`/health`).
    # Доступность БД при `storage.backend: postgres` здесь НЕ проверяется:
    # readiness=false на недоступной БД выключал бы из балансировки и UI
    # (nginx проксирует /api на backend), а при `storage.degradedMode:
    # fallback-file` деградация — штатный сценарий, а не отказ.
    # DB-aware готовность подключайте внешним мониторингом (см. README чарта).
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10

  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false

  # Доп. env для backend (попадают в ConfigMap → env pod).
  # Если задан caCert, чарт сам добавляет NODE_EXTRA_CA_CERTS — вручную дублировать не нужно.
  extraEnv: {}

  # Декларативный config.yaml backend (ADR-023). Непустой объект →
  # ConfigMap <release>-config, монтируется в backend как /etc/synth/config.yaml
  # (штатный путь поиска config backend, SYSTEM_CONFIG_PATH).
  # Приоритет: CLI-флаги > SYNTH_* env > config.yaml > defaults; runtime-настройки
  # из UI/API (settings.json) применяются поверх файла.
  # Пример: { events: { autoBind: true } }.
  # Секция `storage` ниже домержится в этот же config.yaml (ADR-096).
  config: {}

# ─────────────────────────────────────────────────────────────────────────────
# Слой хранения (ADR-096/ADR-097) — instance-wide для backend.
# ─────────────────────────────────────────────────────────────────────────────
# Всё, кроме пароля, рендерится в config.yaml (ConfigMap <release>-config) и
# монтируется в backend как /etc/synth/config.yaml. Пароль БД в values НЕ
# хранится (инвариант 13): он читается в env SYNTH_POSTGRES_PASSWORD из Secret
# (postgres.existingSecret | secrets.existingSecret, ключ secretPasswordKey).
storage:
  # file (дефолт) | memory (данные НЕ сохраняются — тесты/эмуляция) | postgres.
  # Драйвер `@itphx/synth-storage-postgres` + `pg` входят в образ (optional
  # dependencies ядра) — при backend=postgres ничего доустанавливать не нужно.
  backend: file

  postgres:
    # Параметры подключения (не секреты). Полная строка подключения (`dsn`)
    # намеренно не поддержана: значение ушло бы в ConfigMap, а DSN обычно
    # содержит пароль. Нужен DSN — задайте его сами в backend.config (без
    # пароля) или отдельным env из вашего Secret.
    host: ""
    port: 5432
    database: ""
    user: ""
    # Схема БД (namespace таблиц); пусто → схема драйвера по умолчанию.
    schema: ""
    # Требовать TLS-соединение (sslmode=require).
    ssl: false
    # Максимальный размер пула соединений.
    poolMax: 10
    # Secret с паролем БД. Пусто → secrets.existingSecret (по умолчанию
    # `synth-secrets`). Ключ внутри Secret — secretPasswordKey.
    existingSecret: ""
    secretPasswordKey: SYNTH_POSTGRES_PASSWORD

  # Задел деградированного режима (реализация — параллельная волна): "" (не
  # задано) | fallback-file (перейти на файловое хранилище) | halt (не стартовать).
  degradedMode: ""
  # Каталог файлового фоллбека; пусто → {dataDir}/fallback (внутри PVC backend).
  fallbackDir: ""

# ─────────────────────────────────────────────────────────────────────────────
# Топология исполнения (ADR-077, шаг 7c) — split-режим «control plane +
# отдельные исполнители (executor/worker)».
#
# По умолчанию всё выключено: `execution.mode: inline` — команды агентских
# тулов исполняются в процессе backend'а (прежнее поведение). Включение
# split-режима:
#
#   execution:
#     mode: remote
#   executor:
#     enabled: true
#
# Переключатель — параметр запуска (инвариант 24): смена режима требует
# рестарта процесса (graceful shutdown, exit code 75), а не runtime-настройки.
#
# Секция `execution` попадает в backend ТОЛЬКО через env `SYNTH_EXECUTION_*`
# (config.yaml не трогается): токен остаётся путём к файлу, а не значением
# (инвариант 13).
# ─────────────────────────────────────────────────────────────────────────────
execution:
  # inline (дефолт) | remote. Неизвестное значение → понятная ошибка рендера.
  mode: inline
  remote:
    # Адреса исполнителей (список). Пусто + `executor.enabled: true` → чарт
    # подставит адрес Service пула (http://synth-executor:<port>): балансировку
    # по репликам делает Kubernetes. Пусто + `executor.enabled: false` → ошибка
    # рендера (fail-closed: без адреса удалённый режим не поднимется).
    url: []
    # Таймаут exec-вызова, мс (env backend'а SYNTH_EXECUTION_TIMEOUT_MS).
    timeoutMs: 30000
    # Лимит одновременных exec-вызовов на backend (env SYNTH_EXECUTION_CONCURRENCY).
    # 0 → env не выставляется: дефолт приложения — число CPU control plane.
    concurrency: 0
    # fail (дефолт, fail-closed) | inline-fallback (явная настройка: backend
    # исполняет команду сам — обход изоляции, в managed-контуре включать осознанно).
    failMode: fail

# ─────────────────────────────────────────────────────────────────────────────
# Исполнитель (executor/worker) — пул контейнеров с toolchain'ом (ADR-077).
#
# Включается `executor.enabled: true` (вместе с `execution.mode: remote`).
# Требования к окружению:
#   - образ `synth-executor` (публикация образов — шаг 6 плана ADR-077);
#     для приватного реестра — `executor.imagePullSecrets`;
#   - RWX-том (NFS/CephFS/…) под общий workspace: том должен быть виден и
#     control plane, и всем репликам исполнителя. Если в кластере нет RWX-класса
#     — задайте свой claim (`executor.workspace.existingClaim`);
#   - Secret с токеном доверия `synth_exec_…` (см. `executor.token`).
# ─────────────────────────────────────────────────────────────────────────────
executor:
  enabled: false
  nameOverride: ""
  fullnameOverride: ""
  # Размер пула: столько реплик исполнителя (балансировка — через Service).
  replicaCount: 1

  image:
    repository: git.itphx.ru/itphx/synth-executor
    # Пустой tag → .Chart.AppVersion (как у backend'а/UI).
    tag: ""
    pullPolicy: IfNotPresent

  # Секреты для приватного реестра (kubernetes.io/dockerconfigjson).
  imagePullSecrets: []

  service:
    type: ClusterIP
    port: 5100
    targetPort: 5100

    # Привязка клиента к поду: None (по умолчанию) — обычная балансировка;
    # ClientIP — трафик control plane закрепляется за одним подом пула
    # (браузерные MCP-сессии живут внутри пода: без привязки последовательные
    # вызовы одной сессии попадают на разные поды).
    sessionAffinity: None

  # Ресурсы исполнителя: подберите под нагрузку окружения.
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

  # Лимиты исполнителя (env SYNTH_EXECUTOR_MAX_*).
  limits:
    # Лимит одновременных команд в одном исполнителе.
    maxConcurrency: 4
    # Потолок таймаута команды, мс.
    maxTimeoutMs: 120000
    # Потолок буфера вывода, байт.
    maxOutputBytes: 10485760

  # MCP-серверы, которые исполнитель хостит у себя (stdio, ADR-077 шаг B1).
  #
  # Элемент списка: { name, command, args, env }. Рендерится в env
  # `SYNTH_EXECUTOR_MCP_SERVERS` (JSON) — конфигурация исполнителя только через
  # env (config.yaml у воркера нет). `env` — секреты MCP-сервера: передавайте
  # их через `extraEnv`/Secret, а не в values (инвариант 13).
  #
  # По умолчанию — пусто: чарт ничего не навязывает и не зависит от flavor'а
  # образа. Образы flavor'ов `browser`/`full` уже несут дефолт с Playwright MCP
  # (см. `docker/Dockerfile.executor`); этот список **заменяет** его целиком.
  #
  # Рецепт Playwright (образ `full`; в контейнере нет дисплея и Google Chrome):
  #
  #   mcp:
  #     servers:
  #       - name: playwright-mcp
  #         command: playwright-mcp
  #         args:
  #           - --headless
  #           - --no-sandbox          # образ по умолчанию root; под uid 1000 безвреден
  #           - --executable-path
  #           - /opt/synth/browser/chrome   # стабильный симлинк tier 3
  #         env: {}
  mcp:
    # false → env SYNTH_EXECUTOR_MCP_SERVERS="" (MCP-серверов нет; отключает и
    # дефолт образа). true + пустой servers → env не выставляется (дефолт образа).
    enabled: true
    servers: []

  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10

  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  workspace:
    # Общий том workspace: control plane и все реплики исполнителя должны
    # видеть одни и те же файлы. true → чарт создаёт PVC (RWX) и монтирует его
    # в backend и в исполнитель по пути `mountPath`. Действует только при
    # `executor.enabled: true` (иначе чарт ничего не создаёт и не монтирует).
    enabled: true
    # Существующий claim (например, если в кластере нет RWX-класса). Пусто →
    # `claimName`, пусто → claim создаёт чарт.
    existingClaim: ""
    claimName: ""
    # Размер общего тома. Для тестовых стендов достаточно 5–10 ГБ: workspace —
    # это рабочие каталоги проектов, большие объёмы не нужны.
    size: 10Gi
    # Класс хранилища. Пусто → класс по умолчанию кластера.
    # ВАЖНО: класс должен поддерживать ReadWriteMany (RWX) — том общий для
    # backend'а и всех реплик исполнителя (NFS/CephFS-подобные классы;
    # `local-path`/ReadWriteOnce не подойдут). Пример из тестового окружения
    # (K3s): `nfs-rwx` (provisioner `nfs.csi.k8s.io`).
    # Дефолт намеренно пустой: чарт публикуемый — подставлять класс
    # конкретного окружения нельзя, у клиента без такого класса установка
    # сломается. Если в кластере нет RWX-класса — задайте свой существующий
    # claim (`existingClaim`) с accessMode: ReadWriteMany.
    storageClass: ""
    # RWX обязателен: том общий для backend и всех реплик исполнителя.
    # Если класс тома не поддерживает ReadWriteMany — задайте свой claim
    # (`existingClaim`) с нужным accessMode.
    accessMode: ReadWriteMany
    # true → PVC не удаляется при `helm uninstall`: чарт добавляет в манифест
    # аннотацию helm.sh/resource-policy: keep. Включайте, когда общий том
    # workspace нельзя терять: у класса с reclaimPolicy: Retain PV иначе
    # остаётся осиротевшим (вне релизов, без управления).
    # (Ручной kubectl annotate живого PVC не работает — Helm смотрит манифест релиза.)
    keepOnUninstall: false
    # Точка монтирования в обоих контейнерах (одинаковый путь внутри контейнера).
    mountPath: /var/synth/data/workspaces
    # Каталог workspace на стороне backend'а (storage.workspacesRoot → env
    # SYNTH_WORKSPACES_ROOT). Пусто → дефолт приложения ({dataDir}/workspaces) —
    # он совпадает с mountPath по умолчанию. Задайте, если mountPath отличается
    # от {dataDir}/workspaces: иначе backend создаст каталоги проектов вне общего
    # тома, и исполнитель их не увидит (containment → отказ EWORKSPACE).
    backendWorkspacesRoot: ""

  networkPolicy:
    # NetworkPolicy для пула (ADR-077 «Изоляция, лимиты и квоты»).
    # false → объект не рендерится (сеть кластера как есть).
    enabled: false
    # Дополнительные egress-правила (формат networking.k8s.io/v1). По умолчанию
    # разрешён только DNS (namespace kube-system) — открытого egress в интернет
    # нет. Пример (доступ к внешнему git-репозиторию):
    #   allowedEgress:
    #     - to: [{ipBlock: {cidr: 203.0.113.0/24}}]
    #       ports: [{protocol: TCP, port: 443}]
    allowedEgress: []

  token:
    # Secret с токеном доверия `synth_exec_…`. Пусто → secrets.existingSecret.
    # Значение токена в values НЕ хранится (инвариант 13) — только ссылка.
    existingSecret: ""
    # Ключ внутри Secret. Backend получает токен ФАЙЛОМ
    # (/etc/synth/executor/token → env SYNTH_EXECUTION_TOKEN=путь), исполнитель —
    # значением в env SYNTH_EXECUTOR_TOKEN (secretKeyRef). Один Secret на обе
    # стороны — токен совпадает.
    secretKey: SYNTH_EXECUTION_TOKEN

# ─────────────────────────────────────────────────────────────────────────────
# Доверие TLS/CA исходящих соединений Synth (ADR-099, конфиг `security.tls`).
# Пусто (дефолт) → системное доверие Node; манифесты не меняются.
#
# Пароли/ключи в ConfigMap НЕ кладутся (инвариант 13) — в config.yaml попадают
# ТОЛЬКО пути внутри контейнера. Сами файлы — в Secret (`existingSecret`),
# который монтируется в backend как /etc/synth/tls (readOnly, 0400).
#
# Пример: корпоративный CA и клиентский сертификат (mTLS) в Secret `corp-tls`:
#   security:
#     tls:
#       existingSecret: corp-tls   # ключи внутри Secret
#       caKey: ca.crt
#       certKey: client.crt
#       keyKey: client.key
#       rejectUnauthorized: "true" # "" = дефолт (true)
# → config.yaml: security.tls.{caFile,certFile,keyFile} = /etc/synth/tls/<key>
#
# Файлы уже смонтированы вами (свой Secret/volume)? Задайте пути напрямую
# (caFile/certFile/keyFile) — чарт тогда ничего не монтирует, только рендерит
# секцию в config.yaml. Для git-канала (`-c http.sslCAInfo`) нужен именно
# `caFile` (путь): `caPem` без файла git не поддерживает.
# ─────────────────────────────────────────────────────────────────────────────
security:
  tls:
    # Secret с CA/клиентскими сертификатами → mount в /etc/synth/tls (0400).
    # Пусто → ничего не монтируется.
    existingSecret: ""
    # Ключи внутри existingSecret; пусто → путь не рендерится.
    caKey: ""
    certKey: ""
    keyKey: ""
    # Явные пути внутри контейнера (когда файлы смонтированы вами).
    caFile: ""
    certFile: ""
    keyFile: ""
    # "" (дефолт true) | "true" | "false" → security.tls.rejectUnauthorized.
    rejectUnauthorized: ""

# ─────────────────────────────────────────────────────────────────────────────
# Наблюдаемость (ADR-094): GET /metrics, ServiceMonitor, дашборды Grafana, алерты.
#
# Метрики по умолчанию ВЫКЛЮЧЕНЫ (ADR-094 п. 4): эндпоинт появляется только при
# `metrics.enabled: true`. Скрейп настраивается одним из способов (можно
# несколько): vanilla Prometheus по аннотациям prometheus.io/*, Prometheus
# Operator через ServiceMonitor (CRD monitoring.coreos.com/v1 — не обязательны)
# или отдельный Ingress для внешнего Prometheus (metrics.ingress).
#
# Порядок включения:
#   1) metrics.enabled: true                        → env SYNTH_METRICS_ENABLED=true;
#   2) metrics.prometheus.annotations: true         → аннотации prometheus.io/* на pod;
#      ИЛИ metrics.serviceMonitor.enabled: true     → объект ServiceMonitor;
#      ИЛИ metrics.ingress.enabled: true            → Ingress на backend (внешний Prometheus);
#   3) grafana.dashboards.enabled: true             → ConfigMap с дашбордами (sidecar);
#   4) alerts.enabled: true                         → PrometheusRule с правилами.
# Подробности и примеры — README.md чарта, раздел «Наблюдаемость».
# ─────────────────────────────────────────────────────────────────────────────
metrics:
  # true → env SYNTH_METRICS_ENABLED=true у backend (GET /metrics на порту
  # backend.service.targetPort). Включение без скрейпа безопасно: эндпоинт
  # просто никто не читает.
  enabled: false

  # Опциональный bearer-токен /metrics (ADR-094 п. 4).
  # Пусто → /metrics отдаётся без авторизации (штатно в кластере: доступ
  # ограничен сетью pod'а/Ingress-политикой). Задан existingSecret →
  # env SYNTH_METRICS_TOKEN из secretKeyRef (optional — см. tokenOptional).
  # ВНИМАНИЕ: при включённом токене ServiceMonitor нужно передать его в
  # metrics.serviceMonitor.bearerTokenSecret, иначе скрейп получит 401.
  existingSecret: ""
  tokenKey: SYNTH_METRICS_TOKEN
  # optional у secretKeyRef токена:
  #   true  — отсутствие ключа в Secret не блокирует старт pod'а;
  #   false — pod ждёт появления Secret/ключа (для внешнего Ingress с
  #           токеном рекомендуется false).
  tokenOptional: true

  # Отдельный Ingress для внешнего Prometheus (templates/metrics-ingress.yaml).
  # Ведёт напрямую на backend Service — UI-nginx /metrics не проксирует.
  # Включать только вместе с metrics.enabled (иначе fail: эндпоинта нет).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # [{host: metrics.example.com, paths: [{path: /metrics, pathType: Prefix}]}]
    hosts: []
    tls: []

  prometheus:
    # Vanilla Prometheus (без CRD): аннотации на pod template:
    #   prometheus.io/scrape: "true"
    #   prometheus.io/port:   "<backend.service.targetPort>"
    #   prometheus.io/path:   "/metrics"
    # Включайте вместе с metrics.enabled: аннотации на выключенном эндпоинте
    # дают ложный up==0 (404) и ложные алерты.
    annotations: false

  serviceMonitor:
    # Prometheus Operator: объект ServiceMonitor (templates/servicemonitor.yaml).
    # Требует установленных CRD — без них рендер/установка упадут.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Доп. labels ServiceMonitor. Обычно нужен label селектора вашего
    # Prometheus, например `release: kube-prometheus-stack`.
    labels: {}
    # namespaceSelector ServiceMonitor. Пусто → namespace релиза (оператор
    # по умолчанию ищет ServiceMonitor в своём namespace).
    # ServiceMonitor рядом с Prometheus в другом namespace:
    #   namespaceSelector:
    #     matchNames: [monitoring]
    namespaceSelector: {}
    # Bearer-токен скрейпа (тот же Secret/ключ, что metrics.existingSecret).
    # Пусто → блок authorization не рендерится.
    bearerTokenSecret:
      name: ""
      key: ""

# Grafana: дашборды из charts/synth/files/dashboards/*.json → ConfigMap с
# label grafana_dashboard=<label>. Подхватывается sidecar'ом Grafana
# (kube-prometheus-stack, grafana chart с sidecar.dashboards.enabled=true).
grafana:
  dashboards:
    enabled: false
    # Значение label grafana_dashboard (sidecar ищет "1" по умолчанию).
    label: "1"
    # Значение аннотации grafana_folder (папка в Grafana); пусто → не рендерится.
    folder: ""
    # Доп. labels ConfigMap (например release: kube-prometheus-stack).
    labels: {}

# Prometheus-правила алертов (PrometheusRule, templates/prometheusrule.yaml).
# Сами правила — files/alerts/synth-rules.yaml в формате plain YAML (groups),
# тот же файл можно подключить к vanilla Prometheus через rule_files.
alerts:
  enabled: false
  # Доп. labels PrometheusRule — нужны, чтобы Prometheus оператора выбрал
  # правила (например release: kube-prometheus-stack).
  labels: {}
  # Доп. аннотации PrometheusRule (например runbook_url кластера).
  annotations: {}

# ─────────────────────────────────────────────────────────────────────────────
# UI — @itphx/synth-ui (React SPA) под nginx, проксирует /api /ws /auth /admin на backend.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  nameOverride: ""
  fullnameOverride: ""
  replicaCount: 1

  image:
    repository: gitverse.ru/itphx/synth-ui
    # Пустой tag → подставляется .Chart.AppVersion (см. templates/ui-deployment.yaml).
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  # Ресурсы UI (nginx): дефолт для типовой нагрузки; переопределяется по окружению.
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  podSecurityContext:
    # nginx:alpine требует root для entrypoint (чтение/генерация конфигов).
    # RunAsUser не задаём — контейнер стартует как root, nginx сам дропает на worker'ы.
    fsGroup: 101
  containerSecurityContext:
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false

# ─────────────────────────────────────────────────────────────────────────────
# Ingress — трафик на UI (nginx проксирует /api /ws /auth /admin /health на backend).
# По умолчанию выключен (self-host может использовать свой балансировщик/Ingress).
# ─────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  # Ingress-контроллер: nginx | traefik | none.
  #   nginx   — HTTP→HTTPS через аннотацию nginx.ingress.kubernetes.io/ssl-redirect
  #             (при redirectHttpToHttps); TLS терминируется на nginx-контроллере.
  #   traefik — HTTP→HTTPS через CRD Middleware + IngressRoute (templates/traefik-redirect.yaml)
  #             плюс аннотация entrypoints; TLS терминируется на Traefik.
  #   none    — чарт не добавляет ни аннотаций контроллера, ни CRD
  #             (контроллер и редирект настраиваются вне чарта).
  controller: nginx
  # IngressClass: "" = класс по умолчанию кластера; обычно "nginx" или "traefik".
  className: ""
  # Произвольные аннотации Ingress (мержатся с авто-аннотациями контроллера,
  # заданные здесь значения приоритетнее). Пример для cert-manager:
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
  # Только для controller: traefik. Аннотация
  # traefik.ingress.kubernetes.io/router.entrypoints добавляется, если значение не пустое.
  entrypoints: ""
  # HTTP→HTTPS-редирект:
  #   nginx   — аннотация ssl-redirect (нужен настроенный TLS, см. tls ниже);
  #   traefik — Middleware redirect-to-https + IngressRoute (web) → 301 на https;
  #   none    — игнорируется.
  redirectHttpToHttps: true
  # Формат: [{host, paths: [{path, pathType}]}] — сейчас рендерится только host.
  hosts: []
  tls: []

# Имя существующего Secret с ключами:
#   SYNTH_OIDC_CLIENT_SECRET, SYNTH_PROVIDER_<NAME>_API_KEY (при необходимости).
# Чарт НЕ создаёт Secret — предполагается, что он уже есть в namespace релиза
# (или создаётся отдельно: External Secrets, sealed-secrets, ручной kubectl create).
secrets:
  existingSecret: synth-secrets

# Installer service-key (ADR-052): создаётся при развёртывании Synth и используется
# аддонами для самоустановки своих ресурсов (MCP-серверы, скиллы) по scope addons:install.
# Провижининг идемпотентен при старте backend (security.bootstrapServiceKeys) — ключ
# создаётся/синхронизируется по `label`, повторный `helm upgrade` секрет не меняет.
installerKey:
  enabled: false
  label: addon-installer
  # Установщику нужны оба scope: addons:install — MCP-реестр и скиллы,
  # automation:install — установка пакетов расширений (роли, пайплайны).
  scopes: ["addons:install", "automation:install"]
  roles: []                 # доступ дают scopes; роль повышать не нужно
  # Secret: если existingSecret пуст — чарт создаёт Secret со сгенерированным токеном
  # (стабильным между `helm upgrade`); иначе используется существующий Secret,
  # в котором по ключу `bootstrapKey` лежит готовый JSON для SYNTH_BOOTSTRAP_SERVICE_KEYS,
  # а по ключу `tokenKey` — тот же токен в plaintext (для аддонов).
  secretName: synth-installer-key
  existingSecret: ""
  bootstrapKey: bootstrap.json
  # Ключ с «сырым» plaintext-токеном (`synth_svc_…`) в том же Secret — для аддонов
  # (hook-Job авто-установки): secretKeyRef {name: <secret>, key: token}.
  tokenKey: "token"

# CA внутренней инфраструктуры (PEM, опционально).
# Пусто по умолчанию. Если задан непустым:
#   - создаётся ConfigMap <release>-itphx-ca;
#   - в backend-под монтируется /etc/ssl/certs/itphx-ca.crt;
#   - автоматически добавляется env NODE_EXTRA_CA_CERTS.
# Удобно передавать файлом, не встраивая PEM в values:
#   helm install synth ./charts/synth --set-file caCert=./my-ca.crt -f my-values.yaml
caCert: ""

# ─────────────────────────────────────────────────────────────────────────────
# Произвольные дополнительные манифесты (опционально).
# Список Kubernetes-манифестов, рендерятся как есть (любой kind: ConfigMap,
# Secret, CR кластера). Namespace указывать не обязательно — подставится
# namespace релиза.
# Пример: [{ apiVersion: v1, kind: ConfigMap, metadata: { name: extra }, data: {} }]
extraObjects: []
