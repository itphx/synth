# ─────────────────────────────────────────────────────────────────────────────
# Способы запуска:
#
#   1) Файловое хранилище (по умолчанию, ADR-005/ADR-096):
#        docker compose up -d
#      Поднимается только `synth`; данные — в томе `synth-data`.
#
#   2) PostgreSQL как backend хранения (PROP-032, ADR-096/ADR-097):
#      задайте в .env рядом с этим файлом (минимум — пароль БД):
#        SYNTH_STORAGE_BACKEND=postgres
#        SYNTH_POSTGRES_PASSWORD=<пароль>          # секрет, в git не коммитить
#      и поднимите профиль `postgres`:
#        docker compose --profile postgres up -d
#      `synth` дождётся healthcheck БД (мягкая зависимость `required: false`,
#      нужен Docker Compose ≥ v2.20) и стартует с backend=postgres.
#
#   Образы не меняются: драйвер `@itphx/synth-storage-postgres` и `pg` приходят
#   транзитивно (optionalDependencies ядра) — правка Dockerfile не нужна.
#
#   3) All-in-one (PROP-082): control plane + toolchain в одном контейнере.
#        docker compose --profile all-in-one up -d
#      Поднимаются `synth-backend` (flavor `core` — toolchain внутри),
#      `synth-ui` и (опционально) `postgres`. Режим исполнения — `inline`
#      (дефолт): `SYNTH_EXECUTION_MODE` не задаётся, команды идут в процесс
#      control plane. Данные — в томе `synth-data`.
#
#   4) Split (PROP-077/PROP-082): control plane БЕЗ toolchain'а + отдельные
#      исполнители.
#        docker compose --profile split up -d
#      Поднимаются `synth-backend-split` (slim — только control plane),
#      `synth-executor` (worker с toolchain'ом), `synth-ui` и `postgres`.
#      Backend получает `SYNTH_EXECUTION_MODE=remote` и адрес исполнителя;
#      токен доверия — из файла (`.executor-token`), монтируемого в контейнер
#      как `/etc/synth/executor/token` (control plane читает токен ТОЛЬКО из
#      файла — инвариант 13), а исполнитель получает то же значение в env
#      `SYNTH_EXECUTOR_TOKEN`. Подготовка (одна команда, значения согласованы):
#        TOKEN=$(openssl rand -base64 32); \
#        printf '%s' "$TOKEN" > .executor-token; \
#        echo "SYNTH_EXECUTOR_TOKEN=$TOKEN" >> .env
#      Workspace — общий том `synth-workspace` (в K3s это RWX-PVC).
# ─────────────────────────────────────────────────────────────────────────────
services:
  synth:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: synth
    ports:
      - "4300:4300"
    environment:
      # Ключ API берётся из .env (обязателен): задайте `SYNTH_API_KEY=...`
      # в .env рядом с docker-compose.yml или в окружении. Хардкод убран,
      # чтобы compose не перекрывал .env.
      - SYNTH_API_KEY=${SYNTH_API_KEY:?set SYNTH_API_KEY in .env}
      # Restart из UI: контейнер завершается с кодом 75, Docker перезапускает
      # его (`restart: unless-stopped` ниже). `docker run` без restart policy
      # контейнер не поднимет — задайте `--restart` или режим `disabled`.
      - SYNTH_RESTART_MODE=${SYNTH_RESTART_MODE:-process}
      - SYNTH_PROVIDER_OLLAMA_API_KEY=${SYNTH_PROVIDER_OLLAMA_API_KEY:-}
      # Ollama: нативный базовый URL без /v1 — type: ollama ходит на /api/chat
      # (так применяются num_ctx/options, think и инструменты).
      # Для OpenAI-совместимого пути используйте type: openai/generic.
      - SYNTH_PROVIDER_OLLAMA_URL=${SYNTH_PROVIDER_OLLAMA_URL:-http://ollama:11434}
      - SYNTH_PROVIDER_OLLAMA_MODEL=${SYNTH_PROVIDER_OLLAMA_MODEL:-qwen3.8:27b}
      - SYNTH_PROVIDER_OLLAMA_TYPE=ollama
      # --- Слой хранения (PROP-032, ADR-096/ADR-097) ---
      # backend: file (дефолт) | memory (данные НЕ сохраняются) | postgres.
      # При postgres поднимите профиль `postgres` (сервис ниже) — иначе хост
      # `postgres` не разрешится в DNS Docker-сети.
      - SYNTH_STORAGE_BACKEND=${SYNTH_STORAGE_BACKEND:-file}
      - SYNTH_POSTGRES_HOST=${SYNTH_POSTGRES_HOST:-postgres}
      - SYNTH_POSTGRES_PORT=${SYNTH_POSTGRES_PORT:-5432}
      - SYNTH_POSTGRES_DATABASE=${SYNTH_POSTGRES_DATABASE:-synth}
      - SYNTH_POSTGRES_USER=${SYNTH_POSTGRES_USER:-synth}
      - SYNTH_POSTGRES_SCHEMA=${SYNTH_POSTGRES_SCHEMA:-}
      - SYNTH_POSTGRES_SSL=${SYNTH_POSTGRES_SSL:-false}
      - SYNTH_POSTGRES_POOL_MAX=${SYNTH_POSTGRES_POOL_MAX:-}
      # Пароль БД — только из env (в git и в логи не попадает). Пусто → core
      # прочитает файл {dataDir}/secrets/postgres-password из тома synth-data
      # (удобно, когда пароль не хочется держать в .env).
      - SYNTH_POSTGRES_PASSWORD=${SYNTH_POSTGRES_PASSWORD:-}
      # Задел деградации (storage.degradedMode | fallbackDir) env-переменных не
      # имеет — задаётся в config.yaml (SYNTH_CONFIG или ./config.yaml).
      # --- Доверие TLS/CA исходящих соединений (ADR-099, security.tls) ---
      # Пусто → системное доверие Node (поведение не меняется). Значения — пути
      # К ФАЙЛАМ ВНУТРИ контейнера (смонтируйте CA/клиентские сертификаты сами
      # через volumes ниже или свой Secret); PEM целиком — SYNTH_TLS_CA_PEM.
      # Секреты в compose-файл не хардкодим, значения берутся из .env.
      - SYNTH_TLS_CA_FILE=${SYNTH_TLS_CA_FILE:-}
      - SYNTH_TLS_CA_PEM=${SYNTH_TLS_CA_PEM:-}
      - SYNTH_TLS_CERT_FILE=${SYNTH_TLS_CERT_FILE:-}
      - SYNTH_TLS_KEY_FILE=${SYNTH_TLS_KEY_FILE:-}
      - SYNTH_TLS_REJECT_UNAUTHORIZED=${SYNTH_TLS_REJECT_UNAUTHORIZED:-}
    volumes:
      # При backend=file — здесь ВСЕ данные Synth (сессии, проекты, сообщения,
      # провайдеры/модели/агенты, события, расписания, …).
      # При backend=postgres — только ПЕРИФЕРИЯ: secrets/ (мастер-ключ,
      # api-key, ssh-keys, при необходимости postgres-password), meta.json
      # (версия схемы данных) и workspace'ы проектов.
      # Данные (сессии/проекты/…) — в БД (том postgres-data).
      - synth-data:/var/synth/data
    # Мягкая зависимость: без профиля `postgres` сервиса в модели нет — запуск
    # остаётся файловым (проверено `docker compose config` без профиля).
    # С включённым профилем Compose дожидается `service_healthy` у БД.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Опционально: Ollama для локального запуска LLM
  # Чтобы загрузить модель: docker compose exec ollama ollama pull qwen3.8:27b
  ollama:
    image: ollama/ollama:latest
    container_name: synth-ollama
    ports:
      - "11434:11434"
    environment:
      # Серверный дефолт контекстного окна Ollama. num_ctx можно задать и через
      # Synth (--num-ctx / SYNTH_PROVIDER_OLLAMA_NUM_CTX / поле API) — он
      # передаётся в теле нативного /api/chat и приоритетнее этого значения.
      # 262144 = 256k токенов; уменьшите, если не хватает памяти/VRAM.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-262144}
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    profiles:
      - ollama

  # PostgreSQL — backend хранения (PROP-032). Профиль `postgres`: без него
  # `docker compose up` остаётся файловым (сервис и том не создаются).
  # Требуется SYNTH_POSTGRES_PASSWORD (см. шапку файла) — пароль попадает в
  # контейнер БД через env, в git/compose-файл не хардкодится.
  # Порт публикуется ТОЛЬКО на localhost (по умолчанию); при необходимости
  # переопределите SYNTH_POSTGRES_PUBLISH (например "5432:5432" — не рекомендуется).
  postgres:
    image: postgres:17-alpine
    container_name: synth-postgres
    ports:
      - "${SYNTH_POSTGRES_PUBLISH:-127.0.0.1:5432}:5432"
    environment:
      - POSTGRES_DB=${SYNTH_POSTGRES_DATABASE:-synth}
      - POSTGRES_USER=${SYNTH_POSTGRES_USER:-synth}
      - POSTGRES_PASSWORD=${SYNTH_POSTGRES_PASSWORD:-}
      # Инициализация схемы не нужна: миграции применяются драйвером при старте
      # (schemaMode=apply по умолчанию); вручную — `synth migrate`.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready с тем же пользователем/БД, что заданы выше.
      test:
        - CMD-SHELL
        - pg_isready -U ${SYNTH_POSTGRES_USER:-synth} -d ${SYNTH_POSTGRES_DATABASE:-synth}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    profiles:
      - postgres

  # ─────────────────────────────────────────────────────────────────────────────
  # All-in-one (PROP-082): control plane + toolchain в одном контейнере
  # ─────────────────────────────────────────────────────────────────────────────
  #
  # Образ — flavor `core` (hard deps + tier 0 + control plane). Локально
  # собирается из репозитория; для развёртывания — опубликованный образ
  # `git.itphx.ru/itphx/synth-backend:<версия>-core` (задать через
  # SYNTH_IMAGE_BACKEND/SYNTH_IMAGE_BACKEND_TAG и `docker compose pull`).
  #
  # Режим исполнения — `inline` (дефолт приложения): `SYNTH_EXECUTION_MODE`
  # НЕ задаётся, команды агентских тулов идут в процесс control plane.
  synth-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: core
    image: ${SYNTH_IMAGE_BACKEND:-synth-backend}:${SYNTH_IMAGE_BACKEND_TAG:-local-core}
    container_name: synth-backend
    ports:
      - "${SYNTH_BACKEND_PUBLISH:-127.0.0.1:5000}:5000"
    environment:
      - SYNTH_API_KEY=${SYNTH_API_KEY:?set SYNTH_API_KEY in .env}
      - SYNTH_PORT=5000
      - SYNTH_DATA_DIR=/var/synth/data
      - SYNTH_RESTART_MODE=${SYNTH_RESTART_MODE:-process}
      # Слой хранения — как у standalone-сценария (PROP-032, ADR-096).
      - SYNTH_STORAGE_BACKEND=${SYNTH_STORAGE_BACKEND:-file}
      - SYNTH_POSTGRES_HOST=${SYNTH_POSTGRES_HOST:-postgres}
      - SYNTH_POSTGRES_PORT=${SYNTH_POSTGRES_PORT:-5432}
      - SYNTH_POSTGRES_DATABASE=${SYNTH_POSTGRES_DATABASE:-synth}
      - SYNTH_POSTGRES_USER=${SYNTH_POSTGRES_USER:-synth}
      - SYNTH_POSTGRES_PASSWORD=${SYNTH_POSTGRES_PASSWORD:-}
      # Провайдеры LLM (необязательно) — как в standalone-сценарии.
      - SYNTH_PROVIDER_OLLAMA_URL=${SYNTH_PROVIDER_OLLAMA_URL:-http://ollama:11434}
      - SYNTH_PROVIDER_OLLAMA_MODEL=${SYNTH_PROVIDER_OLLAMA_MODEL:-qwen3.8:27b}
      - SYNTH_PROVIDER_OLLAMA_TYPE=ollama
      - SYNTH_PROVIDER_OLLAMA_API_KEY=${SYNTH_PROVIDER_OLLAMA_API_KEY:-}
    volumes:
      - synth-data:/var/synth/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    profiles:
      - all-in-one

  # ─────────────────────────────────────────────────────────────────────────────
  # Split (PROP-077/PROP-082): control plane (slim) + исполнители (worker'ы)
  # ─────────────────────────────────────────────────────────────────────────────
  #
  # Control plane — slim-образ (без toolchain'а): команды агентских тулов
  # уходят исполнителю по HTTP (PROP-077), поэтому в control plane НИКАКОГО
  # toolchain'а не нужно — изоляция достигается именно этим.
  #
  # Имя сервиса — `synth-backend-split`, но сетевой алиас `synth-backend`
  # (тот же, что у all-in-one): UI (nginx) проксирует API на `synth-backend`.
  synth-backend-split:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: slim
    image: ${SYNTH_IMAGE_BACKEND_SLIM:-synth-backend}:${SYNTH_IMAGE_BACKEND_SLIM_TAG:-local-slim}
    container_name: synth-backend-split
    ports:
      - "${SYNTH_BACKEND_PUBLISH:-127.0.0.1:5000}:5000"
    environment:
      - SYNTH_API_KEY=${SYNTH_API_KEY:?set SYNTH_API_KEY in .env}
      - SYNTH_PORT=5000
      - SYNTH_DATA_DIR=/var/synth/data
      - SYNTH_RESTART_MODE=${SYNTH_RESTART_MODE:-process}
      # --- Топология исполнения (PROP-077) ---
      # Переключатель — параметр запуска (инвариант 24): смена режима требует
      # рестарта процесса, а не runtime-настройки.
      - SYNTH_EXECUTION_MODE=remote
      - SYNTH_EXECUTION_REMOTE_URL=http://synth-executor:5100
      # Токен доверия — ПУТЬ К ФАЙЛУ (инвариант 13): значение токена в конфиге
      # и в переменных окружения не хранится.
      - SYNTH_EXECUTION_TOKEN=/etc/synth/executor/token
      # fail (по умолчанию) — при недоступном исполнителе команда НЕ выполняется
      # локально. `inline-fallback` — осознанный обход изоляции, в managed-
      # контуре не включать.
      - SYNTH_EXECUTION_FAIL_MODE=${SYNTH_EXECUTION_FAIL_MODE:-fail}
      # Слой хранения — как у standalone-сценария (PROP-032, ADR-096).
      - SYNTH_STORAGE_BACKEND=${SYNTH_STORAGE_BACKEND:-file}
      - SYNTH_POSTGRES_HOST=${SYNTH_POSTGRES_HOST:-postgres}
      - SYNTH_POSTGRES_PORT=${SYNTH_POSTGRES_PORT:-5432}
      - SYNTH_POSTGRES_DATABASE=${SYNTH_POSTGRES_DATABASE:-synth}
      - SYNTH_POSTGRES_USER=${SYNTH_POSTGRES_USER:-synth}
      - SYNTH_POSTGRES_PASSWORD=${SYNTH_POSTGRES_PASSWORD:-}
      - SYNTH_PROVIDER_OLLAMA_URL=${SYNTH_PROVIDER_OLLAMA_URL:-http://ollama:11434}
      - SYNTH_PROVIDER_OLLAMA_MODEL=${SYNTH_PROVIDER_OLLAMA_MODEL:-qwen3.8:27b}
      - SYNTH_PROVIDER_OLLAMA_TYPE=ollama
      - SYNTH_PROVIDER_OLLAMA_API_KEY=${SYNTH_PROVIDER_OLLAMA_API_KEY:-}
    volumes:
      - synth-data:/var/synth/data
      # Общий с исполнителями workspace (в K3s — RWX-PVC). Тот же путь внутри
      # контейнера, что и `SYNTH_EXECUTOR_WORKSPACE` у исполнителя: иначе
      # containment исполнителя отклонит `cwd` (EWORKSPACE).
      - synth-workspace:/var/synth/data/workspaces
      # Файл с токеном доверия (только чтение). Создайте его заранее — иначе
      # Docker создаст на его месте каталог, и control plane упадёт (fail-closed).
      - ${SYNTH_EXECUTOR_TOKEN_FILE:-./.executor-token}:/etc/synth/executor/token:ro
    networks:
      default:
        aliases:
          - synth-backend
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      synth-executor:
        condition: service_started
        required: false
    restart: unless-stopped
    profiles:
      - split

  # Исполнитель (worker) — отдельный процесс с toolchain'ом (PROP-077).
  # В образе НЕТ control plane: ни OIDC/RBAC, ни LLM-ключей.
  synth-executor:
    build:
      context: .
      dockerfile: docker/Dockerfile.executor
      target: core
    image: ${SYNTH_IMAGE_EXECUTOR:-synth-executor}:${SYNTH_IMAGE_EXECUTOR_TAG:-local-core}
    container_name: synth-executor
    environment:
      # Токен доступа к API исполнителя (обязателен — fail-closed) и корень
      # workspace (граница containment'а). Значение токена — то же, что в файле,
      # который читает control plane. Пусто → исполнитель не стартует с
      # понятным сообщением (fail-closed, packages/executor/src/config.ts).
      - SYNTH_EXECUTOR_TOKEN=${SYNTH_EXECUTOR_TOKEN:-}
      - SYNTH_EXECUTOR_WORKSPACE=/var/synth/data/workspaces
      - SYNTH_EXECUTOR_HOST=0.0.0.0
      - SYNTH_EXECUTOR_PORT=5100
    volumes:
      - synth-workspace:/var/synth/data/workspaces
    expose:
      - "5100"
    restart: unless-stopped
    profiles:
      - split

  # UI (nginx + SPA) — проксирует API на `synth-backend` (см. docker/nginx-ui.conf).
  synth-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    image: ${SYNTH_IMAGE_UI:-synth-ui}:${SYNTH_IMAGE_UI_TAG:-local}
    container_name: synth-ui
    ports:
      - "${SYNTH_UI_PUBLISH:-127.0.0.1:5002}:8080"
    # Зависимость от backend'а НЕ объявляется: имя сервиса различается в
    # профилях (`synth-backend` в all-in-one, `synth-backend-split` в split —
    # с алиасом `synth-backend` в сети). nginx проксирует API на DNS-имя
    # `synth-backend` (docker/nginx-ui.conf), поэтому отдельная зависимость
    # не нужна.
    restart: unless-stopped
    profiles:
      - all-in-one
      - split

volumes:
  synth-data:
  ollama-data:
  postgres-data:
  # Общий workspace control plane и исполнителей (split-топология).
  synth-workspace:
