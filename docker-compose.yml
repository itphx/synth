services:
  synth:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: synth
    ports:
      - "4300:4300"
    environment:
      # Ключ API берётся из .env (обязателен): задайте `SYNTH_API_KEY=...`
      # в .env рядом с docker-compose.yml или в окружении. Хардкод убран,
      # чтобы compose не перекрывал .env.
      - SYNTH_API_KEY=${SYNTH_API_KEY:?set SYNTH_API_KEY in .env}
      - SYNTH_PROVIDER_OLLAMA_API_KEY=${SYNTH_PROVIDER_OLLAMA_API_KEY:-}
      # Ollama: нативный базовый URL без /v1 — type: ollama ходит на /api/chat
      # (так применяются num_ctx/options, think и инструменты).
      # Для OpenAI-совместимого пути используйте type: openai/generic.
      - SYNTH_PROVIDER_OLLAMA_URL=${SYNTH_PROVIDER_OLLAMA_URL:-http://ollama:11434}
      - SYNTH_PROVIDER_OLLAMA_MODEL=${SYNTH_PROVIDER_OLLAMA_MODEL:-qwen3.8:27b}
      - SYNTH_PROVIDER_OLLAMA_TYPE=ollama
    volumes:
      - synth-data:/var/synth/data
    restart: unless-stopped

  # Опционально: Ollama для локального запуска LLM
  # Чтобы загрузить модель: docker compose exec ollama ollama pull qwen3.8:27b
  ollama:
    image: ollama/ollama:latest
    container_name: synth-ollama
    ports:
      - "11434:11434"
    environment:
      # Серверный дефолт контекстного окна Ollama. num_ctx можно задать и через
      # Synth (--num-ctx / SYNTH_PROVIDER_OLLAMA_NUM_CTX / поле API) — он
      # передаётся в теле нативного /api/chat и приоритетнее этого значения.
      # 262144 = 256k токенов; уменьшите, если не хватает памяти/VRAM.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-262144}
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    profiles:
      - ollama

volumes:
  synth-data:
  ollama-data:
