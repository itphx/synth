packages:
  - 'packages/*'

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

# Циклы core ↔ @itphx/synth-storage-postgres и core ↔ @itphx/synth-executor
# намеренные (core: optionalDependencies на драйвер и динамический import()
# исполнителя; оба пакета: peer/dev-deps на core). С pnpm ≥12 рекурсивные задачи
# (`pnpm typecheck`/`lint`/`test`) иначе падают с ERR_PNPM_TASK_CYCLE — разрешаем
# произвольный порядок; порядок сборки задают явные `--filter` в корневом `build`.
ignoreWorkspaceCycles: true

# Стабильность рекурсивных задач (`pnpm --recursive run test`): пакеты гоняются
# по одному. Иначе vitest четырёх пакетов конкурируют за CPU и PG-тесты деградации
# core ловят `Test timed out` (см. проверку CI-гейта).
workspaceConcurrency: 1
